<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="TUGLA - a retro brick cabinet for phone or desktop.">
<meta name="theme-color" content="#08090e">
<style>
  :root {
    color-scheme: dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>TUĞLA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  :root {
    --ink:   #08080a;
    --bezel: #2b2b30;
    --steel: #e8ecf7;
    --grey:  #8d8f99;
    --dim:   #33343a;
    --hot:   #ff6a2b;

    --red:    #cc3b26;
    --orange: #e07b39;
    --yellow: #d9c740;
    --green:  #4aa05a;

    --cell-font: "Press Start 2P", ui-monospace, "Courier New", monospace;
    --read-font: "VT323", ui-monospace, "Courier New", monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(120% 90% at 50% 0%, #1c1c20 0%, var(--ink) 62%),
      var(--ink);
    color: var(--steel);
    font-family: var(--read-font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .cabinet {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 12px 16px;
    padding-block: 10px 12px;
    max-width: 640px;
    margin-inline: auto;
  }

  /* ---- marquee ---- */
  .marquee { text-align: center; flex: 0 0 auto; }
  .marquee h1 {
    margin: 0;
    font-family: var(--cell-font);
    font-size: clamp(15px, 5.4vw, 26px);
    letter-spacing: 0.12em;
    background: linear-gradient(180deg,
      var(--red) 0%, var(--red) 28%,
      var(--orange) 28%, var(--orange) 52%,
      var(--yellow) 52%, var(--yellow) 76%,
      var(--green) 76%, var(--green) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 10px rgba(224, 123, 57, 0.3));
    text-wrap: balance;
  }
  .marquee p {
    margin: 4px 0 0;
    font-size: clamp(13px, 3.6vw, 17px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--grey);
  }

  /* ---- hud ---- */
  .hud {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    border: 1px solid var(--dim);
    background: linear-gradient(180deg, rgba(232,236,247,0.05), transparent);
    padding: 6px 3px;
  }
  .hud div { text-align: center; }
  .hud .k {
    display: block;
    font-family: var(--cell-font);
    font-size: 7px;
    letter-spacing: 0.1em;
    color: var(--grey);
  }
  .hud .v {
    display: block;
    margin-top: 5px;
    font-size: clamp(18px, 5.2vw, 23px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--steel);
  }
  .hud .best .v { color: var(--orange); }
  .hud .balls .v { letter-spacing: 0.08em; color: var(--yellow); }
  .hud .v.bump { animation: bump 240ms steps(3) 1; }
  @keyframes bump { 50% { transform: scale(1.22); } }

  /* ---- screen ---- */
  .stage {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .screen {
    position: relative;
    border: 2px solid var(--bezel);
    border-radius: 10px;
    background: #000;
    box-shadow:
      0 0 0 4px #141418,
      0 0 40px rgba(232, 236, 247, 0.06) inset,
      0 10px 34px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    touch-action: none;
    cursor: pointer;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .scan, .vignette { position: absolute; inset: 0; pointer-events: none; }
  .scan {
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.28) 0 1px, rgba(0,0,0,0) 1px 3px);
    mix-blend-mode: multiply;
  }
  .vignette {
    background: radial-gradient(112% 112% at 50% 45%, transparent 52%, rgba(0,0,0,0.7) 100%);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 11px;
    text-align: center;
    padding: 18px;
    background: rgba(6, 6, 8, 0.87);
    z-index: 3;
  }
  .overlay h2 {
    margin: 0;
    font-family: var(--cell-font);
    font-size: clamp(13px, 4.4vw, 19px);
    letter-spacing: 0.05em;
    color: var(--steel);
    text-shadow: 0 0 10px rgba(232, 236, 247, 0.35);
  }
  .overlay h2.over { color: var(--red); text-shadow: 0 0 12px rgba(204, 59, 38, 0.5); }
  .overlay p { margin: 0; font-size: clamp(16px, 4.2vw, 20px); letter-spacing: 0.06em; color: var(--grey); }
  .overlay p em { font-style: normal; color: var(--steel); }
  .blink { animation: blink 1.05s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }

  .banner {
    position: absolute;
    left: 0; right: 0;
    top: 26%;
    z-index: 2;
    text-align: center;
    font-family: var(--cell-font);
    font-size: clamp(11px, 3.4vw, 15px);
    letter-spacing: 0.06em;
    color: var(--yellow);
    text-shadow: 0 2px 0 #000, 0 0 14px rgba(217, 199, 64, 0.5);
    animation: banner 1.7s ease-out 1 forwards;
    pointer-events: none;
  }
  @keyframes banner {
    0%   { opacity: 0; transform: translateY(10px) scale(0.92); }
    18%  { opacity: 1; transform: translateY(0) scale(1); }
    76%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---- controls ---- */
  .controls {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    touch-action: none;
  }
  .controls button {
    flex: 1 1 0;
    height: 52px;
    font: inherit;
    font-size: 19px;
    color: var(--steel);
    background: linear-gradient(180deg, #2a2a30, #131317);
    border: 1px solid var(--dim);
    border-radius: 7px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: none;
  }
  .controls button:active, .controls button.held {
    background: var(--steel);
    color: #0b0b0d;
    border-color: var(--steel);
  }

  .sidekeys { flex: 0 0 auto; display: flex; gap: 6px; justify-content: center; }
  .sidekeys button {
    font-family: var(--cell-font);
    font-size: 7px;
    letter-spacing: 0.08em;
    padding: 8px 10px;
    color: var(--grey);
    background: #131317;
    border: 1px solid var(--dim);
    border-radius: 5px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .sidekeys button:active, .sidekeys button[aria-pressed="true"] { color: var(--steel); border-color: var(--steel); }

  button:focus-visible, .screen:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }

  .hint {
    flex: 0 0 auto;
    margin: 0;
    text-align: center;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--grey);
    opacity: 0.7;
  }

  @media (max-height: 700px) {
    .marquee p, .hint { display: none; }
    .controls button { height: 46px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blink, .hud .v.bump, .banner { animation: none; }
  }
</style>
</head>
<body>
<div class="cabinet">
  <header class="marquee">
    <h1>TU&#286;LA</h1>
    <p>Cabinet No. 03 &mdash; 1976</p>
  </header>

  <div class="hud">
    <div><span class="k">SCORE</span><span class="v" id="hScore">0</span></div>
    <div class="balls"><span class="k">BALLS</span><span class="v" id="hBalls">&#9679;&#9679;&#9679;</span></div>
    <div><span class="k">WALL</span><span class="v" id="hLevel">1</span></div>
    <div class="best"><span class="k">BEST</span><span class="v" id="hBest">0</span></div>
  </div>

  <div class="stage" id="stage">
    <div class="screen" id="screen" tabindex="0" aria-label="Breakout game screen">
      <canvas id="view"></canvas>
      <div class="scan"></div>
      <div class="vignette"></div>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">INSERT COIN</h2>
        <p id="ovBody">Drag to move the bat. Dig a tunnel and let it cook.</p>
        <p class="blink" id="ovBlink">&#9654; PRESS START</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <button data-hold="left" aria-label="Move left">&#9664;</button>
    <button data-hold="right" aria-label="Move right">&#9654;</button>
  </div>

  <div class="sidekeys">
    <button id="btnPause">PAUSE</button>
    <button id="btnSound" aria-pressed="true">SOUND ON</button>
    <button id="btnReset">RESTART</button>
  </div>

  <p class="hint">Drag anywhere on the screen &middot; arrows / A D &middot; SPACE serves &middot; P pauses</p>
</div>

<script>
(function () {
  "use strict";

  /* ---------------- constants (internal pixels) ---------------- */
  var VW = 160;
  var VH = 230;                     // recomputed from the screen shape
  var MARGIN = 5;                   // side walls
  var TOP = 10;                     // ceiling
  var COLS = 12, ROWS = 8;
  var BRICK_H = 5, BRICK_PAD = 1;
  var WALL_TOP = 26;
  var PAD_W = 30, PAD_W_SMALL = 20, PAD_H = 3;
  var BALL = 3;
  var HEAT_HOT = 0.55;              // above this the ball burns two deep
  var LIVES = 3;

  // classic row values, hardest rows worth the most
  var ROW_COLOR = ["#cc3b26", "#cc3b26", "#e07b39", "#e07b39", "#d9c740", "#d9c740", "#4aa05a", "#4aa05a"];
  var ROW_VALUE = [7, 7, 5, 5, 3, 3, 1, 1];

  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d");
  var screenEl = document.getElementById("screen");
  var stageEl = document.getElementById("stage");
  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ovTitle");
  var ovBody = document.getElementById("ovBody");
  var ovBlink = document.getElementById("ovBlink");
  var hScore = document.getElementById("hScore");
  var hBalls = document.getElementById("hBalls");
  var hLevel = document.getElementById("hLevel");
  var hBest = document.getElementById("hBest");
  var btnPause = document.getElementById("btnPause");
  var btnSound = document.getElementById("btnSound");
  var btnReset = document.getElementById("btnReset");

  ctx.imageSmoothingEnabled = false;

  var state = "idle";               // idle | running | paused | over
  var bricks, ball, pad, score, best, level, lives, heat, served, brokeTop;
  var flashes, shake, clearWait;
  var soundOn = true;
  var held = { left: false, right: false };
  var dragging = false;
  var bannerEl;

  /* ---------------- persistence ---------------- */
  function loadBest() {
    try { return parseInt(localStorage.getItem("tugla-best"), 10) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) { try { localStorage.setItem("tugla-best", String(v)); } catch (e) {} }
  function loadSound() {
    try { var v = localStorage.getItem("tugla-sound"); return v === null ? true : v === "1"; }
    catch (e) { return true; }
  }
  function saveSound(v) { try { localStorage.setItem("tugla-sound", v ? "1" : "0"); } catch (e) {} }

  /* ---------------- audio ---------------- */
  var actx = null;
  function blip(freq, dur, type, vol) {
    if (!soundOn) return;
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      if (actx.state === "suspended") actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, actx.currentTime);
      g.gain.setValueAtTime(vol || 0.05, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  /* ---------------- layout ---------------- */
  function fit() {
    var r = stageEl.getBoundingClientRect();
    var availW = r.width - 4, availH = r.height - 4;
    if (availW < 40 || availH < 40) return;

    var aspect = Math.max(0.58, Math.min(1.05, availW / availH));
    var w = Math.min(availW, availH * aspect);
    var h = w / aspect;

    screenEl.style.width = Math.floor(w) + 4 + "px";
    screenEl.style.height = Math.floor(h) + 4 + "px";

    VH = Math.max(180, Math.min(320, Math.round(VW * h / w)));
    canvas.width = VW;
    canvas.height = VH;
    ctx.imageSmoothingEnabled = false;
    if (pad) pad.y = VH - 16;
  }

  /* ---------------- game ---------------- */
  function buildWall() {
    bricks = [];
    // whole-pixel bricks, wall centred: at 160px across, a fractional brick
    // rounds its neighbours together and the mortar line disappears
    var span = VW - MARGIN * 2;
    var bw = Math.floor((span - (COLS - 1) * BRICK_PAD) / COLS);
    var used = COLS * bw + (COLS - 1) * BRICK_PAD;
    var x0 = MARGIN + Math.floor((span - used) / 2);
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        bricks.push({
          x: x0 + c * (bw + BRICK_PAD),
          y: WALL_TOP + r * (BRICK_H + BRICK_PAD),
          w: bw, h: BRICK_H, row: r, alive: true
        });
      }
    }
  }

  function reset(startNow) {
    score = 0;
    level = 1;
    lives = LIVES;
    brokeTop = false;
    flashes = [];
    shake = 0;
    clearWait = 0;
    best = loadBest();
    fit();
    pad = { x: VW / 2, y: VH - 16, w: PAD_W };
    buildWall();
    serve();
    setState(startNow ? "running" : "idle");
    syncHud();
    render(0);
  }

  function serve() {
    served = false;
    heat = 0;
    ball = { x: pad.x, y: pad.y - 4, vx: 0, vy: 0 };
  }

  function launch() {
    if (served) return;
    served = true;
    var sp = speed();
    var dir = Math.random() < 0.5 ? -1 : 1;
    ball.vx = dir * sp * 0.55;
    ball.vy = -sp * 0.83;
    blip(560, 0.05);
  }

  function speed() { return 74 + (level - 1) * 7; }

  function update(dt, now) {
    if (clearWait > 0) {
      clearWait -= dt;
      if (clearWait <= 0) {
        level++;
        brokeTop = false;
        pad.w = PAD_W;
        buildWall();
        serve();
        syncHud();
      }
      return;
    }

    // bat: buttons, or wherever the finger is
    var move = (held.right ? 1 : 0) - (held.left ? 1 : 0);
    if (move) pad.x += move * 118 * dt;
    pad.x = Math.max(MARGIN + pad.w / 2, Math.min(VW - MARGIN - pad.w / 2, pad.x));

    if (!served) {
      ball.x = pad.x;
      ball.y = pad.y - 4;
      return;
    }

    heat = Math.min(1, heat + dt * 0.2);

    // step in small increments so a hot ball cannot pass through a brick
    var boost = 1 + heat * 0.65;
    var dx = ball.vx * boost * dt, dy = ball.vy * boost * dt;
    var dist = Math.hypot(dx, dy);
    var steps = Math.max(1, Math.ceil(dist / 1.5));
    for (var i = 0; i < steps && served; i++) {
      substep(dx / steps, dy / steps);
    }

    for (var f = flashes.length - 1; f >= 0; f--) {
      flashes[f].t -= dt;
      if (flashes[f].t <= 0) flashes.splice(f, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 2.4);

    var left = 0;
    for (var b = 0; b < bricks.length; b++) if (bricks[b].alive) left++;
    if (left === 0 && clearWait <= 0) {
      clearWait = 1.1;
      score += 100 * level;
      banner("WALL " + level + " CLEARED");
      blip(700, 0.08); setTimeout(function () { blip(940, 0.14); }, 110);
      syncHud();
    }
  }

  function substep(dx, dy) {
    // horizontal
    ball.x += dx;
    if (ball.x - BALL / 2 < MARGIN) { ball.x = MARGIN + BALL / 2; ball.vx = Math.abs(ball.vx); tick(); }
    if (ball.x + BALL / 2 > VW - MARGIN) { ball.x = VW - MARGIN - BALL / 2; ball.vx = -Math.abs(ball.vx); tick(); }
    var hitX = brickAt();
    if (hitX) { ball.x -= dx; ball.vx = -ball.vx; smash(hitX, true); }

    // vertical
    ball.y += dy;
    if (ball.y - BALL / 2 < TOP) {
      ball.y = TOP + BALL / 2;
      ball.vy = Math.abs(ball.vy);
      tick();
      if (!brokeTop) {                 // the 1976 rule: break through, lose half your bat
        brokeTop = true;
        pad.w = PAD_W_SMALL;
        banner("BAT HALVED");
        blip(330, 0.12, "triangle");
      }
    }
    var hitY = brickAt();
    if (hitY) { ball.y -= dy; ball.vy = -ball.vy; smash(hitY, false); }

    // bat
    if (ball.vy > 0 &&
        ball.y + BALL / 2 >= pad.y && ball.y - BALL / 2 <= pad.y + PAD_H &&
        ball.x >= pad.x - pad.w / 2 - 1 && ball.x <= pad.x + pad.w / 2 + 1) {
      ball.y = pad.y - BALL / 2;
      var off = (ball.x - pad.x) / (pad.w / 2);        // -1 .. 1
      off = Math.max(-1, Math.min(1, off));
      var ang = off * 1.05;                            // up to ~60 degrees
      var sp = speed();
      ball.vx = Math.sin(ang) * sp;
      ball.vy = -Math.cos(ang) * sp;
      heat = 0;                                        // the bat is what cools it
      blip(480, 0.04);
    }

    if (ball.y - BALL / 2 > VH) lose();
  }

  function brickAt() {
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (ball.x + BALL / 2 < b.x || ball.x - BALL / 2 > b.x + b.w) continue;
      if (ball.y + BALL / 2 < b.y || ball.y - BALL / 2 > b.y + b.h) continue;
      return b;
    }
    return null;
  }

  function smash(b, sideways) {
    breakBrick(b);
    // a hot ball carries on into whatever is behind
    if (heat > HEAT_HOT) {
      for (var i = 0; i < bricks.length; i++) {
        var n = bricks[i];
        if (!n.alive) continue;
        var behind = sideways
          ? (Math.abs(n.y - b.y) < 1 && Math.abs(n.x - b.x) <= b.w + BRICK_PAD + 1 &&
             (ball.vx > 0 ? n.x < b.x : n.x > b.x))
          : (Math.abs(n.x - b.x) < 1 && Math.abs(n.y - b.y) <= b.h + BRICK_PAD + 1 &&
             (ball.vy > 0 ? n.y < b.y : n.y > b.y));
        if (behind) { breakBrick(n); break; }
      }
    }
  }

  function breakBrick(b) {
    b.alive = false;
    var value = ROW_VALUE[b.row] * 10;
    if (heat > HEAT_HOT) value *= 2;
    score += value;
    flashes.push({ x: b.x, y: b.y, w: b.w, h: b.h, t: 0.18 });
    shake = Math.max(shake, heat > HEAT_HOT ? 0.35 : 0.12);
    blip(300 + (ROWS - b.row) * 90, 0.045, "square", 0.05);
    if (score > best) { best = score; saveBest(best); }
    bump(hScore);
    syncHud();
  }

  function tick() { blip(240, 0.03, "square", 0.035); }

  function lose() {
    lives--;
    heat = 0;
    shake = 0.5;
    blip(180, 0.2, "sawtooth", 0.07);
    syncHud();
    if (lives <= 0) {
      setTimeout(function () { if (state === "running") setState("over"); }, 420);
      served = false;
      ball.vx = ball.vy = 0;
      return;
    }
    serve();
  }

  /* ---------------- rendering ---------------- */
  function render(now) {
    if (!bricks) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, VW, VH);

    ctx.save();
    if (shake > 0) {
      ctx.translate(Math.round((Math.random() - 0.5) * shake * 5),
                    Math.round((Math.random() - 0.5) * shake * 4));
    }

    // cabinet walls
    ctx.fillStyle = "#3a3b42";
    ctx.fillRect(0, 0, MARGIN - 1, VH);
    ctx.fillRect(VW - MARGIN + 1, 0, MARGIN - 1, VH);
    ctx.fillRect(0, TOP - 4, VW, 3);

    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      ctx.fillStyle = ROW_COLOR[b.row];
      ctx.fillRect(Math.round(b.x), b.y, Math.round(b.w), b.h);
      ctx.fillStyle = "rgba(255,255,255,0.20)";
      ctx.fillRect(Math.round(b.x), b.y, Math.round(b.w), 1);
      ctx.fillStyle = "rgba(0,0,0,0.30)";
      ctx.fillRect(Math.round(b.x), b.y + b.h - 1, Math.round(b.w), 1);
    }

    for (var f = 0; f < flashes.length; f++) {
      var fl = flashes[f];
      ctx.fillStyle = "rgba(255,255,255," + Math.min(0.85, fl.t * 4).toFixed(2) + ")";
      ctx.fillRect(Math.round(fl.x), fl.y, Math.round(fl.w), fl.h);
    }

    // bat
    ctx.fillStyle = heat > HEAT_HOT ? "#ffd8c0" : "#e8ecf7";
    ctx.fillRect(Math.round(pad.x - pad.w / 2), pad.y, Math.round(pad.w), PAD_H);
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(Math.round(pad.x - pad.w / 2), pad.y + PAD_H - 1, Math.round(pad.w), 1);

    // ball, with a trail that grows as it heats
    var trail = Math.round(heat * 6);
    for (var t = trail; t > 0; t--) {
      ctx.fillStyle = "rgba(255,120,40," + (0.09 * t).toFixed(2) + ")";
      ctx.fillRect(Math.round(ball.x - ball.vx * t * 0.009) - 1,
                   Math.round(ball.y - ball.vy * t * 0.009) - 1, BALL, BALL);
    }
    ctx.fillStyle = heatColor(heat);
    ctx.fillRect(Math.round(ball.x - BALL / 2), Math.round(ball.y - BALL / 2), BALL, BALL);

    ctx.restore();

    // heat gauge along the floor
    var gw = VW - MARGIN * 2;
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.fillRect(MARGIN, VH - 4, gw, 2);
    ctx.fillStyle = heatColor(heat);
    ctx.fillRect(MARGIN, VH - 4, Math.round(gw * heat), 2);
    if (heat > HEAT_HOT) {
      ctx.fillStyle = "#ff6a2b";
      ctx.fillRect(MARGIN + Math.round(gw * HEAT_HOT), VH - 6, 1, 6);
    }

    if (!served && state === "running") {
      ctx.fillStyle = "rgba(232,236,247,0.75)";
      ctx.fillRect(Math.round(pad.x) - 6, pad.y - 12, 12, 1);
      ctx.fillRect(Math.round(pad.x) - 1, pad.y - 16, 3, 5);
    }
  }

  function heatColor(h) {
    if (h < 0.3) return "#e8ecf7";
    if (h < HEAT_HOT) return "#ffd36b";
    if (h < 0.82) return "#ff9b3d";
    return "#ff4a28";
  }

  /* ---------------- hud + overlay ---------------- */
  function bump(el) {
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  function syncHud() {
    hScore.textContent = score;
    hLevel.textContent = level;
    hBest.textContent = best;
    var dots = "";
    for (var i = 0; i < Math.max(0, lives); i++) dots += "●";
    hBalls.textContent = dots || "–";
  }

  function banner(text) {
    if (bannerEl && bannerEl.parentNode) bannerEl.parentNode.removeChild(bannerEl);
    bannerEl = document.createElement("div");
    bannerEl.className = "banner";
    bannerEl.textContent = text;
    screenEl.appendChild(bannerEl);
    var mine = bannerEl;
    setTimeout(function () { if (mine.parentNode) mine.parentNode.removeChild(mine); }, 1800);
  }

  function setState(next) {
    state = next;
    btnPause.textContent = state === "paused" ? "RESUME" : "PAUSE";

    if (state === "running") { overlay.hidden = true; return; }
    overlay.hidden = false;
    ovTitle.classList.toggle("over", state === "over");

    if (state === "idle") {
      ovTitle.textContent = "INSERT COIN";
      ovBody.innerHTML = "Drag to move the bat. The ball <em>heats up</em> while it " +
                         "is away from you &mdash; hot, it doubles every brick and burns " +
                         "two deep. Dig a tunnel and let it cook up there.";
      ovBlink.innerHTML = "&#9654; PRESS START";
    } else if (state === "paused") {
      ovTitle.textContent = "PAUSED";
      ovBody.textContent = "Ball in hand.";
      ovBlink.innerHTML = "&#9654; TAP OR PRESS P";
    } else if (state === "over") {
      ovTitle.textContent = "GAME OVER";
      ovBody.innerHTML = "Scored <em>" + score + "</em> on wall <em>" + level + "</em>" +
                         (score >= best && score > 0 ? " &middot; <em>NEW BEST</em>"
                                                     : " &middot; best <em>" + best + "</em>");
      ovBlink.innerHTML = "&#9654; TAP TO PLAY AGAIN";
    }
  }

  function start() { lastTs = 0; setState("running"); }
  function togglePause() {
    if (state === "running") setState("paused");
    else if (state === "paused") start();
  }
  function primary() {
    if (state === "idle" || state === "paused") { start(); launch(); }
    else if (state === "over") reset(true);
    else launch();
  }

  /* ---------------- loop ---------------- */
  var lastTs = 0;
  function frame(now) {
    var dt = lastTs ? Math.min(0.05, (now - lastTs) / 1000) : 0;
    lastTs = now;
    if (state === "running") update(dt, now);
    render(now);
    requestAnimationFrame(frame);
  }

  /* ---------------- input ---------------- */
  var KEYS = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right" };

  window.addEventListener("keydown", function (ev) {
    var k = KEYS[ev.key];
    if (k) { ev.preventDefault(); if (state === "idle") start(); held[k] = true; return; }
    if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); primary(); }
    else if (ev.key === "p" || ev.key === "P") { ev.preventDefault(); togglePause(); }
    else if (ev.key === "r" || ev.key === "R") { ev.preventDefault(); reset(true); }
  });
  window.addEventListener("keyup", function (ev) {
    var k = KEYS[ev.key];
    if (k) { ev.preventDefault(); held[k] = false; }
  });
  window.addEventListener("blur", function () { held.left = held.right = false; });

  // the bat follows your finger anywhere on the glass, so it is never under it
  function aimFrom(ev) {
    var r = screenEl.getBoundingClientRect();
    if (!r.width) return;
    var x = (ev.clientX - r.left) / r.width * VW;
    pad.x = Math.max(MARGIN + pad.w / 2, Math.min(VW - MARGIN - pad.w / 2, x));
  }

  screenEl.addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    dragging = true;
    try { screenEl.setPointerCapture(ev.pointerId); } catch (e) {}
    if (state === "running") { aimFrom(ev); launch(); }
    else primary();
  });
  screenEl.addEventListener("pointermove", function (ev) {
    if (!dragging || state !== "running") return;
    ev.preventDefault();
    aimFrom(ev);
  });
  screenEl.addEventListener("pointerup", function () { dragging = false; });
  screenEl.addEventListener("pointercancel", function () { dragging = false; });
  screenEl.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });

  Array.prototype.forEach.call(document.querySelectorAll("[data-hold]"), function (b) {
    var k = b.dataset.hold;
    var press = function (ev) {
      ev.preventDefault();
      if (state === "idle") start();
      held[k] = true;
      b.classList.add("held");
      if (b.setPointerCapture && ev.pointerId !== undefined) {
        try { b.setPointerCapture(ev.pointerId); } catch (e) {}
      }
    };
    var release = function (ev) {
      if (ev) ev.preventDefault();
      held[k] = false;
      b.classList.remove("held");
    };
    b.addEventListener("pointerdown", press);
    b.addEventListener("pointerup", release);
    b.addEventListener("pointercancel", release);
    b.addEventListener("pointerleave", release);
    b.addEventListener("click", function (ev) { ev.preventDefault(); });
  });

  btnPause.addEventListener("click", togglePause);
  btnReset.addEventListener("click", function () { reset(true); });
  btnSound.addEventListener("click", function () {
    soundOn = !soundOn;
    saveSound(soundOn);
    btnSound.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    btnSound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    if (soundOn) blip(620, 0.05);
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && state === "running") setState("paused");
  });

  /* ---------------- boot ---------------- */
  function boot(saved) {
    soundOn = loadSound();
    btnSound.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    btnSound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    fit();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(stageEl);
    window.addEventListener("resize", fit);
    reset(false);
    if (saved && saved.best > best) { best = saved.best; saveBest(best); }
    syncHud();
    requestAnimationFrame(frame);
  }

  if (window.claude && window.claude.hot) {
    try { window.claude.hot.snapshot(function () { return { best: best || 0 }; }); } catch (e) {}
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(boot);
  } else {
    boot({});
  }
})();
</script>
</body>
</html>
