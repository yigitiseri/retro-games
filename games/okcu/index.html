<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="OKCU - a sunset archery range for phone or desktop.">
<meta name="theme-color" content="#08090e">
<style>
  :root {
    color-scheme: dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>OKÇU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  :root {
    --ink:    #120a1c;
    --bezel:  #33203f;
    --rose:   #ff8a7a;
    --violet: #a678ff;
    --dim:    #432a52;
    --pale:   #ffe6de;
    --gold:   #ffc75a;

    --cell-font: "Press Start 2P", ui-monospace, "Courier New", monospace;
    --read-font: "VT323", ui-monospace, "Courier New", monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(120% 90% at 50% 0%, #2c1440 0%, var(--ink) 62%),
      var(--ink);
    color: var(--pale);
    font-family: var(--read-font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .cabinet {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 12px 16px;
    padding-block: 10px 12px;
    max-width: 640px;
    margin-inline: auto;
  }

  /* ---- marquee ---- */
  .marquee { text-align: center; flex: 0 0 auto; }
  .marquee h1 {
    margin: 0;
    font-family: var(--cell-font);
    font-size: clamp(15px, 5.4vw, 26px);
    letter-spacing: 0.12em;
    color: var(--rose);
    text-shadow: 0 0 8px rgba(255, 138, 122, 0.5), 0 0 24px rgba(166, 120, 255, 0.35);
    text-wrap: balance;
  }
  .marquee p {
    margin: 4px 0 0;
    font-size: clamp(13px, 3.6vw, 17px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--violet);
    opacity: 0.85;
  }

  /* ---- hud ---- */
  .hud {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    border: 1px solid var(--dim);
    background: linear-gradient(180deg, rgba(255,138,122,0.07), transparent);
    padding: 6px 3px;
  }
  .hud div { text-align: center; }
  .hud .k {
    display: block;
    font-family: var(--cell-font);
    font-size: 7px;
    letter-spacing: 0.1em;
    color: var(--violet);
  }
  .hud .v {
    display: block;
    margin-top: 5px;
    font-size: clamp(18px, 5.2vw, 23px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--pale);
  }
  .hud .arrows .v { color: var(--gold); letter-spacing: 0.04em; }
  .hud .arrows .v.low { color: var(--rose); }
  .hud .best .v { color: var(--rose); }
  .hud .v.bump { animation: bump 240ms steps(3) 1; }
  @keyframes bump { 50% { transform: scale(1.22); } }

  /* ---- screen ---- */
  .stage { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .screen {
    position: relative;
    border: 2px solid var(--bezel);
    border-radius: 10px;
    background: #1a1030;
    box-shadow:
      0 0 0 4px #1d1128,
      0 0 40px rgba(166, 120, 255, 0.14) inset,
      0 10px 34px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    touch-action: none;
    cursor: crosshair;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .scan, .vignette { position: absolute; inset: 0; pointer-events: none; }
  .scan {
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.26) 0 1px, rgba(0,0,0,0) 1px 3px);
    mix-blend-mode: multiply;
  }
  .vignette {
    background: radial-gradient(112% 112% at 50% 45%, transparent 52%, rgba(0,0,0,0.7) 100%);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 11px;
    text-align: center;
    padding: 18px;
    background: rgba(12, 6, 20, 0.87);
    z-index: 3;
  }
  .overlay h2 {
    margin: 0;
    font-family: var(--cell-font);
    font-size: clamp(13px, 4.4vw, 19px);
    letter-spacing: 0.05em;
    color: var(--rose);
    text-shadow: 0 0 10px rgba(255, 138, 122, 0.45);
  }
  .overlay h2.over { color: #ff5b5b; text-shadow: 0 0 12px rgba(255, 91, 91, 0.5); }
  .overlay p { margin: 0; font-size: clamp(16px, 4.2vw, 20px); letter-spacing: 0.06em; color: var(--violet); }
  .overlay p em { font-style: normal; color: var(--pale); }
  .blink { animation: blink 1.05s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }

  .banner {
    position: absolute;
    left: 0; right: 0;
    top: 22%;
    z-index: 2;
    text-align: center;
    font-family: var(--cell-font);
    font-size: clamp(11px, 3.4vw, 15px);
    letter-spacing: 0.06em;
    color: var(--gold);
    text-shadow: 0 2px 0 #000, 0 0 14px rgba(255, 199, 90, 0.5);
    animation: banner 1.6s ease-out 1 forwards;
    pointer-events: none;
  }
  @keyframes banner {
    0%   { opacity: 0; transform: translateY(10px) scale(0.92); }
    18%  { opacity: 1; transform: translateY(0) scale(1); }
    76%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---- controls ---- */
  .controls { flex: 0 0 auto; display: flex; gap: 8px; touch-action: none; }
  .controls button {
    flex: 1 1 0;
    height: 50px;
    font: inherit;
    font-size: 18px;
    color: var(--pale);
    background: linear-gradient(180deg, #2b1a38, #1a0f26);
    border: 1px solid var(--dim);
    border-radius: 7px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: none;
  }
  .controls button:active, .controls button.held { background: var(--rose); color: #1a0f26; border-color: var(--rose); }
  .controls .loose {
    flex: 1.4 1 0;
    font-family: var(--cell-font);
    font-size: 9px;
    letter-spacing: 0.08em;
    color: #2a1020;
    background: linear-gradient(180deg, var(--rose), #c9524a);
    border-color: #ffb3a6;
  }

  .sidekeys { flex: 0 0 auto; display: flex; gap: 6px; justify-content: center; }
  .sidekeys button {
    font-family: var(--cell-font);
    font-size: 7px;
    letter-spacing: 0.08em;
    padding: 8px 10px;
    color: var(--violet);
    background: #1d1128;
    border: 1px solid var(--dim);
    border-radius: 5px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .sidekeys button:active, .sidekeys button[aria-pressed="true"] { color: var(--pale); border-color: var(--rose); }

  button:focus-visible, .screen:focus-visible { outline: 2px solid var(--pale); outline-offset: 2px; }

  .hint {
    flex: 0 0 auto;
    margin: 0;
    text-align: center;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--violet);
    opacity: 0.65;
  }

  @media (max-height: 700px) {
    .marquee p, .hint { display: none; }
    .controls button { height: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blink, .hud .v.bump, .banner { animation: none; }
  }
</style>
</head>
<body>
<div class="cabinet">
  <header class="marquee">
    <h1>OK&#199;U</h1>
    <p>Cabinet No. 09 &mdash; 1982</p>
  </header>

  <div class="hud">
    <div class="arrows"><span class="k">ARROWS</span><span class="v" id="hArrows">&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;</span></div>
    <div><span class="k">SCORE</span><span class="v" id="hScore">0</span></div>
    <div><span class="k">WIND</span><span class="v" id="hWind">&mdash;</span></div>
    <div class="best"><span class="k">BEST</span><span class="v" id="hBest">0</span></div>
  </div>

  <div class="stage" id="stage">
    <div class="screen" id="screen" tabindex="0" aria-label="Archery game screen">
      <canvas id="view"></canvas>
      <div class="scan"></div>
      <div class="vignette"></div>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">INSERT COIN</h2>
        <p id="ovBody">Drag back to draw. Release to loose.</p>
        <p class="blink" id="ovBlink">&#9654; PRESS START</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <button data-hold="up" aria-label="Raise aim">&#9650;</button>
    <button data-hold="down" aria-label="Lower aim">&#9660;</button>
    <button class="loose" id="btnLoose">LOOSE</button>
  </div>

  <div class="sidekeys">
    <button id="btnPause">PAUSE</button>
    <button id="btnSound" aria-pressed="true">SOUND ON</button>
    <button id="btnReset">RESTART</button>
  </div>

  <p class="hint">Drag anywhere and pull back &middot; line them up and one arrow takes the lot &middot; P pauses</p>
</div>

<script>
(function () {
  "use strict";

  /* ---------------- constants (internal pixels) ---------------- */
  var VW = 200;
  var VH = 260;                     // recomputed from the screen shape
  var GROUND = 0;                   // set by fit()
  var ARCHER_X = 30;

  var GRAV = 96;
  var MIN_SPEED = 96, MAX_SPEED = 268;
  var MAX_DRAW = 58;                // internal px of pull for full power
  var START_ARROWS = 6;
  var MAX_ARROWS = 12;
  var WIND_MAX = 30;

  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d");
  var screenEl = document.getElementById("screen");
  var stageEl = document.getElementById("stage");
  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ovTitle");
  var ovBody = document.getElementById("ovBody");
  var ovBlink = document.getElementById("ovBlink");
  var hArrows = document.getElementById("hArrows");
  var hScore = document.getElementById("hScore");
  var hWind = document.getElementById("hWind");
  var hBest = document.getElementById("hBest");
  var btnLoose = document.getElementById("btnLoose");
  var btnPause = document.getElementById("btnPause");
  var btnSound = document.getElementById("btnSound");
  var btnReset = document.getElementById("btnReset");

  ctx.imageSmoothingEnabled = false;

  var state = "idle";
  var balloons, knots, shafts, stuck, bursts, recovered, scraps, quiver, score, best, wind, windTarget;
  var aim, spawnIn, elapsed, bannerEl, shake;
  var soundOn = true;
  var held = { up: false, down: false };

  /* ---------------- persistence ---------------- */
  function loadBest() {
    try { return parseInt(localStorage.getItem("okcu-best"), 10) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) { try { localStorage.setItem("okcu-best", String(v)); } catch (e) {} }
  function loadSound() {
    try { var v = localStorage.getItem("okcu-sound"); return v === null ? true : v === "1"; }
    catch (e) { return true; }
  }
  function saveSound(v) { try { localStorage.setItem("okcu-sound", v ? "1" : "0"); } catch (e) {} }

  /* ---------------- audio ---------------- */
  var actx = null;
  function blip(freq, dur, type, vol) {
    if (!soundOn) return;
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      if (actx.state === "suspended") actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, actx.currentTime);
      g.gain.setValueAtTime(vol || 0.05, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  function twang(power) {
    if (!soundOn) return;
    var a = actx || (function () { try { var AC = window.AudioContext || window.webkitAudioContext; return AC ? (actx = new AC()) : null; } catch (e) { return null; } })();
    if (!a) return;
    try {
      if (a.state === "suspended") a.resume();
      var o = a.createOscillator(), g = a.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(180 + power * 120, a.currentTime);
      o.frequency.exponentialRampToValueAtTime(70, a.currentTime + 0.18);
      g.gain.setValueAtTime(0.06, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.2);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + 0.2);
    } catch (e) {}
  }

  /* ---------------- layout ---------------- */
  function fit() {
    var r = stageEl.getBoundingClientRect();
    var availW = r.width - 4, availH = r.height - 4;
    if (availW < 40 || availH < 40) return;

    // the field takes the shape of the screen: a tall phone gets more sky
    var aspect = Math.max(0.74, Math.min(1.5, availW / availH));
    var w = Math.min(availW, availH * aspect);
    var h = w / aspect;

    screenEl.style.width = Math.floor(w) + 4 + "px";
    screenEl.style.height = Math.floor(h) + 4 + "px";

    VH = Math.max(140, Math.min(275, Math.round(VW * h / w)));
    canvas.width = VW;
    canvas.height = VH;
    ctx.imageSmoothingEnabled = false;
    GROUND = VH - 22;
  }

  /* ---------------- game ---------------- */
  var BALLOON_COLORS = ["#e8493f", "#f0a92e", "#3fb0e8", "#5fd08a", "#c86fe0"];

  function reset(startNow) {
    fit();
    balloons = [];
    knots = [];
    shafts = [];
    stuck = [];
    bursts = [];
    recovered = [];
    scraps = [];
    quiver = START_ARROWS;
    score = 0;
    elapsed = 0;
    spawnIn = 0.6;
    shake = 0;
    wind = 0;
    windTarget = (Math.random() * 2 - 1) * WIND_MAX * 0.6;
    aim = { angle: -0.72, power: 0.62, drawing: false, sx: 0, sy: 0 };
    best = loadBest();
    setState(startNow ? "running" : "idle");
    syncHud();
    render(0);
  }

  function spawn() {
    var pair = Math.random() < 0.28;
    var x = 96 + Math.random() * (VW - 118);
    var rise = 20 + Math.random() * 14 + Math.min(14, elapsed * 0.35);

    if (pair) {
      // two on one string: the knot below them is worth both
      var knot = { x: x, y: VH + 16, rise: rise * 0.92, dead: false };
      knots.push(knot);
      for (var i = 0; i < 2; i++) {
        balloons.push({
          x: x + (i === 0 ? -7 : 7), y: VH + 6 - i * 9,
          r: 5, c: (Math.random() * BALLOON_COLORS.length) | 0,
          rise: knot.rise, bob: Math.random() * 6, knot: knot, off: i === 0 ? -7 : 7
        });
      }
    } else {
      balloons.push({
        x: x, y: VH + 8,
        r: 5 + (Math.random() < 0.3 ? 1 : 0),
        c: (Math.random() * BALLOON_COLORS.length) | 0,
        rise: rise, bob: Math.random() * 6, knot: null, off: 0
      });
    }
  }

  function gripY() { return GROUND - 12; }
  function gripX() { return ARCHER_X + 9; }

  function loose() {
    if (state !== "running" || quiver <= 0) return;
    quiver--;
    var sp = MIN_SPEED + aim.power * (MAX_SPEED - MIN_SPEED);
    shafts.push({
      x: gripX() + Math.cos(aim.angle) * 10,
      y: gripY() + Math.sin(aim.angle) * 10,
      vx: Math.cos(aim.angle) * sp,
      vy: Math.sin(aim.angle) * sp,
      hits: 0
    });
    twang(aim.power);
    bump(hArrows);
    syncHud();
  }

  function update(dt) {
    elapsed += dt;

    wind += (windTarget - wind) * Math.min(1, dt * 0.5);
    if (Math.random() < dt * 0.08) windTarget = (Math.random() * 2 - 1) * WIND_MAX;

    if (held.up) aim.angle = Math.max(-1.45, aim.angle - 1.1 * dt);
    if (held.down) aim.angle = Math.min(0.25, aim.angle + 1.1 * dt);

    spawnIn -= dt;
    if (spawnIn <= 0) {
      spawn();
      spawnIn = Math.max(0.75, 1.9 - elapsed * 0.014);
    }

    // balloons rise, and a tether keeps its pair together
    for (var i = balloons.length - 1; i >= 0; i--) {
      var b = balloons[i];
      b.bob += dt;
      b.y -= b.rise * dt;
      if (b.knot) b.x = b.knot.x + b.off;
      if (b.y < -12) balloons.splice(i, 1);
    }
    for (var k = knots.length - 1; k >= 0; k--) {
      knots[k].y -= knots[k].rise * dt;
      if (knots[k].y < -20) knots.splice(k, 1);
    }
    pruneKnots();

    // a cut string has nothing holding it up any more
    for (var sc = scraps.length - 1; sc >= 0; sc--) {
      var cp = scraps[sc];
      cp.vy += GRAV * 0.55 * dt;
      cp.y += cp.vy * dt;
      cp.x += cp.sway * dt;
      cp.t -= dt;
      if (cp.t <= 0 || cp.y > VH) scraps.splice(sc, 1);
    }

    // arrows
    for (var a = shafts.length - 1; a >= 0; a--) {
      var s = shafts[a];
      s.vy += GRAV * dt;
      s.vx += wind * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;

      var done = false;

      // An arrow does not stop at the first balloon. It runs on through
      // everything in its path, costing a little speed each time it punches
      // through, and each one further down the line is worth more.
      for (var kk = knots.length - 1; kk >= 0; kk--) {
        var kn = knots[kk];
        if (kn.dead) continue;
        if (Math.abs(s.x - kn.x) < 4 && Math.abs(s.y - kn.y) < 4) {
          s.hits += cutKnot(kn, s);
          s.vx *= 0.9; s.vy *= 0.9;
        }
      }

      for (var bi = balloons.length - 1; bi >= 0; bi--) {
        var bb = balloons[bi];
        var by = bb.y + Math.sin(bb.bob * 1.4) * 2;
        var dx = s.x - bb.x, dy = s.y - by;
        if (dx * dx + dy * dy <= (bb.r + 2) * (bb.r + 2)) {
          s.hits++;
          popBalloon(bi, s.hits);
          skewer(s.hits);
          s.vx *= 0.93; s.vy *= 0.93;
        }
      }

      if (!done && s.y >= GROUND) {
        // a miss stays in the grass, and that arrow is gone
        stuck.push({ x: Math.max(4, Math.min(VW - 4, s.x)), a: Math.atan2(s.vy, s.vx) });
        if (stuck.length > 14) stuck.shift();
        blip(120, 0.07, "sawtooth", 0.04);
        done = true;
      }
      if (!done && (s.x > VW + 14 || s.x < -14 || s.y < -80)) done = true;

      if (done) shafts.splice(a, 1);
    }

    for (var bu = bursts.length - 1; bu >= 0; bu--) {
      bursts[bu].t -= dt;
      if (bursts[bu].t <= 0) bursts.splice(bu, 1);
    }
    for (var rc = recovered.length - 1; rc >= 0; rc--) {
      var rv = recovered[rc];
      rv.t -= dt;
      rv.y -= 26 * dt;
      rv.x += (gripX() - rv.x) * Math.min(1, dt * 1.6);   // drifting home
      if (rv.t <= 0) recovered.splice(rc, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 2.5);

    if (quiver <= 0 && shafts.length === 0) return outOfArrows();
  }

  function popBalloon(index, mult) {
    var b = balloons[index];
    var by = b.y + Math.sin(b.bob * 1.4) * 2;
    // the higher you take it, the more it is worth
    var height = Math.max(0, GROUND - by);
    var points = (10 + Math.round(height / 12) * 5) * mult;
    score += points;
    if (quiver < MAX_ARROWS) {
      quiver++;
      recovered.push({ x: b.x, y: by, t: 0.7 });   // an arrow floats back to you
    }
    if (b.knot) b.knot.cut = true;   // so an emptied string falls away
    bursts.push({ x: b.x, y: by, c: b.c, t: 0.45 });
    balloons.splice(index, 1);
    blip(620 + Math.round(height), 0.07, "square", 0.05);
    if (score > best) { best = score; saveBest(best); }
    bump(hScore);
    bump(hArrows);
    shake = Math.max(shake, 0.18);
    syncHud();
    return points;
  }

  // A knot with no balloons left on it is just a white dot in the sky. Drop it.
  function pruneKnots() {
    for (var k = knots.length - 1; k >= 0; k--) {
      var kn = knots[k];
      var held = false;
      for (var i = 0; i < balloons.length; i++) {
        if (balloons[i].knot === kn) { held = true; break; }
      }
      if (held) continue;
      knots.splice(k, 1);
      // only a knot we actually shot free flutters down; one whose balloons
      // simply climbed off the top goes with them
      if (kn.cut && kn.y > -4 && kn.y < VH) {
        scraps.push({ x: kn.x, y: kn.y, vy: -8, sway: wind * 0.35, t: 1.1 });
      }
    }
  }

  function cutKnot(kn, shaft) {
    kn.dead = true;
    kn.cut = true;
    var freed = 0;
    for (var i = balloons.length - 1; i >= 0; i--) {
      if (balloons[i].knot === kn) { popBalloon(i, 2); freed++; }
    }
    for (var k = knots.length - 1; k >= 0; k--) {
      if (knots[k] !== kn) continue;
      knots.splice(k, 1);
      scraps.push({ x: kn.x, y: kn.y, vy: -8, sway: wind * 0.35, t: 1.1 });
    }
    if (freed > 1) {
      banner("KNOT ×" + freed);
      blip(880, 0.12, "triangle", 0.06);
      shake = 0.4;
    }
    return freed;
  }

  // one arrow, several balloons: say so
  function skewer(n) {
    if (n < 2) return;
    banner("SKEWER ×" + n);
    blip(700 + n * 110, 0.12, "triangle", 0.06);
    shake = Math.max(shake, 0.3);
  }

  function outOfArrows() {
    if (state !== "running") return;
    blip(200, 0.25, "sawtooth", 0.07);
    setTimeout(function () { blip(130, 0.35, "sawtooth", 0.06); }, 140);
    setState("over");
  }

  /* ---------------- rendering ---------------- */
  var SKY = ["#2b1b4a", "#43225a", "#6b2f63", "#a3405f", "#d4614f", "#f4874c", "#ffb35f"];

  var KIT = {
    h: "#2f7a34", H: "#1f5a26", f: "#e8493f", s: "#e8b489", e: "#2a1810",
    t: "#4a9c42", d: "#2f6f31", b: "#4a2c18", l: "#8f5a33", q: "#7a4a2a",
    a: "#e8ddc4", r: "#d8452f"
  };
  var ARCHER = [
    "...r..f.....",
    "...a.fff....",
    "..HaHHHH....",
    ".HhhhhhhH...",
    "..hhhhhhh...",
    "...sssss....",
    "...ssess....",
    "...sssss....",
    "..ttttttt...",
    ".qtttttttt..",
    ".qtttttttt..",
    ".qdttttttt..",
    "..dtttttt...",
    "..bbbbbbb...",
    "..dddddd....",
    "..dddddd....",
    "...dd.dd....",
    "...ll.ll....",
    "...ll.ll....",
    "..bbb.bbb...",
    "..bbb.bbb..."
  ];

  function render(now) {
    if (!balloons) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.save();
    if (shake > 0) {
      ctx.translate(Math.round((Math.random() - 0.5) * shake * 5),
                    Math.round((Math.random() - 0.5) * shake * 4));
    }

    drawSky();
    drawHills();
    drawGround();
    drawPennant(now);
    drawStuck();
    drawTethers();
    drawBalloons(now);
    drawBursts();
    drawRecovered();
    drawShafts();
    drawArcher(now);
    if (state === "running") drawAim(now);

    ctx.restore();
  }

  function drawSky() {
    var band = Math.ceil(GROUND / SKY.length);
    for (var i = 0; i < SKY.length; i++) {
      ctx.fillStyle = SKY[i];
      ctx.fillRect(0, i * band, VW, band + 1);
    }
    ctx.fillStyle = "rgba(255, 216, 138, 0.18)";
    ctx.beginPath(); ctx.arc(150, GROUND - 26, 26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd88a";
    ctx.beginPath(); ctx.arc(150, GROUND - 26, 15, 0, Math.PI * 2); ctx.fill();
  }

  function drawHills() {
    ctx.fillStyle = "#4a2352";
    for (var x = 0; x < VW; x += 2) {
      var h = 16 + Math.sin(x * 0.045) * 7 + Math.sin(x * 0.017 + 2) * 6;
      ctx.fillRect(x, GROUND - h, 2, h);
    }
    ctx.fillStyle = "#241534";
    for (var x2 = 0; x2 < VW; x2 += 2) {
      var h2 = 9 + Math.sin(x2 * 0.07 + 1.2) * 4 + Math.sin(x2 * 0.021) * 3;
      ctx.fillRect(x2, GROUND - h2, 2, h2);
    }
    for (var t = 8; t < VW; t += 27) {
      var th = 10 + ((t * 7) % 5);
      ctx.fillStyle = "#1a0f26";
      for (var row = 0; row < th; row += 2) {
        var half = Math.max(1, Math.round((1 - row / th) * 4));
        ctx.fillRect(t - half, GROUND - 8 - row, half * 2 + 1, 2);
      }
    }
  }

  function drawGround() {
    ctx.fillStyle = "#1d2a1c";
    ctx.fillRect(0, GROUND, VW, VH - GROUND);
    ctx.fillStyle = "#2b3d26";
    ctx.fillRect(0, GROUND, VW, 2);
    ctx.fillStyle = "#16201a";
    ctx.fillRect(0, GROUND + 8, VW, VH - GROUND - 8);
    ctx.fillStyle = "#35512c";
    var lean = Math.round(wind / 18);
    for (var g = 2; g < VW; g += 7) {
      ctx.fillRect(g, GROUND - 2, 1, 2);
      ctx.fillRect(g + lean, GROUND - 3, 1, 1);
    }
  }

  // the wind lives in the world: the pennant is the readout, the HUD confirms it
  function drawPennant(now) {
    var x = 74, y = GROUND;
    ctx.fillStyle = "#3b2a26";
    ctx.fillRect(x, y - 30, 1, 30);
    var dir = wind >= 0 ? 1 : -1;
    var strength = Math.min(1, Math.abs(wind) / WIND_MAX);
    ctx.fillStyle = "#ff8a7a";
    for (var i = 0; i < 9; i++) {
      var wob = Math.round(Math.sin(now / 240 + i * 0.5) * (0.6 + strength * 1.6));
      var len = Math.round(2 + strength * 7);
      if (i > len) break;
      ctx.fillRect(x + dir * (1 + i), y - 30 + wob, 1, 5 - Math.floor(i / 3));
    }
  }

  function drawStuck() {
    for (var i = 0; i < stuck.length; i++) {
      var a = stuck[i];
      ctx.save();
      ctx.translate(Math.round(a.x), GROUND);
      ctx.rotate(a.a);
      ctx.fillStyle = "#b7a98d";
      ctx.fillRect(-9, 0, 11, 1);
      ctx.fillStyle = "#8a4b42";
      ctx.fillRect(-10, -1, 3, 1);
      ctx.fillRect(-10, 1, 3, 1);
      ctx.restore();
    }
  }

  function drawTethers() {
    ctx.strokeStyle = "rgba(255,230,222,0.45)";
    ctx.lineWidth = 1;
    for (var i = 0; i < balloons.length; i++) {
      var b = balloons[i];
      if (!b.knot) continue;
      var by = b.y + Math.sin(b.bob * 1.4) * 2;
      ctx.beginPath();
      ctx.moveTo(b.x, by + b.r);
      ctx.lineTo(b.knot.x, b.knot.y);
      ctx.stroke();
    }
    for (var k = 0; k < knots.length; k++) {
      ctx.fillStyle = "#ffe6de";
      ctx.fillRect(knots[k].x - 1, knots[k].y - 1, 3, 3);
    }
    for (var c = 0; c < scraps.length; c++) {
      var cp = scraps[c];
      ctx.globalAlpha = Math.min(1, cp.t / 0.6);
      ctx.fillStyle = "#ffe6de";
      ctx.fillRect(Math.round(cp.x) - 1, Math.round(cp.y) - 1, 3, 3);
      ctx.strokeStyle = "rgba(255,230,222,0.4)";
      ctx.beginPath();
      ctx.moveTo(cp.x, cp.y);
      ctx.lineTo(cp.x + Math.sin(cp.t * 9) * 2, cp.y - 5);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function drawBalloons(now) {
    for (var i = 0; i < balloons.length; i++) {
      var b = balloons[i];
      var y = b.y + Math.sin(b.bob * 1.4) * 2;
      if (!b.knot) {
        ctx.fillStyle = "rgba(255,230,222,0.4)";
        for (var s = 0; s < 7; s++) {
          ctx.fillRect(Math.round(b.x + Math.sin(b.bob + s * 0.6) * 1.2), Math.round(y + b.r + s), 1, 1);
        }
      }
      ctx.fillStyle = BALLOON_COLORS[b.c];
      ctx.beginPath(); ctx.arc(b.x, y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(b.x - 1, y + b.r - 1, 3, 3);
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.fillRect(b.x - b.r + 2, y - b.r + 2, 2, 3);
      ctx.fillStyle = "rgba(0,0,0,0.22)";
      ctx.fillRect(b.x + b.r - 3, y - 1, 2, 4);
    }
  }

  function drawBursts() {
    for (var i = 0; i < bursts.length; i++) {
      var p = bursts[i];
      var t = 1 - p.t / 0.45;
      ctx.fillStyle = BALLOON_COLORS[p.c];
      for (var j = 0; j < 8; j++) {
        var a = (j / 8) * Math.PI * 2;
        var d = 2 + t * 12;
        ctx.fillRect(Math.round(p.x + Math.cos(a) * d), Math.round(p.y + Math.sin(a) * d), 2, 2);
      }
    }
  }

  // a small gold arrow lifting off each pop: that is the one you just earned
  function drawRecovered() {
    for (var i = 0; i < recovered.length; i++) {
      var r = recovered[i];
      var fade = Math.min(1, r.t / 0.45);
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(Math.round(r.x), Math.round(r.y));
      ctx.rotate(-0.9);
      ctx.fillStyle = "#ffc75a";
      ctx.fillRect(-4, 0, 7, 1);
      ctx.fillRect(2, -1, 2, 3);
      ctx.fillStyle = "#fff0c8";
      ctx.fillRect(-5, -1, 2, 1);
      ctx.fillRect(-5, 1, 2, 1);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  function drawShafts() {
    for (var i = 0; i < shafts.length; i++) {
      var s = shafts[i];
      ctx.save();
      ctx.translate(Math.round(s.x), Math.round(s.y));
      ctx.rotate(Math.atan2(s.vy, s.vx));
      ctx.fillStyle = s.hits ? "#ffd9a0" : "#e8ddc4";
      ctx.fillRect(-9, 0, 12, 1);
      ctx.fillStyle = s.hits ? "#ffe6b8" : "#cfd6e0";
      ctx.fillRect(3, -1, 3, 3);
      ctx.fillStyle = "#d8452f";
      ctx.fillRect(-10, -1, 3, 1);
      ctx.fillRect(-10, 1, 3, 1);
      ctx.restore();
    }
  }

  function drawArcher(now) {
    var x = ARCHER_X - 6, y = GROUND - ARCHER.length + 1;

    for (var r = 0; r < ARCHER.length; r++) {
      var row = ARCHER[r], lastLit = -1;
      for (var c = 0; c < row.length; c++) {
        var ch = row.charAt(c);
        if (ch === ".") continue;
        ctx.fillStyle = KIT[ch];
        ctx.fillRect(x + c, y + r, 1, 1);
        lastLit = c;
      }
      if (lastLit >= 0) {
        ctx.fillStyle = "rgba(255, 179, 95, 0.55)";
        ctx.fillRect(x + lastLit, y + r, 1, 1);
      }
    }

    var sh = y + 9;
    ctx.fillStyle = KIT.t;
    ctx.fillRect(x + 8, sh, 3, 2);
    ctx.fillStyle = KIT.s;
    ctx.fillRect(x + 11, sh, 4, 2);
    ctx.fillStyle = KIT.t;
    ctx.fillRect(x + 4, sh, 3, 2);
    ctx.fillStyle = KIT.s;
    ctx.fillRect(x + 2, sh - 1, 3, 2);

    // the bow turns with the aim, and the string comes back with the power
    var pull = 3 + aim.power * 7;
    ctx.save();
    ctx.translate(gripX(), gripY());
    ctx.rotate(aim.angle);
    ctx.strokeStyle = "#c98a3c";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 10, -1.25, 1.25); ctx.stroke();
    ctx.strokeStyle = "#8a5a24";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 10, -1.25, -0.95); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 10, 0.95, 1.25); ctx.stroke();

    ctx.strokeStyle = "#ffe6de";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Math.cos(-1.25) * 10, Math.sin(-1.25) * 10);
    ctx.lineTo(-pull, 0);
    ctx.lineTo(Math.cos(1.25) * 10, Math.sin(1.25) * 10);
    ctx.stroke();

    if (quiver > 0) {
      ctx.fillStyle = "#e8ddc4";
      ctx.fillRect(-pull, -1, 14 + pull, 1);
      ctx.fillStyle = "#cfd6e0";
      ctx.fillRect(12, -2, 3, 3);
      ctx.fillStyle = "#d8452f";
      ctx.fillRect(-pull - 1, -2, 3, 1);
      ctx.fillRect(-pull - 1, 0, 3, 1);
    }
    ctx.restore();
  }

  // a short arc of dots: the shape of the shot, not the answer to it
  function drawAim(now) {
    var sp = MIN_SPEED + aim.power * (MAX_SPEED - MIN_SPEED);
    var x = gripX() + Math.cos(aim.angle) * 10;
    var y = gripY() + Math.sin(aim.angle) * 10;
    var vx = Math.cos(aim.angle) * sp, vy = Math.sin(aim.angle) * sp;
    var dots = aim.drawing ? 22 : 14;
    for (var i = 1; i <= dots; i++) {
      var t = i * 0.055;
      var px = x + vx * t + 0.5 * wind * t * t;
      var py = y + vy * t + 0.5 * GRAV * t * t;
      if (py > GROUND || px > VW) break;
      var fade = (1 - i / dots) * (aim.drawing ? 0.95 : 0.5);
      ctx.fillStyle = "rgba(255, 230, 222," + fade.toFixed(2) + ")";
      ctx.fillRect(Math.round(px), Math.round(py), i % 3 === 0 ? 2 : 1, i % 3 === 0 ? 2 : 1);
    }
  }

  /* ---------------- hud + overlay ---------------- */
  function bump(el) {
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  function syncHud() {
    var dots = "";
    for (var i = 0; i < Math.min(quiver, 10); i++) dots += "●";
    if (quiver > 10) dots += "+";
    hArrows.textContent = dots || "–";
    hArrows.className = "v" + (quiver <= 2 ? " low" : "");
    hScore.textContent = score;
    hBest.textContent = best;
    var w = Math.round(Math.abs(wind) / 6);
    hWind.textContent = w === 0 ? "–" : (wind > 0 ? "→" : "←") + w;
  }

  function banner(text) {
    if (bannerEl && bannerEl.parentNode) bannerEl.parentNode.removeChild(bannerEl);
    bannerEl = document.createElement("div");
    bannerEl.className = "banner";
    bannerEl.textContent = text;
    screenEl.appendChild(bannerEl);
    var mine = bannerEl;
    setTimeout(function () { if (mine.parentNode) mine.parentNode.removeChild(mine); }, 1700);
  }

  function setState(next) {
    state = next;
    btnPause.textContent = state === "paused" ? "RESUME" : "PAUSE";
    if (state === "running") { overlay.hidden = true; return; }
    overlay.hidden = false;
    ovTitle.classList.toggle("over", state === "over");

    if (state === "idle") {
      ovTitle.textContent = "INSERT COIN";
      ovBody.innerHTML = "Drag anywhere and pull <em>back</em> to draw; let go to loose. " +
                         "An arrow does not stop at the first balloon &mdash; it runs on " +
                         "through whatever is in line, and each one further down is worth " +
                         "more. <em>Every pop hands an arrow back</em>, so a good eye keeps the " +
                         "day going; every miss stays in the grass.";
      ovBlink.innerHTML = "&#9654; PRESS START";
    } else if (state === "paused") {
      ovTitle.textContent = "PAUSED";
      ovBody.textContent = "Bow at rest.";
      ovBlink.innerHTML = "&#9654; TAP OR PRESS P";
    } else if (state === "over") {
      ovTitle.textContent = "OUT OF ARROWS";
      ovBody.innerHTML = "Scored <em>" + score + "</em>" +
                         (score >= best && score > 0 ? " &middot; <em>NEW BEST</em>"
                                                     : " &middot; best <em>" + best + "</em>");
      ovBlink.innerHTML = "&#9654; TAP TO SHOOT AGAIN";
    }
  }

  function start() { lastTs = 0; setState("running"); }
  function togglePause() {
    if (state === "running") setState("paused");
    else if (state === "paused") start();
  }

  /* ---------------- loop ---------------- */
  var lastTs = 0;
  function frame(now) {
    requestAnimationFrame(frame);          // queued first: one bad frame is not fatal
    var dt = lastTs ? Math.min(0.05, (now - lastTs) / 1000) : 0;
    lastTs = now;
    if (state === "running") update(dt);
    render(now);
  }

  /* ---------------- input ---------------- */
  function screenPos(ev) {
    var r = screenEl.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) / r.width * VW,
      y: (ev.clientY - r.top) / r.height * VH
    };
  }

  screenEl.addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    if (state === "idle" || state === "paused") { start(); return; }
    if (state === "over") { reset(true); return; }
    var p = screenPos(ev);
    aim.drawing = true;
    aim.sx = p.x;
    aim.sy = p.y;
    try { screenEl.setPointerCapture(ev.pointerId); } catch (e) {}
  });

  screenEl.addEventListener("pointermove", function (ev) {
    if (!aim.drawing || state !== "running") return;
    ev.preventDefault();
    var p = screenPos(ev);
    var dx = aim.sx - p.x, dy = aim.sy - p.y;      // pulling back points the shot
    var len = Math.hypot(dx, dy);
    if (len < 3) return;
    aim.angle = Math.atan2(dy, dx);
    aim.angle = Math.max(-1.45, Math.min(0.25, aim.angle));
    aim.power = Math.min(1, len / MAX_DRAW);
  });

  function release(ev) {
    if (!aim.drawing) return;
    if (ev) ev.preventDefault();
    aim.drawing = false;
    if (aim.power > 0.12) loose();
  }
  screenEl.addEventListener("pointerup", release);
  screenEl.addEventListener("pointercancel", function () { aim.drawing = false; });
  screenEl.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });

  var KEYS = { ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down" };
  window.addEventListener("keydown", function (ev) {
    var k = KEYS[ev.key];
    if (k) { ev.preventDefault(); if (state === "idle") start(); held[k] = true; return; }
    if (ev.key === "ArrowLeft" || ev.key === "a" || ev.key === "A") {
      ev.preventDefault(); aim.power = Math.max(0.15, aim.power - 0.06);
    } else if (ev.key === "ArrowRight" || ev.key === "d" || ev.key === "D") {
      ev.preventDefault(); aim.power = Math.min(1, aim.power + 0.06);
    } else if (ev.key === " " || ev.key === "Enter") {
      ev.preventDefault();
      if (state === "idle" || state === "paused") start();
      else if (state === "over") reset(true);
      else loose();
    } else if (ev.key === "p" || ev.key === "P") { ev.preventDefault(); togglePause(); }
    else if (ev.key === "r" || ev.key === "R") { ev.preventDefault(); reset(true); }
  });
  window.addEventListener("keyup", function (ev) {
    var k = KEYS[ev.key];
    if (k) { ev.preventDefault(); held[k] = false; }
  });
  window.addEventListener("blur", function () { held.up = held.down = false; });

  Array.prototype.forEach.call(document.querySelectorAll("[data-hold]"), function (b) {
    var k = b.dataset.hold;
    var press = function (ev) {
      ev.preventDefault();
      if (state === "idle") start();
      held[k] = true;
      b.classList.add("held");
      if (b.setPointerCapture && ev.pointerId !== undefined) {
        try { b.setPointerCapture(ev.pointerId); } catch (e) {}
      }
    };
    var rel = function (ev) { if (ev) ev.preventDefault(); held[k] = false; b.classList.remove("held"); };
    b.addEventListener("pointerdown", press);
    b.addEventListener("pointerup", rel);
    b.addEventListener("pointercancel", rel);
    b.addEventListener("pointerleave", rel);
    b.addEventListener("click", function (ev) { ev.preventDefault(); });
  });

  btnLoose.addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    if (state === "idle" || state === "paused") start();
    else if (state === "over") reset(true);
    else loose();
  });
  btnLoose.addEventListener("click", function (ev) { ev.preventDefault(); });

  btnPause.addEventListener("click", togglePause);
  btnReset.addEventListener("click", function () { reset(true); });
  btnSound.addEventListener("click", function () {
    soundOn = !soundOn;
    saveSound(soundOn);
    btnSound.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    btnSound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    if (soundOn) blip(620, 0.05);
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && state === "running") setState("paused");
  });

  /* ---------------- boot ---------------- */
  function boot(saved) {
    soundOn = loadSound();
    btnSound.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    btnSound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    fit();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(stageEl);
    window.addEventListener("resize", fit);
    reset(false);
    if (saved && saved.best > best) { best = saved.best; saveBest(best); }
    syncHud();
    requestAnimationFrame(frame);
  }

  if (window.claude && window.claude.hot) {
    try { window.claude.hot.snapshot(function () { return { best: best || 0 }; }); } catch (e) {}
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(boot);
  } else {
    boot({});
  }
})();
</script>
</body>
</html>
