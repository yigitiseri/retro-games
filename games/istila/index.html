<style>
  :root {
    color-scheme: dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

<style>
  :root {
    --ink:    #16060c;
    --bezel:  #3d1620;
    --amber:  #ffd98a;
    --ember:  #ff8a5c;
    --dim:    #4a1c28;
    --pale:   #ffe8d6;
    --alarm:  #e8564a;
    --gold:   #ffc75a;

    --cell-font: "Press Start 2P", ui-monospace, "Courier New", monospace;
    --read-font: "VT323", ui-monospace, "Courier New", monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(125% 90% at 50% 0%, #3a1018 0%, var(--ink) 62%),
      var(--ink);
    color: var(--pale);
    font-family: var(--read-font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .cabinet {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 12px 16px;
    padding-block: 10px 12px;
    max-width: 640px;
    margin-inline: auto;
  }

  /* ---- marquee ---- */
  .marquee { text-align: center; flex: 0 0 auto; }
  .marquee h1 {
    margin: 0;
    font-family: var(--cell-font);
    font-size: clamp(15px, 5.4vw, 26px);
    letter-spacing: 0.12em;
    color: var(--ember);
    text-shadow: 0 0 8px rgba(255, 138, 92, 0.5), 0 0 24px rgba(232, 86, 74, 0.35);
    text-wrap: balance;
  }
  .marquee p {
    margin: 4px 0 0;
    font-size: clamp(13px, 3.6vw, 17px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--amber);
    opacity: 0.75;
  }

  /* ---- hud ---- */
  .hud {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    border: 1px solid var(--dim);
    background: linear-gradient(180deg, rgba(255,138,92,0.08), transparent);
    padding: 6px 3px;
  }
  .hud div { text-align: center; }
  .hud .k {
    display: block;
    font-family: var(--cell-font);
    font-size: 7px;
    letter-spacing: 0.1em;
    color: var(--amber);
    opacity: 0.8;
  }
  .hud .v {
    display: block;
    margin-top: 5px;
    font-size: clamp(18px, 5.2vw, 23px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--pale);
  }
  .hud .ships .v { color: var(--gold); letter-spacing: 0.06em; }
  .hud .ships .v.low { color: var(--alarm); }
  .hud .best .v { color: var(--ember); }
  .hud .v.bump { animation: bump 240ms steps(3) 1; }
  @keyframes bump { 50% { transform: scale(1.22); } }

  /* ---- screen ---- */
  .stage { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .screen {
    position: relative;
    border: 2px solid var(--bezel);
    border-radius: 10px;
    background: #2a0d14;
    box-shadow:
      0 0 0 4px #240c12,
      0 0 40px rgba(255, 138, 92, 0.12) inset,
      0 10px 34px rgba(0, 0, 0, 0.62);
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .scan, .vignette { position: absolute; inset: 0; pointer-events: none; }
  .scan {
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.26) 0 1px, rgba(0,0,0,0) 1px 3px);
    mix-blend-mode: multiply;
  }
  .vignette {
    background: radial-gradient(112% 112% at 50% 45%, transparent 50%, rgba(0,0,0,0.7) 100%);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 11px;
    text-align: center;
    padding: 18px;
    background: rgba(20, 5, 10, 0.88);
    z-index: 3;
  }
  .overlay h2 {
    margin: 0;
    font-family: var(--cell-font);
    font-size: clamp(13px, 4.4vw, 19px);
    letter-spacing: 0.05em;
    color: var(--ember);
    text-shadow: 0 0 10px rgba(255, 138, 92, 0.45);
  }
  .overlay h2.over { color: var(--alarm); text-shadow: 0 0 12px rgba(232, 86, 74, 0.5); }
  .overlay p { margin: 0; font-size: clamp(16px, 4.2vw, 20px); letter-spacing: 0.06em; color: var(--amber); }
  .overlay p em { font-style: normal; color: var(--pale); }
  .blink { animation: blink 1.05s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }

  .banner {
    position: absolute;
    left: 0; right: 0;
    top: 24%;
    z-index: 2;
    text-align: center;
    font-family: var(--cell-font);
    font-size: clamp(11px, 3.4vw, 15px);
    letter-spacing: 0.06em;
    color: var(--gold);
    text-shadow: 0 2px 0 #000, 0 0 14px rgba(255, 199, 90, 0.5);
    animation: banner 1.6s ease-out 1 forwards;
    pointer-events: none;
  }
  @keyframes banner {
    0%   { opacity: 0; transform: translateY(10px) scale(0.92); }
    18%  { opacity: 1; transform: translateY(0) scale(1); }
    76%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---- controls ---- */
  .controls { flex: 0 0 auto; display: flex; gap: 8px; touch-action: none; }
  .controls button {
    flex: 1 1 0;
    height: 50px;
    font: inherit;
    font-size: 18px;
    color: var(--pale);
    background: linear-gradient(180deg, #3a141e, #240b12);
    border: 1px solid var(--dim);
    border-radius: 7px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: none;
  }
  .controls button:active, .controls button.held { background: var(--ember); color: #240b12; border-color: var(--ember); }
  .controls .fire {
    flex: 1.4 1 0;
    font-family: var(--cell-font);
    font-size: 9px;
    letter-spacing: 0.08em;
    color: #2a1000;
    background: linear-gradient(180deg, var(--gold), #d4862a);
    border-color: #ffe0a0;
  }
  .controls .fire:active, .controls .fire.held {
    background: linear-gradient(180deg, #fff3cf, var(--pale));
  }

  .sidekeys { flex: 0 0 auto; display: flex; gap: 6px; justify-content: center; }
  .sidekeys button {
    font-family: var(--cell-font);
    font-size: 7px;
    letter-spacing: 0.08em;
    padding: 8px 10px;
    color: var(--amber);
    background: #240c12;
    border: 1px solid var(--dim);
    border-radius: 5px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .sidekeys button:active, .sidekeys button[aria-pressed="true"] { color: var(--pale); border-color: var(--ember); }

  button:focus-visible, .screen:focus-visible { outline: 2px solid var(--pale); outline-offset: 2px; }

  .hint {
    flex: 0 0 auto;
    margin: 0;
    text-align: center;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--amber);
    opacity: 0.6;
  }

  @media (max-height: 700px) {
    .marquee p, .hint { display: none; }
    .controls button { height: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blink, .hud .v.bump, .banner { animation: none; }
  }
</style>

<body>
<div class="cabinet">
  <header class="marquee">
    <h1>&#304;ST&#304;LA</h1>
    <p>Cabinet No. 12 &mdash; 1978</p>
  </header>

  <div class="hud">
    <div class="ships"><span class="k">SHIPS</span><span class="v" id="hShips">&#9650;&#9650;&#9650;</span></div>
    <div><span class="k">SCORE</span><span class="v" id="hScore">0</span></div>
    <div><span class="k">WAVE</span><span class="v" id="hWave">1</span></div>
    <div class="best"><span class="k">BEST</span><span class="v" id="hBest">0</span></div>
  </div>

  <div class="stage" id="stage">
    <div class="screen" id="screen" tabindex="0" aria-label="Invaders game screen">
      <canvas id="view" width="180" height="150"></canvas>
      <div class="scan"></div>
      <div class="vignette"></div>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">INSERT COIN</h2>
        <p id="ovBody">Hold the rooftops.</p>
        <p class="blink" id="ovBlink">&#9654; PRESS START</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="btnLeft" aria-label="Left">&#9664;</button>
    <button id="btnRight" aria-label="Right">&#9654;</button>
    <button class="fire" id="btnFire">FIRE</button>
  </div>

  <div class="sidekeys">
    <button id="btnPause">PAUSE</button>
    <button id="btnSound" aria-pressed="true">SOUND ON</button>
    <button id="btnReset">RESTART</button>
  </div>

  <p class="hint">Shoot a stack low and it drops &middot; thread a gap for the top &middot; P pauses</p>
</div>

<script>
(function () {
  "use strict";

  /* ---------------- constants (internal pixels) ---------------- */
  var VW = 180;
  var VH = 150;                  // recomputed by fit()

  var COLS = 8, ROWS = 5;
  var CW = 20, CH = 14;          // formation cell
  var SW = 16, SH = 12;          // invader sprite footprint (8x6 at 2px)
  var TOP = 15;

  var SHIP_W = 14, SHIP_H = 8;
  var SHIP_SPEED = 78;
  var SHOT_SPEED = 150;
  var BOMB_SPEED = 46;
  var MAX_SHOTS = 2;

  // tier 3 sits at the top of a stack and is hardest to reach, so it pays most
  var TIER = [
    null,
    { c: "#ff8a5c", lit: "#ffc9a8", pts: 10 },
    { c: "#e8564a", lit: "#ff9a86", pts: 20 },
    { c: "#b03a52", lit: "#e07a90", pts: 35 }
  ];

  var SKY = ["#2a0d14", "#43141e", "#5d1c20", "#7d2a20", "#a03c24", "#c2542a", "#dd7038"];

  var SPR = [
    ["..XX..XX", ".XXXXXX.", "XX.XX.XX", "XXXXXXXX", ".X.XX.X.", "X......X"],
    ["..XX..XX", ".XXXXXX.", "XX.XX.XX", "XXXXXXXX", ".X.XX.X.", ".X....X."]
  ];
  var SHIP = ["...XX...", "..XXXX..", "XXXXXXXX", "XX.XX.XX"];

  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d");
  var screenEl = document.getElementById("screen");
  var stageEl = document.getElementById("stage");
  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ovTitle");
  var ovBody = document.getElementById("ovBody");
  var ovBlink = document.getElementById("ovBlink");
  var hShips = document.getElementById("hShips");
  var hScore = document.getElementById("hScore");
  var hWave = document.getElementById("hWave");
  var hBest = document.getElementById("hBest");
  var btnPause = document.getElementById("btnPause");
  var btnSound = document.getElementById("btnSound");
  var btnReset = document.getElementById("btnReset");

  ctx.imageSmoothingEnabled = false;

  var state = "idle";
  var grid, dropY, formX, formDir, formY, stepTimer, anim;
  var ship, shots, bombs, booms, city;
  var score, best, ships, wave, iframe, shake, bannerEl;
  var soundOn = true;
  var held = { left: false, right: false, fire: false };
  var fireCool = 0;

  /* ---------------- persistence ---------------- */
  function loadBest() {
    try { return parseInt(localStorage.getItem("istila-best"), 10) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) { try { localStorage.setItem("istila-best", String(v)); } catch (e) {} }
  function loadSound() {
    try { var v = localStorage.getItem("istila-sound"); return v === null ? true : v === "1"; }
    catch (e) { return true; }
  }
  function saveSound(v) { try { localStorage.setItem("istila-sound", v ? "1" : "0"); } catch (e) {} }

  /* ---------------- audio ---------------- */
  var actx = null;
  function blip(freq, dur, type, vol) {
    if (!soundOn) return;
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      if (actx.state === "suspended") actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, actx.currentTime);
      g.gain.setValueAtTime(vol || 0.05, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  /* ---------------- layout ---------------- */
  function fit() {
    var r = stageEl.getBoundingClientRect();
    var availW = r.width - 4, availH = r.height - 4;
    if (availW < 40 || availH < 40) return;

    // VH is decided first and the css box derived from it, so the buffer and the
    // displayed box can never disagree and stretch the picture
    var aspect = Math.max(0.62, Math.min(1.05, availW / availH));
    VH = Math.max(132, Math.min(210, Math.round(VW / aspect)));

    var w = Math.min(availW, availH * VW / VH);
    var h = w * VH / VW;
    screenEl.style.width = Math.round(w) + 4 + "px";
    screenEl.style.height = Math.round(h) + 4 + "px";

    canvas.width = VW;
    canvas.height = VH;
    ctx.imageSmoothingEnabled = false;
  }

  function shipY() { return VH - 26; }
  function danger() { return VH - 34; }          // rooftop height: they must not reach it

  /* ---------------- the skyline ---------------- */
  function makeCity() {
    city = [];
    var x = -3;
    while (x < VW + 6) {
      var w = 11 + ((Math.random() * 3) | 0) * 4;
      var h = 7 + ((Math.random() * 14) | 0);
      var wins = [];
      for (var wy = 3; wy < h - 2; wy += 4) {
        for (var wx = 2; wx < w - 3; wx += 4) {
          if (Math.random() < 0.45) wins.push({ x: wx, y: wy });
        }
      }
      city.push({ x: x, w: w, h: h, wins: wins });
      x += w + 1 + ((Math.random() * 2) | 0);
    }
  }

  /* ---------------- the formation ---------------- */
  function buildFormation() {
    grid = []; dropY = [];
    var rows = Math.min(6, ROWS + Math.floor((wave - 1) / 3));
    var gapEvery = wave < 3 ? 4 : (wave < 6 ? 5 : 6);   // denser lattice later on
    for (var r = 0; r < rows; r++) {
      var gr = [], dr = [];
      for (var c = 0; c < COLS; c++) {
        var empty = ((r + c) % gapEvery) === gapEvery - 1;
        // tier by height: the top of a stack is the valuable, awkward shot
        gr.push(empty ? 0 : (r === 0 ? 3 : (r === 1 ? 2 : 1)));
        dr.push(0);
      }
      grid.push(gr); dropY.push(dr);
    }
    formX = 10;
    formDir = 1;
    formY = 0;
    stepTimer = 0;
    anim = 0;
  }

  function rows() { return grid.length; }
  function ax(c) { return formX + c * CW; }
  function ay(r, c) { return TOP + formY + r * CH + dropY[r][c]; }

  function lowestIn(c) {
    for (var r = rows() - 1; r >= 0; r--) if (grid[r][c]) return r;
    return -1;
  }
  function anyLeft() {
    for (var r = 0; r < rows(); r++) for (var c = 0; c < COLS; c++) if (grid[r][c]) return true;
    return false;
  }
  function liveCount() {
    var n = 0;
    for (var r = 0; r < rows(); r++) for (var c = 0; c < COLS; c++) if (grid[r][c]) n++;
    return n;
  }

  // THE mechanic: take one out and the stack above it comes down a row
  function killAt(r, c) {
    var t = grid[r][c];
    score += TIER[t].pts * (1 + Math.floor((wave - 1) * 0.5));
    booms.push({ x: ax(c) + SW / 2, y: ay(r, c) + SH / 2, t: 0.26, c: TIER[t].lit });

    var dropped = 0;
    for (var rr = r; rr > 0; rr--) {
      grid[rr][c] = grid[rr - 1][c];
      if (grid[rr][c]) { dropY[rr][c] = -CH; dropped++; }
      else dropY[rr][c] = 0;
    }
    grid[0][c] = 0;
    dropY[0][c] = 0;

    if (dropped >= 3) {
      banner("COLLAPSE &#215;" + dropped);
      blip(180, 0.16, "sawtooth", 0.06);
      shake = Math.max(shake, 0.3);
    } else {
      blip(520 + t * 90, 0.05, "square", 0.045);
    }
    if (score > best) { best = score; saveBest(best); }
    bump(hScore);
    syncHud();
  }

  /* ---------------- game ---------------- */
  function reset(startNow) {
    fit();
    score = 0;
    ships = 3;
    wave = 1;
    iframe = 0;
    shake = 0;
    shots = []; bombs = []; booms = [];
    makeCity();
    buildFormation();
    ship = { x: VW / 2 };
    best = loadBest();
    setState(startNow ? "running" : "idle");
    syncHud();
    render(0);
  }

  function nextWave() {
    wave++;
    shots.length = 0; bombs.length = 0;
    buildFormation();
    ship.x = VW / 2;
    banner("WAVE " + wave);
    blip(660, 0.09); setTimeout(function () { blip(900, 0.12); }, 110);
    syncHud();
  }

  function hitShip() {
    if (iframe > 0) return;
    ships--;
    iframe = 1.6;
    shake = 0.5;
    bombs.length = 0;
    blip(190, 0.24, "sawtooth", 0.07);
    setTimeout(function () { blip(120, 0.3, "sawtooth", 0.06); }, 130);
    syncHud();
    if (ships <= 0) setState("over");
  }

  function update(dt) {
    var r, c, i;
    if (iframe > 0) iframe -= dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 1.8);

    /* ship */
    if (held.left) ship.x -= SHIP_SPEED * dt;
    if (held.right) ship.x += SHIP_SPEED * dt;
    ship.x = Math.max(SHIP_W / 2, Math.min(VW - SHIP_W / 2, ship.x));

    fireCool -= dt;
    if (held.fire && fireCool <= 0 && shots.length < MAX_SHOTS) {
      shots.push({ x: Math.round(ship.x), y: shipY() - 5 });
      fireCool = 0.26;
      blip(880, 0.04, "square", 0.035);
    }

    /* the formation: slide, bounce, step down */
    var live = liveCount();
    var pace = 0.62 - Math.min(0.45, (1 - live / (rows() * COLS)) * 0.42) - (wave - 1) * 0.03;
    pace = Math.max(0.09, pace);
    anim += dt;

    stepTimer -= dt;
    if (stepTimer <= 0) {
      stepTimer = pace;
      var minX = 1e9, maxX = -1e9;
      for (c = 0; c < COLS; c++) {
        if (lowestIn(c) < 0) continue;
        minX = Math.min(minX, ax(c));
        maxX = Math.max(maxX, ax(c) + SW);
      }
      if (minX < 1e9) {
        if ((formDir > 0 && maxX + 4 >= VW) || (formDir < 0 && minX - 4 <= 0)) {
          formDir = -formDir;
          formY += 5;                                   // the step down
          blip(150, 0.05, "triangle", 0.03);
        } else {
          formX += formDir * 4;
        }
      }
    }

    for (r = 0; r < rows(); r++) {
      for (c = 0; c < COLS; c++) {
        if (dropY[r][c] < 0) dropY[r][c] = Math.min(0, dropY[r][c] + CH * 4.2 * dt);
      }
    }

    /* only the lowest invader in a column can shoot: collapsing a stack arms
       whatever was standing on it */
    if (Math.random() < dt * (0.35 + wave * 0.18)) {
      var armed = [];
      for (c = 0; c < COLS; c++) { var lr = lowestIn(c); if (lr >= 0) armed.push({ r: lr, c: c }); }
      if (armed.length) {
        var a = armed[(Math.random() * armed.length) | 0];
        bombs.push({ x: ax(a.c) + SW / 2, x0: ax(a.c) + SW / 2, y: ay(a.r, a.c) + SH, w: 0 });
      }
    }

    /* player shots */
    for (i = shots.length - 1; i >= 0; i--) {
      var s = shots[i];
      s.y -= SHOT_SPEED * dt;
      var gone = s.y < -4;
      if (!gone) {
        // travelling up, so the lowest invader in the way is met first
        for (r = rows() - 1; r >= 0 && !gone; r--) {
          for (c = 0; c < COLS; c++) {
            if (!grid[r][c]) continue;
            var x = ax(c), y = ay(r, c);
            if (s.x >= x && s.x <= x + SW && s.y >= y && s.y <= y + SH) {
              killAt(r, c); gone = true; break;
            }
          }
        }
      }
      if (gone) shots.splice(i, 1);
    }

    /* bombs */
    for (i = bombs.length - 1; i >= 0; i--) {
      var b = bombs[i];
      b.y += BOMB_SPEED * dt;
      b.w += dt * 9;
      b.x = b.x0 + Math.sin(b.w) * 1.5;
      if (b.y > VH) { bombs.splice(i, 1); continue; }
      if (Math.abs(b.x - ship.x) < 4 && Math.abs(b.y - shipY()) < 4) {
        bombs.splice(i, 1);
        booms.push({ x: ship.x, y: shipY(), t: 0.4, c: "#fff3cf" });
        hitShip();
        break;                     // hitShip clears the bombs; our indices are stale now
      }
    }

    for (i = booms.length - 1; i >= 0; i--) {
      booms[i].t -= dt;
      if (booms[i].t <= 0) booms.splice(i, 1);
    }

    /* they reached the rooftops */
    for (c = 0; c < COLS; c++) {
      var lo = lowestIn(c);
      if (lo >= 0 && ay(lo, c) + SH >= danger()) {
        ships = 0;
        shake = 0.6;
        blip(110, 0.5, "sawtooth", 0.07);
        setState("over");
        return;
      }
    }

    if (!anyLeft()) nextWave();
  }

  /* ---------------- rendering ---------------- */
  function px(map, x, y, scale, color) {
    ctx.fillStyle = color;
    for (var r = 0; r < map.length; r++) {
      for (var c = 0; c < map[r].length; c++) {
        if (map[r].charAt(c) === "X") ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
      }
    }
  }

  function render(now) {
    if (!grid) return;
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 4, (Math.random() - 0.5) * shake * 3);

    ctx.fillStyle = SKY[0];
    ctx.fillRect(-4, -4, VW + 8, VH + 8);
    var band = Math.ceil(VH / SKY.length);
    for (var i = 0; i < SKY.length; i++) {
      ctx.fillStyle = SKY[i];
      ctx.fillRect(-4, i * band, VW + 8, band + 1);
    }

    // the sun, low and enormous
    ctx.fillStyle = "rgba(255, 210, 130, 0.16)";
    ctx.beginPath(); ctx.arc(VW * 0.7, VH - 30, 30, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255, 228, 160, 0.5)";
    ctx.beginPath(); ctx.arc(VW * 0.7, VH - 30, 17, 0, Math.PI * 2); ctx.fill();

    drawCity();

    var frame = Math.floor(anim * 2.4) % 2;
    for (var r = 0; r < rows(); r++) {
      for (var c = 0; c < COLS; c++) {
        var t = grid[r][c];
        if (!t) continue;
        // a dark backing keeps them readable once they drop into the bright
        // band above the horizon, which is where this palette is weakest
        px(SPR[frame], Math.round(ax(c)) + 1, Math.round(ay(r, c)) + 1, 2, "rgba(30,6,14,0.55)");
        px(SPR[frame], Math.round(ax(c)), Math.round(ay(r, c)), 2, TIER[t].c);
      }
    }

    ctx.fillStyle = "#fff3cf";
    for (var s = 0; s < shots.length; s++) ctx.fillRect(Math.round(shots[s].x) - 1, Math.round(shots[s].y), 2, 5);

    for (var b = 0; b < bombs.length; b++) {
      var bo = bombs[b];
      ctx.fillStyle = "#ff5f5f";
      ctx.fillRect(Math.round(bo.x) - 1, Math.round(bo.y), 2, 4);
    }

    for (var k = 0; k < booms.length; k++) {
      var bm = booms[k];
      var rad = Math.round((0.4 - bm.t) * 22) + 2;
      ctx.globalAlpha = Math.max(0, Math.min(1, bm.t / 0.3));
      ctx.fillStyle = bm.c;
      ctx.fillRect(Math.round(bm.x) - rad, Math.round(bm.y) - 1, rad * 2, 2);
      ctx.fillRect(Math.round(bm.x) - 1, Math.round(bm.y) - rad, 2, rad * 2);
      ctx.globalAlpha = 1;
    }

    if (!(iframe > 0 && Math.floor(now / 90) % 2 === 0)) {
      px(SHIP, Math.round(ship.x) - SHIP_W / 2, shipY() - 4, 2, "#ffd98a");
    }

    ctx.restore();
  }

  function drawCity() {
    var baseY = VH;
    for (var i = 0; i < city.length; i++) {
      var b = city[i];
      var top = baseY - b.h - 10;
      ctx.fillStyle = "#1e0b14";
      ctx.fillRect(b.x, top, b.w, baseY - top);
      ctx.fillStyle = "rgba(255,140,80,0.35)";
      ctx.fillRect(b.x, top, b.w, 1);
      ctx.fillStyle = "rgba(255,200,120,0.55)";
      for (var w = 0; w < b.wins.length; w++) {
        ctx.fillRect(b.x + b.wins[w].x, top + b.wins[w].y, 2, 2);
      }
    }
  }

  /* ---------------- hud + overlay ---------------- */
  function bump(el) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

  function syncHud() {
    hScore.textContent = score;
    hWave.textContent = wave;
    hBest.textContent = best;
    var t = "";
    for (var i = 0; i < Math.max(0, ships); i++) t += "▲";
    hShips.textContent = t || "–";
    hShips.className = "v" + (ships <= 1 ? " low" : "");
  }

  function banner(html) {
    if (bannerEl && bannerEl.parentNode) bannerEl.parentNode.removeChild(bannerEl);
    bannerEl = document.createElement("div");
    bannerEl.className = "banner";
    bannerEl.innerHTML = html;
    screenEl.appendChild(bannerEl);
    var mine = bannerEl;
    setTimeout(function () { if (mine.parentNode) mine.parentNode.removeChild(mine); }, 1700);
  }

  function setState(next) {
    state = next;
    btnPause.textContent = state === "paused" ? "RESUME" : "PAUSE";
    if (state === "running") { overlay.hidden = true; return; }
    overlay.hidden = false;
    ovTitle.classList.toggle("over", state === "over");

    if (state === "idle") {
      ovTitle.textContent = "INSERT COIN";
      ovBody.innerHTML = "They stand on each other. Shoot the <em>bottom of a stack</em> " +
                         "and everything above drops a row closer &mdash; and the one that lands " +
                         "can now shoot at you. Thread a <em>gap</em> for the top and the " +
                         "structure holds. Do not let them reach the roofs.";
      ovBlink.innerHTML = "&#9654; PRESS START";
    } else if (state === "paused") {
      ovTitle.textContent = "PAUSED";
      ovBody.textContent = "The sky waits.";
      ovBlink.innerHTML = "&#9654; TAP OR PRESS P";
    } else {
      ovTitle.textContent = "THE CITY FALLS";
      ovBody.innerHTML = "Held <em>" + wave + "</em> wave" + (wave === 1 ? "" : "s") +
                         " for <em>" + score + "</em>" +
                         (score >= best && score > 0 ? " &middot; <em>BEST RUN</em>"
                                                     : " &middot; best <em>" + best + "</em>");
      ovBlink.innerHTML = "&#9654; TAP TO PLAY AGAIN";
    }
  }

  function start() { lastTs = 0; setState("running"); }
  function togglePause() {
    if (state === "running") setState("paused");
    else if (state === "paused") start();
  }
  function primary() {
    if (state === "idle" || state === "paused") start();
    else if (state === "over") reset(true);
    else setState("paused");
  }

  /* ---------------- loop ---------------- */
  var lastTs = 0;
  function frame(now) {
    requestAnimationFrame(frame);        // queued first: one bad frame is not fatal
    var dt = lastTs ? Math.min(0.05, (now - lastTs) / 1000) : 0;
    lastTs = now;
    if (state === "running") update(dt);
    render(now);
  }

  /* ---------------- input ---------------- */
  function bindHold(el, key) {
    el.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      if (state === "idle" || state === "paused") start();
      held[key] = true;
      el.classList.add("held");
      try { el.setPointerCapture(ev.pointerId); } catch (e) {}
    });
    function off(ev) { if (ev) ev.preventDefault(); held[key] = false; el.classList.remove("held"); }
    el.addEventListener("pointerup", off);
    el.addEventListener("pointercancel", off);
    el.addEventListener("pointerleave", off);
    el.addEventListener("click", function (ev) { ev.preventDefault(); });
  }
  bindHold(document.getElementById("btnLeft"), "left");
  bindHold(document.getElementById("btnRight"), "right");
  bindHold(document.getElementById("btnFire"), "fire");

  var KEYS = { ArrowLeft: "left", ArrowRight: "right", a: "left", d: "right", A: "left", D: "right" };
  window.addEventListener("keydown", function (ev) {
    var k = KEYS[ev.key];
    if (k) { ev.preventDefault(); if (state === "idle" || state === "paused") start(); held[k] = true; return; }
    if (ev.key === " " || ev.key === "ArrowUp" || ev.key === "w") {
      ev.preventDefault();
      if (state === "running") held.fire = true; else primary();
      return;
    }
    if (ev.key === "p" || ev.key === "P") { ev.preventDefault(); togglePause(); }
    else if (ev.key === "r" || ev.key === "R") { ev.preventDefault(); reset(true); }
    else if (ev.key === "Enter") { ev.preventDefault(); primary(); }
  });
  window.addEventListener("keyup", function (ev) {
    var k = KEYS[ev.key];
    if (k) held[k] = false;
    if (ev.key === " " || ev.key === "ArrowUp" || ev.key === "w") held.fire = false;
  });

  screenEl.addEventListener("pointerdown", function (ev) { ev.preventDefault(); primary(); });
  screenEl.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });

  btnPause.addEventListener("click", togglePause);
  btnReset.addEventListener("click", function () { reset(true); });
  btnSound.addEventListener("click", function () {
    soundOn = !soundOn;
    saveSound(soundOn);
    btnSound.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    btnSound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    if (soundOn) blip(620, 0.05);
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && state === "running") setState("paused");
  });

  /* ---------------- boot ---------------- */
  function boot(saved) {
    soundOn = loadSound();
    btnSound.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    btnSound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    fit();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(stageEl);
    window.addEventListener("resize", fit);
    reset(false);
    if (saved && saved.best > best) { best = saved.best; saveBest(best); }
    syncHud();
    requestAnimationFrame(frame);
  }

  if (window.claude && window.claude.hot) {
    try { window.claude.hot.snapshot(function () { return { best: best || 0 }; }); } catch (e) {}
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(boot);
  } else {
    boot({});
  }
})();
</script>
</body>
</html>
