<style>
  :root {

<style>
  :root {
    --ink:    #050a16;
    --bezel:  #16294a;
    --cyan:   #6fd0ff;
    --chalk:  #eaf6ff;
    --dim:    #143059;
    --ember:  #ff8a5c;
    --spark:  #ffd86b;
    --alarm:  #ff5f6b;

    --cell-font: "Press Start 2P", ui-monospace, "Courier New", monospace;
    --read-font: "VT323", ui-monospace, "Courier New", monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(125% 90% at 50% 0%, #0f2347 0%, var(--ink) 62%),
      var(--ink);
    color: var(--chalk);
    font-family: var(--read-font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .cabinet {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 12px 16px;
    padding-block: 10px 12px;
    max-width: 640px;
    margin-inline: auto;
  }

  /* ---- marquee ---- */
  .marquee { text-align: center; flex: 0 0 auto; }
  .marquee h1 {
    margin: 0;
    font-family: var(--cell-font);
    font-size: clamp(15px, 5.4vw, 26px);
    letter-spacing: 0.12em;
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(111, 208, 255, 0.5), 0 0 24px rgba(111, 208, 255, 0.25);
    text-wrap: balance;
  }
  .marquee p {
    margin: 4px 0 0;
    font-size: clamp(13px, 3.6vw, 17px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--cyan);
    opacity: 0.6;
  }

  /* ---- hud ---- */
  .hud {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    border: 1px solid var(--dim);
    background: linear-gradient(180deg, rgba(111,208,255,0.07), transparent);
    padding: 6px 3px;
  }
  .hud div { text-align: center; }
  .hud .k {
    display: block;
    font-family: var(--cell-font);
    font-size: 7px;
    letter-spacing: 0.1em;
    color: var(--cyan);
    opacity: 0.8;
  }
  .hud .v {
    display: block;
    margin-top: 5px;
    font-size: clamp(18px, 5.2vw, 23px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--chalk);
  }
  .hud .lives .v { color: var(--alarm); letter-spacing: 0.08em; }
  .hud .chain .v { color: var(--spark); }
  .hud .best .v { color: var(--ember); }
  .hud .v.bump { animation: bump 240ms steps(3) 1; }
  @keyframes bump { 50% { transform: scale(1.22); } }

  /* ---- screen ---- */
  .stage { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .screen {
    position: relative;
    border: 2px solid var(--bezel);
    border-radius: 10px;
    background: #08122a;
    box-shadow:
      0 0 0 4px #0b1a33,
      0 0 40px rgba(111, 208, 255, 0.12) inset,
      0 10px 34px rgba(0, 0, 0, 0.62);
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .scan, .vignette { position: absolute; inset: 0; pointer-events: none; }
  .scan {
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.24) 0 1px, rgba(0,0,0,0) 1px 3px);
    mix-blend-mode: multiply;
  }
  .vignette {
    background: radial-gradient(112% 112% at 50% 45%, transparent 52%, rgba(0,0,0,0.7) 100%);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 11px;
    text-align: center;
    padding: 18px;
    background: rgba(5, 10, 22, 0.9);
    z-index: 3;
  }
  .overlay h2 {
    margin: 0;
    font-family: var(--cell-font);
    font-size: clamp(13px, 4.4vw, 19px);
    letter-spacing: 0.05em;
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(111, 208, 255, 0.45);
  }
  .overlay h2.over { color: var(--alarm); text-shadow: 0 0 12px rgba(255, 95, 107, 0.5); }
  .overlay p { margin: 0; font-size: clamp(16px, 4.2vw, 20px); letter-spacing: 0.06em; color: var(--cyan); }
  .overlay p em { font-style: normal; color: var(--chalk); }
  .blink { animation: blink 1.05s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }

  .banner {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 24%;
    z-index: 2;
    padding: 7px 12px;
    background: rgba(4, 9, 20, 0.88);
    border-block: 1px solid var(--spark);
    white-space: nowrap;
    text-align: center;
    font-family: var(--cell-font);
    font-size: clamp(10px, 3.1vw, 14px);
    letter-spacing: 0.06em;
    color: var(--spark);
    text-shadow: 0 2px 0 #000;
    animation: banner 1.6s ease-out 1 forwards;
    pointer-events: none;
  }
  @keyframes banner {
    0%   { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.92); }
    18%  { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    76%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---- controls ---- */
  .controls {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    touch-action: none;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 46px);
    grid-template-rows: repeat(3, 40px);
    gap: 5px;
    touch-action: none;
  }
  .dpad button {
    font: inherit;
    font-size: 17px;
    color: var(--cyan);
    background: linear-gradient(180deg, #13284a, #0b1830);
    border: 1px solid var(--dim);
    border-radius: 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: none;
  }
  .dpad button:active, .dpad button.held { background: var(--cyan); color: #08122a; border-color: var(--cyan); }
  .dpad .up    { grid-area: 1 / 2; }
  .dpad .left  { grid-area: 2 / 1; }
  .dpad .right { grid-area: 2 / 3; }
  .dpad .down  { grid-area: 3 / 2; }

  .drop {
    flex: 1 1 0;
    min-height: 92px;
    font-family: var(--cell-font);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: #06202a;
    background: linear-gradient(180deg, var(--spark), #d09b24);
    border: 1px solid #ffe9ad;
    border-radius: 9px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: none;
  }
  .drop:active, .drop.held { background: linear-gradient(180deg, #fff3cf, var(--chalk)); }

  .sidekeys { flex: 0 0 auto; display: flex; gap: 6px; justify-content: center; }
  .sidekeys button {
    font-family: var(--cell-font);
    font-size: 7px;
    letter-spacing: 0.08em;
    padding: 8px 10px;
    color: var(--cyan);
    background: #0b1830;
    border: 1px solid var(--dim);
    border-radius: 5px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .sidekeys button:active, .sidekeys button[aria-pressed="true"] { color: var(--chalk); border-color: var(--cyan); }

  button:focus-visible, .screen:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }

  .hint {
    flex: 0 0 auto;
    margin: 0;
    text-align: center;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--cyan);
    opacity: 0.6;
  }

  @media (max-height: 700px) {
    .marquee p, .hint { display: none; }
    .dpad { grid-template-rows: repeat(3, 34px); }
    .drop { min-height: 80px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blink, .hud .v.bump, .banner { animation: none; }
  }
</style>

<body>
<div class="cabinet">
  <header class="marquee">
    <h1>F&#304;T&#304;L</h1>
    <p>Cabinet No. 13 &mdash; 1985</p>
  </header>

  <div class="hud">
    <div><span class="k">SCORE</span><span class="v" id="hScore">0</span></div>
    <div class="chain"><span class="k">BEST CHAIN</span><span class="v" id="hChain">&mdash;</span></div>
    <div><span class="k">FLOOR</span><span class="v" id="hFloor">1</span></div>
    <div class="lives"><span class="k">LIVES</span><span class="v" id="hLives">&#9679;&#9679;&#9679;</span></div>
  </div>

  <div class="stage" id="stage">
    <div class="screen" id="screen" tabindex="0" aria-label="Bomb game screen">
      <canvas id="view" width="180" height="156"></canvas>
      <div class="scan"></div>
      <div class="vignette"></div>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">INSERT COIN</h2>
        <p id="ovBody">Set the charges.</p>
        <p class="blink" id="ovBlink">&#9654; PRESS START</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="dpad" aria-label="Direction pad">
      <button class="up"    data-dir="up"    aria-label="Up">&#9650;</button>
      <button class="left"  data-dir="left"  aria-label="Left">&#9664;</button>
      <button class="right" data-dir="right" aria-label="Right">&#9654;</button>
      <button class="down"  data-dir="down"  aria-label="Down">&#9660;</button>
    </div>
    <button class="drop" id="btnDrop">DROP<br>BOMB</button>
  </div>

  <div class="sidekeys">
    <button id="btnPause">PAUSE</button>
    <button id="btnSound" aria-pressed="true">SOUND ON</button>
    <button id="btnReset">RESTART</button>
  </div>

  <p class="hint">One bomb is cheap &middot; a bomb that sets off a bomb pays the square &middot; P pauses</p>
</div>

<script>
(function () {
  "use strict";

  /* ---------------- the room ---------------- */
  var COLS = 15, ROWS = 13, CELL = 12;
  var VW = COLS * CELL, VH = ROWS * CELL;
  var EMPTY = 0, HARD = 1, SOFT = 2;

  var FUSE = 2.4;
  var POWER = 2;
  var MAX_BOMBS = 3;          // three from the start: the chain is the game, not a reward
  var PLAYER_SPEED = 40;
  var FOE_CAP = 34;             // never faster than the runner: there is always an out
  var START = { c: 1, r: 1 };

  var DIRS = {
    up:    { x: 0, y: -1 },
    down:  { x: 0, y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1, y: 0 }
  };

  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d");
  var screenEl = document.getElementById("screen");
  var stageEl = document.getElementById("stage");
  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ovTitle");
  var ovBody = document.getElementById("ovBody");
  var ovBlink = document.getElementById("ovBlink");
  var hScore = document.getElementById("hScore");
  var hChain = document.getElementById("hChain");
  var hFloor = document.getElementById("hFloor");
  var hLives = document.getElementById("hLives");
  var btnPause = document.getElementById("btnPause");
  var btnSound = document.getElementById("btnSound");
  var btnReset = document.getElementById("btnReset");

  ctx.imageSmoothingEnabled = false;

  var state = "idle";
  var grid, player, foes, bombs, fires, score, best, bestChain, lives, floorNo;
  var respawning, invuln, shake, bannerEl, cleared, clearWait, lastCause;
  var soundOn = true;
  var held = { up: false, down: false, left: false, right: false };

  /* ---------------- persistence ---------------- */
  function loadBest() {
    try { return parseInt(localStorage.getItem("fitil-best"), 10) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) { try { localStorage.setItem("fitil-best", String(v)); } catch (e) {} }
  function loadSound() {
    try { var v = localStorage.getItem("fitil-sound"); return v === null ? true : v === "1"; }
    catch (e) { return true; }
  }
  function saveSound(v) { try { localStorage.setItem("fitil-sound", v ? "1" : "0"); } catch (e) {} }

  /* ---------------- audio ---------------- */
  var actx = null;
  function blip(freq, dur, type, vol) {
    if (!soundOn) return;
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      if (actx.state === "suspended") actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, actx.currentTime);
      g.gain.setValueAtTime(vol || 0.05, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  /* ---------------- layout ---------------- */
  function fit() {
    var r = stageEl.getBoundingClientRect();
    var availW = r.width - 4, availH = r.height - 4;
    if (availW < 40 || availH < 40) return;
    var ratio = VW / VH;
    var w = Math.min(availW, availH * ratio);
    screenEl.style.width = Math.round(w) + 4 + "px";
    screenEl.style.height = Math.round(w / ratio) + 4 + "px";
  }

  /* ---------------- grid ---------------- */
  function inside(c, r) { return c >= 0 && r >= 0 && c < COLS && r < ROWS; }
  function at(c, r) { return inside(c, r) ? grid[r][c] : HARD; }

  function bombAt(c, r) {
    for (var i = 0; i < bombs.length; i++) if (bombs[i].c === c && bombs[i].r === r) return bombs[i];
    return null;
  }

  // you may step off the bomb you are standing on, but never back onto it
  function walkable(m, c, r) {
    if (at(c, r) !== EMPTY) return false;
    var b = bombAt(c, r);
    if (b && !(m && m.c === c && m.r === r)) return false;
    return true;
  }

  function field(sc, sr) {
    var d = [], r, c;
    for (r = 0; r < ROWS; r++) { d.push([]); for (c = 0; c < COLS; c++) d[r].push(-1); }
    if (at(sc, sr) !== EMPTY) return d;
    var q = [[sc, sr]], head = 0;
    d[sr][sc] = 0;
    while (head < q.length) {
      var cur = q[head++], cx = cur[0], cy = cur[1];
      var n = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]];
      for (var i = 0; i < 4; i++) {
        var nx = n[i][0], ny = n[i][1];
        if (at(nx, ny) !== EMPTY || d[ny][nx] >= 0) continue;
        d[ny][nx] = d[cy][cx] + 1;
        q.push([nx, ny]);
      }
    }
    return d;
  }

  function mover(c, r, speed) {
    return { c: c, r: r, nc: c, nr: r, t: 0, speed: speed, dir: DIRS.right };
  }
  function ex(m) { return (m.c + (m.nc - m.c) * m.t) * CELL + CELL / 2; }
  function ey(m) { return (m.r + (m.nr - m.r) * m.t) * CELL + CELL / 2; }

  function advance(m, dt) {
    if (m.nc === m.c && m.nr === m.r) return true;
    m.t += m.speed * dt / CELL;
    if (m.t >= 1) { m.c = m.nc; m.r = m.nr; m.t = 0; return true; }
    return false;
  }
  function stepTo(m, c, r) {
    m.nc = c; m.nr = r; m.t = 0;
    if (c !== m.c) m.dir = c > m.c ? DIRS.right : DIRS.left;
    else if (r !== m.r) m.dir = r > m.r ? DIRS.down : DIRS.up;
  }

  /* ---------------- building a floor ---------------- */
  function buildFloor() {
    var c, r;
    grid = [];
    for (r = 0; r < ROWS; r++) {
      var row = [];
      for (c = 0; c < COLS; c++) {
        if (r === 0 || c === 0 || r === ROWS - 1 || c === COLS - 1) row.push(HARD);
        else if (r % 2 === 0 && c % 2 === 0) row.push(HARD);
        else row.push(EMPTY);
      }
      grid.push(row);
    }
    // soft brick, but never boxing the player into their own corner
    var safe = {};
    safe[START.c + "," + START.r] = 1;
    safe[(START.c + 1) + "," + START.r] = 1;
    safe[START.c + "," + (START.r + 1)] = 1;
    var density = Math.min(0.62, 0.42 + (floorNo - 1) * 0.04);
    for (r = 1; r < ROWS - 1; r++) {
      for (c = 1; c < COLS - 1; c++) {
        if (grid[r][c] !== EMPTY) continue;
        if (safe[c + "," + r]) continue;
        if (Math.random() < density) grid[r][c] = SOFT;
      }
    }

    player = mover(START.c, START.r, PLAYER_SPEED);
    bombs = [];
    fires = [];
    foes = [];

    var want = Math.min(6, 2 + floorNo);
    var tries = 0;
    while (foes.length < want && tries < 400) {
      tries++;
      c = 1 + ((Math.random() * (COLS - 2)) | 0);
      r = 1 + ((Math.random() * (ROWS - 2)) | 0);
      if (grid[r][c] !== EMPTY) continue;
      if (Math.abs(c - START.c) + Math.abs(r - START.r) < 6) continue;
      var kind = (foes.length % 3 === 2 && floorNo > 1) ? "hunter" : "walker";
      var sp = kind === "hunter" ? 26 + floorNo * 1.5 : 20 + floorNo;
      var f = mover(c, r, Math.min(sp, FOE_CAP));
      f.kind = kind;
      foes.push(f);
    }
    cleared = false;
    clearWait = 0;
  }

  /* ---------------- bombs, and the chain ---------------- */
  function dropBomb() {
    if (state !== "running" || respawning > 0) return;
    if (bombs.length >= MAX_BOMBS) return;
    if (bombAt(player.c, player.r)) return;
    bombs.push({ c: player.c, r: player.r, fuse: FUSE });
    blip(190, 0.06, "square", 0.04);
  }

  // one bomb going off takes every bomb its fire touches with it, and the
  // multiplier is the square of how many went at once
  function detonate(first) {
    var queue = [first], chain = 0, bricks = 0, kills = 0;
    var i, j, k;
    removeBomb(first);

    while (queue.length) {
      var b = queue.shift();
      chain++;
      var cells = blastCells(b);
      for (i = 0; i < cells.length; i++) {
        var cc = cells[i][0], rr = cells[i][1];
        fires.push({ c: cc, r: rr, t: 0.42 });
        if (grid[rr][cc] === SOFT) { grid[rr][cc] = EMPTY; bricks++; }
        for (j = foes.length - 1; j >= 0; j--) {
          if (foes[j].c === cc && foes[j].r === rr) { foes.splice(j, 1); kills++; }
        }
        var other = bombAt(cc, rr);
        if (other) { removeBomb(other); queue.push(other); }
      }
    }

    var base = 10 * chain + 5 * bricks + 50 * kills;
    var gained = base * chain;             // chain of n pays n squared overall
    score += gained;
    if (chain > bestChain) bestChain = chain;
    if (score > best) { best = score; saveBest(best); }

    if (chain > 1) {
      banner("Z&#304;NC&#304;R &#215;" + (chain * chain) + "  +" + gained);
      blip(120 + chain * 40, 0.22, "sawtooth", 0.07);
      shake = Math.min(0.7, 0.28 + chain * 0.12);
    } else {
      banner("+" + gained);
      blip(150, 0.14, "sawtooth", 0.05);
      shake = 0.24;
    }
    bump(hScore); bump(hChain);
    syncHud();
  }

  function removeBomb(b) {
    for (var i = bombs.length - 1; i >= 0; i--) if (bombs[i] === b) bombs.splice(i, 1);
  }

  function blastCells(b) {
    var out = [[b.c, b.r]];
    var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (var i = 0; i < 4; i++) {
      for (var s = 1; s <= POWER; s++) {
        var cc = b.c + dirs[i][0] * s, rr = b.r + dirs[i][1] * s;
        if (at(cc, rr) === HARD) break;
        out.push([cc, rr]);
        if (at(cc, rr) === SOFT) break;      // brick stops the fire, and dies
      }
    }
    return out;
  }

  function burning(c, r) {
    for (var i = 0; i < fires.length; i++) if (fires[i].c === c && fires[i].r === r) return true;
    return false;
  }

  /* ---------------- game ---------------- */
  function reset(startNow) {
    score = 0;
    bestChain = 0;
    lives = 3;
    floorNo = 1;
    respawning = 0;
    invuln = 0;
    shake = 0;
    best = loadBest();
    buildFloor();
    fit();
    setState(startNow ? "running" : "idle");
    syncHud();
    render(0);
  }

  function nextFloor() {
    floorNo++;
    buildFloor();
    banner("FLOOR " + floorNo);
    blip(620, 0.09); setTimeout(function () { blip(880, 0.12); }, 110);
    syncHud();
  }

  function killPlayer() {
    if (respawning > 0 || invuln > 0 || state !== "running") return;
    lives--;
    respawning = 1.1;
    shake = 0.6;
    lastCause = burning(player.c, player.r) || burning(player.nc, player.nr) ? "fire" : "foe";
    blip(180, 0.26, "sawtooth", 0.07);
    setTimeout(function () { blip(110, 0.32, "sawtooth", 0.06); }, 130);
    syncHud();
    // end it here rather than on a timer: on the last life there is nothing left
    // to respawn, and anything that keeps killing would keep counting
    if (lives <= 0) { lives = 0; syncHud(); setState("over"); }
  }

  function update(dt) {
    var i;
    if (shake > 0) shake = Math.max(0, shake - dt * 1.9);
    if (invuln > 0) invuln -= dt;

    for (i = fires.length - 1; i >= 0; i--) {
      fires[i].t -= dt;
      if (fires[i].t <= 0) fires.splice(i, 1);
    }

    for (i = bombs.length - 1; i >= 0; i--) {
      var b = bombs[i];
      b.fuse -= dt;
      if (b.fuse <= 0) { detonate(b); if (state !== "running") return; }
    }

    if (respawning > 0) {
      respawning -= dt;
      if (respawning <= 0 && lives > 0) {
        player = mover(START.c, START.r, PLAYER_SPEED);
        bombs = [];
        invuln = 1.7;
      }
      return;
    }

    /* the runner */
    if (advance(player, dt)) {
      var want = null;
      if (held.up) want = "up";
      else if (held.down) want = "down";
      else if (held.left) want = "left";
      else if (held.right) want = "right";
      if (want) {
        var d = DIRS[want];
        player.dir = d;
        if (walkable(player, player.c + d.x, player.r + d.y)) {
          stepTo(player, player.c + d.x, player.r + d.y);
        }
      }
    }

    /* the others */
    var toPlayer = field(player.c, player.r);
    for (i = 0; i < foes.length; i++) {
      var f = foes[i];
      if (advance(f, dt)) chooseFoe(f, toPlayer);
      if (Math.abs(ex(f) - ex(player)) < 7 && Math.abs(ey(f) - ey(player)) < 7) return killPlayer();
    }

    /* fire does not care whose bomb it was */
    if (burning(player.c, player.r) || burning(player.nc, player.nr)) return killPlayer();

    if (!foes.length && !cleared) { cleared = true; clearWait = 0.7; }
    if (cleared) {
      clearWait -= dt;
      if (clearWait <= 0) nextFloor();
    }
  }

  function chooseFoe(f, toPlayer) {
    var opts = [];
    var cand = [[f.c + 1, f.r], [f.c - 1, f.r], [f.c, f.r + 1], [f.c, f.r - 1]];
    for (var i = 0; i < 4; i++) {
      var c = cand[i][0], r = cand[i][1];
      if (at(c, r) !== EMPTY) continue;
      if (bombAt(c, r)) continue;
      opts.push([c, r]);
    }
    if (!opts.length) return;

    var back = [f.c - f.dir.x, f.r - f.dir.y];
    var fwd = opts.filter(function (o) { return !(o[0] === back[0] && o[1] === back[1]); });
    if (fwd.length) opts = fwd;

    var dist = toPlayer[f.r] ? toPlayer[f.r][f.c] : -1;
    var chase = f.kind === "hunter" && dist >= 0 && dist <= 7;

    var pick = null, bestVal = Infinity;
    for (var j = 0; j < opts.length; j++) {
      var o = opts[j];
      var v = chase ? (toPlayer[o[1]][o[0]] < 0 ? 999 : toPlayer[o[1]][o[0]]) : Math.random() * 10;
      // nobody walks knowingly into fire
      if (burning(o[0], o[1])) v += 500;
      if (v < bestVal) { bestVal = v; pick = o; }
    }
    if (pick) stepTo(f, pick[0], pick[1]);
  }

  /* ---------------- drawing: a blueprint of the room ---------------- */
  function render(now) {
    if (!grid) return;
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 5, (Math.random() - 0.5) * shake * 4);

    ctx.fillStyle = "#08122a";
    ctx.fillRect(-6, -6, VW + 12, VH + 12);

    var c, r, x, y;
    for (r = 0; r < ROWS; r++) {
      for (c = 0; c < COLS; c++) {
        x = c * CELL; y = r * CELL;
        ctx.fillStyle = "rgba(111,208,255,0.055)";
        ctx.fillRect(x, y, CELL, 1);
        ctx.fillRect(x, y, 1, CELL);
      }
    }

    for (r = 0; r < ROWS; r++) {
      for (c = 0; c < COLS; c++) {
        var v = grid[r][c];
        if (v === EMPTY) continue;
        x = c * CELL; y = r * CELL;
        if (v === HARD) {
          ctx.fillStyle = "#0e1e3c";
          ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
          ctx.strokeStyle = "#6fd0ff";
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 1.5, y + 1.5, CELL - 3, CELL - 3);
          ctx.beginPath();
          ctx.moveTo(x + 2.5, y + 2.5); ctx.lineTo(x + CELL - 2.5, y + CELL - 2.5);
          ctx.stroke();
        } else {
          // soft brick gets a filled body so it never reads as a hard block
          ctx.fillStyle = "#16345e";
          ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);
          ctx.strokeStyle = "#54a8d8";
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 2.5, y + 2.5, CELL - 5, CELL - 5);
          ctx.fillStyle = "rgba(111,208,255,0.35)";
          ctx.fillRect(x + 2, y + CELL / 2 - 1, CELL - 4, 1);
        }
      }
    }

    for (var i = 0; i < bombs.length; i++) {
      var b = bombs[i];
      var bx = b.c * CELL + CELL / 2, by = b.r * CELL + CELL / 2;
      var urgent = b.fuse < 0.8;
      var puls = 0.5 + Math.sin(b.fuse * (urgent ? 26 : 12)) * 0.5;
      ctx.fillStyle = "#0a1730";
      ctx.beginPath(); ctx.arc(bx, by + 1, 4.2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = urgent && puls > 0.5 ? "#ffffff" : "#eaf6ff";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(bx, by + 1, 4.2, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = puls > 0.5 ? "#ffd86b" : "#ff8a5c";
      ctx.fillRect(Math.round(bx) - 1, Math.round(by) - 5, 2, 2);
    }

    for (var f2 = 0; f2 < fires.length; f2++) {
      var fi = fires[f2];
      var a = Math.max(0, Math.min(1, fi.t / 0.3));
      x = fi.c * CELL; y = fi.r * CELL;
      ctx.globalAlpha = a;
      ctx.fillStyle = "#9fe6ff";
      ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
      ctx.fillStyle = "#ffffff";
      var ins = 2 + Math.round((1 - a) * 3);
      ctx.fillRect(x + ins, y + ins, CELL - ins * 2, CELL - ins * 2);
      ctx.globalAlpha = 1;
    }

    for (var k = 0; k < foes.length; k++) {
      var fo = foes[k];
      var fx = Math.round(ex(fo)), fy = Math.round(ey(fo));
      var warm = fo.kind === "hunter" ? "#ff5f6b" : "#ff8a5c";
      ctx.fillStyle = "#1a0f1e";
      ctx.fillRect(fx - 4, fy - 4, 8, 8);
      ctx.strokeStyle = warm;
      ctx.lineWidth = 1;
      ctx.strokeRect(fx - 3.5, fy - 3.5, 7, 7);
      ctx.fillStyle = warm;
      if (fo.kind === "hunter") { ctx.fillRect(fx - 3, fy - 6, 2, 2); ctx.fillRect(fx + 1, fy - 6, 2, 2); }
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(fx - 2, fy - 1, 1, 2);
      ctx.fillRect(fx + 1, fy - 1, 1, 2);
    }

    if (!((respawning > 0 || invuln > 0) && Math.floor(now / 90) % 2 === 0)) {
      var px = Math.round(ex(player)), py = Math.round(ey(player));
      ctx.fillStyle = "#0d2b4a";
      ctx.fillRect(px - 4, py - 4, 8, 9);
      ctx.strokeStyle = "#eaf6ff";
      ctx.lineWidth = 1;
      ctx.strokeRect(px - 3.5, py - 3.5, 7, 8);
      ctx.fillStyle = "#eaf6ff";
      ctx.fillRect(px - 3, py - 6, 6, 2);
      ctx.fillStyle = "#6fd0ff";
      ctx.fillRect(px - 2, py - 1, 4, 2);
    }

    ctx.restore();
  }

  /* ---------------- hud + overlay ---------------- */
  function bump(el) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

  function syncHud() {
    hScore.textContent = score;
    hChain.textContent = bestChain > 1 ? "×" + (bestChain * bestChain) : "—";
    hFloor.textContent = floorNo;
    var d = "";
    for (var i = 0; i < Math.max(0, lives); i++) d += "●";
    hLives.textContent = d || "–";
  }

  function banner(html) {
    if (bannerEl && bannerEl.parentNode) bannerEl.parentNode.removeChild(bannerEl);
    bannerEl = document.createElement("div");
    bannerEl.className = "banner";
    bannerEl.innerHTML = html;
    screenEl.appendChild(bannerEl);
    var mine = bannerEl;
    setTimeout(function () { if (mine.parentNode) mine.parentNode.removeChild(mine); }, 1700);
  }

  function setState(next) {
    state = next;
    btnPause.textContent = state === "paused" ? "RESUME" : "PAUSE";
    if (state === "running") { overlay.hidden = true; return; }
    overlay.hidden = false;
    ovTitle.classList.toggle("over", state === "over");

    if (state === "idle") {
      ovTitle.textContent = "INSERT COIN";
      ovBody.innerHTML = "One bomb is worth almost nothing. A bomb that sets off " +
                         "another bomb pays the <em>square</em> of the chain &mdash; three at " +
                         "once is nine times. You carry <em>three</em>, so stop clearing the " +
                         "room and start arming it. Fire does not care whose bomb it was.";
      ovBlink.innerHTML = "&#9654; PRESS START";
    } else if (state === "paused") {
      ovTitle.textContent = "PAUSED";
      ovBody.textContent = "Fuses held.";
      ovBlink.innerHTML = "&#9654; TAP OR PRESS P";
    } else {
      ovTitle.textContent = "BLOWN UP";
      ovBody.innerHTML = "Floor <em>" + floorNo + "</em> &middot; <em>" + score + "</em> points" +
                         (bestChain > 1 ? " &middot; best chain <em>&#215;" + (bestChain * bestChain) + "</em>" : "") +
                         (score >= best && score > 0 ? " &middot; <em>BEST RUN</em>" : " &middot; best <em>" + best + "</em>");
      ovBlink.innerHTML = "&#9654; TAP TO PLAY AGAIN";
    }
  }

  function start() { lastTs = 0; setState("running"); }
  function togglePause() {
    if (state === "running") setState("paused");
    else if (state === "paused") start();
  }
  function primary() {
    if (state === "idle" || state === "paused") start();
    else if (state === "over") reset(true);
    else setState("paused");
  }

  /* ---------------- loop ---------------- */
  var lastTs = 0;
  function frame(now) {
    requestAnimationFrame(frame);          // queued first: one bad frame is not fatal
    var dt = lastTs ? Math.min(0.05, (now - lastTs) / 1000) : 0;
    lastTs = now;
    if (state === "running") update(dt);
    render(now);
  }

  /* ---------------- input ---------------- */
  function bindHold(el, key) {
    el.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      if (state === "idle" || state === "paused") start();
      held[key] = true;
      el.classList.add("held");
      try { el.setPointerCapture(ev.pointerId); } catch (e) {}
    });
    function off(ev) { if (ev) ev.preventDefault(); held[key] = false; el.classList.remove("held"); }
    el.addEventListener("pointerup", off);
    el.addEventListener("pointercancel", off);
    el.addEventListener("pointerleave", off);
    el.addEventListener("click", function (ev) { ev.preventDefault(); });
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-dir]"), function (b) {
    bindHold(b, b.dataset.dir);
  });

  var btnDrop = document.getElementById("btnDrop");
  btnDrop.addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    if (state === "idle" || state === "paused") { start(); return; }
    btnDrop.classList.add("held");
    dropBomb();
  });
  function dropOff(ev) { if (ev) ev.preventDefault(); btnDrop.classList.remove("held"); }
  btnDrop.addEventListener("pointerup", dropOff);
  btnDrop.addEventListener("pointercancel", dropOff);
  btnDrop.addEventListener("click", function (ev) { ev.preventDefault(); });

  var KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
    W: "up", S: "down", A: "left", D: "right"
  };
  window.addEventListener("keydown", function (ev) {
    var k = KEYS[ev.key];
    if (k) { ev.preventDefault(); if (state === "idle" || state === "paused") start(); held[k] = true; return; }
    if (ev.key === " " || ev.key === "Enter") {
      ev.preventDefault();
      if (state === "running") dropBomb(); else primary();
      return;
    }
    if (ev.key === "p" || ev.key === "P") { ev.preventDefault(); togglePause(); }
    else if (ev.key === "r" || ev.key === "R") { ev.preventDefault(); reset(true); }
  });
  window.addEventListener("keyup", function (ev) {
    var k = KEYS[ev.key];
    if (k) held[k] = false;
  });

  screenEl.addEventListener("pointerdown", function (ev) { ev.preventDefault(); primary(); });
  screenEl.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });

  btnPause.addEventListener("click", togglePause);
  btnReset.addEventListener("click", function () { reset(true); });
  btnSound.addEventListener("click", function () {
    soundOn = !soundOn;
    saveSound(soundOn);
    btnSound.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    btnSound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    if (soundOn) blip(620, 0.05);
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && state === "running") setState("paused");
  });

  /* ---------------- boot ---------------- */
  function boot(saved) {
    soundOn = loadSound();
    btnSound.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    btnSound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    fit();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(stageEl);
    window.addEventListener("resize", fit);
    reset(false);
    if (saved && saved.best > best) { best = saved.best; saveBest(best); }
    syncHud();
    requestAnimationFrame(frame);
  }

  if (window.claude && window.claude.hot) {
    try { window.claude.hot.snapshot(function () { return { best: best || 0 }; }); } catch (e) {}
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(boot);
  } else {
    boot({});
  }
})();
</script>
</body>
</html>
