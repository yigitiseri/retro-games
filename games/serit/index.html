<style>
  :root {
    --ink:    #06060e;
    --pale:   #eaf0ff;
    --blue:   #7d8cff;
    --cyan:   #4fe8ff;
    --gold:   #ffc23d;
    --rose:   #ff3d6e;
    --dim:    rgba(234, 240, 255, 0.45);
    --ui: "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--ink);
    color: var(--pale);
    font-family: var(--ui);
    user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }

  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ---------- hud ---------- */
  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    pointer-events: none;
    z-index: 2;
  }
  .hud .k { font-size: 10px; letter-spacing: 0.18em; color: var(--dim); font-weight: 600; }
  .hud .score {
    font-size: clamp(26px, 8vw, 38px);
    font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px rgba(125, 140, 255, 0.4);
  }
  .hud .right { text-align: right; }
  .hud .best { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--dim); }
  .hud .best.lead { color: var(--gold); text-shadow: 0 0 16px rgba(255, 194, 61, 0.5); }

  .combo {
    text-align: center; font-weight: 700; line-height: 1;
    font-size: clamp(20px, 6.5vw, 30px);
    color: var(--cyan);
    opacity: 0; transform: scale(0.8);
    transition: opacity 140ms ease, transform 140ms ease, color 220ms ease;
    text-shadow: 0 0 18px currentColor;
  }
  .combo.on { opacity: 1; transform: scale(1); }
  .combo.pop { animation: pop 240ms ease-out 1; }
  .combo.hot { animation: hot 900ms ease-in-out infinite; }
  @keyframes pop { 40% { transform: scale(1.34); } }
  @keyframes hot { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  .combo .lab { display: block; font-size: 9px; letter-spacing: 0.22em; color: var(--dim); text-shadow: none; }

  .fuse {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 74px);
    left: 50%; transform: translateX(-50%);
    width: min(140px, 40vw); height: 3px;
    border-radius: 2px;
    background: rgba(234, 240, 255, 0.12);
    overflow: hidden; opacity: 0;
    transition: opacity 160ms ease;
    z-index: 2; pointer-events: none;
  }
  .fuse.on { opacity: 1; }
  .fuse i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left center; }

  .newbest {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 96px);
    left: 50%; transform: translateX(-50%);
    font-size: 12px; font-weight: 700; letter-spacing: 0.24em;
    color: var(--gold); text-shadow: 0 0 20px rgba(255, 194, 61, 0.7);
    opacity: 0; z-index: 2; pointer-events: none; white-space: nowrap;
  }
  .newbest.show { animation: nb 2s ease-out 1; }
  @keyframes nb {
    0% { opacity: 0; transform: translateX(-50%) scale(0.7); }
    12% { opacity: 1; transform: translateX(-50%) scale(1.1); }
    22% { transform: translateX(-50%) scale(1); }
    78% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---------- screens ---------- */
  .screen {
    position: absolute; inset: 0;
    display: grid; place-content: center; justify-items: center;
    gap: 18px; text-align: center; padding: 28px;
    background: radial-gradient(120% 90% at 50% 42%, rgba(6, 6, 14, 0.74), rgba(6, 6, 14, 0.95));
    z-index: 3; backdrop-filter: blur(2px);
  }
  .screen[hidden] { display: none; }
  .title {
    font-size: clamp(38px, 13vw, 66px);
    font-weight: 700; letter-spacing: 0.06em; line-height: 0.95;
    background: linear-gradient(180deg, #ffffff, var(--blue));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(125, 140, 255, 0.45));
  }
  .sub { font-size: clamp(12px, 3.6vw, 14px); letter-spacing: 0.26em; color: var(--cyan); font-weight: 700; }
  .lines { font-size: clamp(14px, 4.2vw, 17px); line-height: 1.7; color: var(--pale); opacity: 0.84; }
  .lines .gold { color: var(--gold); font-weight: 700; }
  .lines .bad { color: var(--rose); font-weight: 700; }

  .legend { display: flex; gap: 22px; align-items: center; justify-content: center; margin-top: 2px; }
  .legend div { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 10px; letter-spacing: 0.14em; color: var(--dim); font-weight: 600; }
  .legend div > span { height: 22px; display: grid; place-items: center; }
  .legend .orb { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 36% 32%, #ffffff 0 16%, var(--blue) 52%, #3d46b8 100%); box-shadow: 0 0 16px rgba(125, 140, 255, 0.8); }
  .legend .blk { width: 30px; height: 14px; border-radius: 3px; background: linear-gradient(180deg, #ff6f93, var(--rose)); box-shadow: 0 0 16px rgba(255, 61, 110, 0.7); }
  .legend .gem { width: 17px; height: 17px; background: var(--gold); transform: rotate(45deg); border-radius: 3px; box-shadow: 0 0 16px rgba(255, 194, 61, 0.8); }

  .btn {
    margin-top: 6px; font-family: var(--ui);
    font-size: 15px; font-weight: 700; letter-spacing: 0.16em;
    padding: 15px 34px; color: #050a18; border: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(180deg, #c3caff, var(--blue));
    box-shadow: 0 0 28px rgba(125, 140, 255, 0.5);
    transition: transform 120ms ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn.gold { background: linear-gradient(180deg, #ffe39a, var(--gold)); box-shadow: 0 0 28px rgba(255, 194, 61, 0.45); }
  .hintline { font-size: 12px; letter-spacing: 0.14em; color: var(--dim); }

  .over-title { font-size: clamp(24px, 7.5vw, 34px); font-weight: 700; letter-spacing: 0.1em; color: var(--rose); text-shadow: 0 0 22px rgba(255, 61, 110, 0.5); }
  .over-title.best { color: var(--gold); text-shadow: 0 0 26px rgba(255, 194, 61, 0.6); }
  .final { font-size: clamp(44px, 15vw, 72px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(3, auto); gap: 10px 26px; justify-content: center; }
  .stats div { text-align: center; }
  .stats .k { font-size: 9px; letter-spacing: 0.18em; color: var(--dim); font-weight: 600; }
  .stats .v { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stats .v.gold { color: var(--gold); }

  @media (prefers-reduced-motion: reduce) {
    .combo.pop, .combo.hot, .newbest.show { animation: none; }
    .btn { transition: none; }
  }
</style>

<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div class="hud">
    <div>
      <div class="k">SCORE</div>
      <div class="score" id="hScore">0</div>
    </div>
    <div class="combo" id="hCombo"><span class="lab">COMBO</span><span id="hComboV">x1</span></div>
    <div class="right">
      <div class="k">BEST</div>
      <div class="best" id="hBest">0</div>
    </div>
  </div>
  <div class="fuse" id="hFuse"><i id="hFuseBar"></i></div>
  <div class="newbest" id="hNewBest">NEW BEST</div>

  <div class="screen" id="startScreen">
    <div class="title">ŞERİT</div>
    <div class="sub">THREE LANES &middot; ONE CHOICE</div>
    <div class="legend">
      <div><span class="orb"></span>YOU</div>
      <div><span class="blk"></span>AVOID</div>
      <div><span class="gem"></span>COLLECT</div>
    </div>
    <div class="lines">
      Tap the <b>left</b> or <b>right</b> half to change lane.<br>
      <span class="gold">Gold</span> builds the multiplier &mdash; and stops
      paying if you play it safe for too long.
    </div>
    <button class="btn" id="btnStart">START RUN</button>
    <div class="hintline">ARROWS / A D ON A KEYBOARD</div>
  </div>

  <div class="screen" id="overScreen" hidden>
    <div class="over-title" id="overTitle">RUN OVER</div>
    <div class="final" id="overScore">0</div>
    <div class="stats">
      <div><div class="k">BEST</div><div class="v" id="overBest">0</div></div>
      <div><div class="k">TIME</div><div class="v" id="overTime">0s</div></div>
      <div><div class="k">TOP COMBO</div><div class="v gold" id="overCombo">x1</div></div>
    </div>
    <button class="btn gold" id="btnAgain">RUN AGAIN</button>
    <div class="hintline">TAP ANYWHERE TO GO AGAIN</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     Reference units: the road is 400 wide and as tall as the
     screen's aspect makes it, so the game is the same game on a
     phone and on a desktop rather than easier on one of them.
     ============================================================ */
  var VW = 400, VH = 760;

  var LANES = 3;
  function laneX(i) { return VW * (0.5 + (i - 1) * 0.247); }

  var LANE_TIME = 0.085;      // how long a lane change takes, end to end
  var REACT     = 0.22;       // reaction time the generator always leaves spare
  var BW = 78, BH = 34;       // obstacle box
  var PR = 15;                // player radius
  var HIT = 0.72;             // hitbox is smaller than the sprite, on purpose

  var cv = document.getElementById("c");
  var ctx = cv.getContext("2d");
  var wrap = document.getElementById("wrap");
  var hScore = document.getElementById("hScore");
  var hBest = document.getElementById("hBest");
  var hCombo = document.getElementById("hCombo");
  var hComboV = document.getElementById("hComboV");
  var hFuse = document.getElementById("hFuse");
  var hFuseBar = document.getElementById("hFuseBar");
  var hNewBest = document.getElementById("hNewBest");
  var startScreen = document.getElementById("startScreen");
  var overScreen = document.getElementById("overScreen");
  var overTitle = document.getElementById("overTitle");
  var overScore = document.getElementById("overScore");
  var overBest = document.getElementById("overBest");
  var overTime = document.getElementById("overTime");
  var overCombo = document.getElementById("overCombo");

  var state = "start";
  var player, rows, parts, pops, score, best, combo, comboTop, comboFuse, comboBleed;
  var tRun, shake, flash, slowmo, beatBest, nextId, spawnGap, lastRowT, arrivals, rowLog;

  /* ---------------- best score ---------------- */
  function loadBest() { try { return parseInt(localStorage.getItem("serit-best"), 10) || 0; } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem("serit-best", String(Math.floor(v))); } catch (e) {} }

  /* ---------------- audio ---------------- */
  var actx = null;
  function blip(freq, dur, type, vol, slide) {
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      if (actx.state === "suspended") actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, actx.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, actx.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.05, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  /* ---------------- sizing ---------------- */
  var dpr = 1, scale = 1;
  function resize() {
    var w = wrap.clientWidth, h = wrap.clientHeight;
    if (!w || !h) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    scale = (w * dpr) / VW;
    VH = (h * dpr) / scale;
  }
  function playerY() { return VH - Math.min(190, VH * 0.21); }

  /* ---------------- difficulty ----------------
     One number drives everything and it climbs on a deliberate curve:
     a quiet opening, then arcade, then genuinely hard, and it keeps
     creeping afterwards so an expert still has somewhere to go. */
  function diff() {
    var t = tRun;
    if (t < 15) return (t / 15) * 0.12;                 // tutorial
    if (t < 30) return 0.12 + ((t - 15) / 15) * 0.18;   // easy arcade
    if (t < 60) return 0.30 + ((t - 30) / 30) * 0.30;   // challenging
    if (t < 120) return 0.60 + ((t - 60) / 60) * 0.32;  // very difficult
    return Math.min(1, 0.92 + (t - 120) / 400 * 0.08);  // expert
  }
  function ease(a, b, d) { return a + (b - a) * d; }
  function speed() { return ease(215, 640, diff()); }
  function interval() { return ease(1.30, 0.50, diff()); }
  function fuseLen() { return ease(3.6, 2.4, diff()); }

  /* ---------------- rows ----------------
     A row is three cells: null, "block" or "gold". Nothing else exists,
     which keeps the fairness argument small enough to actually check. */
  function safeLanes(cells) {
    var out = [];
    for (var i = 0; i < LANES; i++) if (cells[i] !== "block") out.push(i);
    return out;
  }
  function minMoves(from, to) {
    var best = 9;
    for (var a = 0; a < from.length; a++)
      for (var b = 0; b < to.length; b++)
        best = Math.min(best, Math.abs(from[a] - to[b]));
    return best;
  }

  /* How many lane changes the player can make between two rows arriving.
     Everything the generator does has to fit inside this. */
  function movesAffordable(gapT) {
    return Math.max(0, Math.floor((gapT - REACT) / LANE_TIME));
  }

  function pick(a) { return a[(Math.random() * a.length) | 0]; }

  function makeRow(prevSafe, gapT) {
    var d = diff();
    var cells = [null, null, null];
    var budget = movesAffordable(gapT);

    // lanes the player could still be standing in when this row lands
    var reachable = [];
    for (var i = 0; i < LANES; i++) if (minMoves(prevSafe, [i]) <= budget) reachable.push(i);
    if (!reachable.length) reachable = prevSafe.slice();

    var roll = Math.random();
    var kind;
    if (d < 0.10) kind = roll < 0.66 ? "single" : "goldOnly";
    else if (d < 0.28) kind = roll < 0.52 ? "single" : roll < 0.72 ? "goldOnly" : roll < 0.92 ? "singleGold" : "breather";
    else if (d < 0.55) kind = roll < 0.30 ? "single" : roll < 0.54 ? "singleGold" : roll < 0.74 ? "double" : roll < 0.88 ? "gate" : roll < 0.96 ? "goldOnly" : "breather";
    else kind = roll < 0.20 ? "single" : roll < 0.42 ? "singleGold" : roll < 0.70 ? "double" : roll < 0.93 ? "gate" : "goldOnly";

    if (kind === "breather") return cells;

    if (kind === "goldOnly") {
      cells[pick(reachable)] = "gold";
      return cells;
    }

    if (kind === "gate") {
      // the signature shape: blocked either side, gold in the one way through
      var mid = pick(reachable);
      cells[mid] = "gold";
      for (var j = 0; j < LANES; j++) if (j !== mid) cells[j] = "block";
      return cells;
    }

    if (kind === "double") {
      // two blocked, one open, and the open one must be reachable
      var open = pick(reachable);
      for (var k = 0; k < LANES; k++) if (k !== open) cells[k] = "block";
      if (Math.random() < 0.55) cells[open] = "gold";
      return cells;
    }

    // single, optionally with gold in another lane
    var free = [];
    for (var m = 0; m < LANES; m++) free.push(m);
    // never block every reachable lane
    var blockable = free.filter(function (x) { return reachable.length > 1 || x !== reachable[0]; });
    var blk = pick(blockable.length ? blockable : free);
    cells[blk] = "block";
    if (kind === "singleGold") {
      var rest = [];
      for (var n = 0; n < LANES; n++) if (n !== blk) rest.push(n);
      // prefer a gold that costs a move: that is the whole decision
      var far = rest.filter(function (x) { return minMoves(reachable, [x]) > 0; });
      cells[pick((far.length && Math.random() < 0.7) ? far : rest)] = "gold";
    }
    return cells;
  }

  /* The guarantee, applied to every row before it is allowed on screen:
     something is always open, and it is always close enough to get to. */
  function spawnRow() {
    var gapT = spawnGap;
    var prev = rows.length ? rows[rows.length - 1] : null;
    var prevSafe = prev ? safeLanes(prev.cells) : [0, 1, 2];

    var cells = null;
    for (var attempt = 0; attempt < 12; attempt++) {
      var c = makeRow(prevSafe, gapT);
      var s = safeLanes(c);
      if (!s.length) continue;                                   // never all three
      if (minMoves(prevSafe, s) > movesAffordable(gapT)) continue; // always in reach
      cells = c;
      break;
    }
    if (!cells) cells = [null, null, null];                       // a breather beats a cheat

    var row = { id: nextId++, y: -BH, cells: cells, took: [false, false, false], hit: false };
    rows.push(row);
    rowLog.push({ cells: cells.slice(), gapT: gapT, prevSafe: prevSafe, safe: safeLanes(cells) });
    if (rowLog.length > 900) rowLog.shift();
    return row;
  }

  /* ---------------- particles, bounded ---------------- */
  var MAX_PARTS = 150;
  function spark(x, y, n, col, spread, up) {
    for (var i = 0; i < n && parts.length < MAX_PARTS; i++) {
      parts.push({
        x: x, y: y,
        vx: (Math.random() * 2 - 1) * spread,
        vy: (Math.random() * 2 - 1) * spread * 0.7 - (up || 0),
        life: 0.36 + Math.random() * 0.34, max: 0.7,
        col: col, r: 1.6 + Math.random() * 2.4
      });
    }
  }
  var MAX_POPS = 12;
  function pop(x, y, text, col) {
    if (pops.length >= MAX_POPS) pops.shift();
    pops.push({ x: x, y: y, text: text, col: col, life: 0.85, max: 0.85 });
  }

  /* ---------------- run control ---------------- */
  function reset() {
    nextId = 1;
    rows = [];
    parts = [];
    pops = [];
    arrivals = [];
    rowLog = [];
    score = 0;
    combo = 1;
    comboTop = 1;
    comboFuse = 0;
    comboBleed = 0;
    tRun = 0;
    shake = 0;
    flash = 0;
    slowmo = 0;
    beatBest = false;
    lastRowT = 0;
    spawnGap = interval();
    best = loadBest();
    player = { lane: 1, x: laneX(1), from: laneX(1), to: laneX(1), tw: 1, sq: 1, trail: [] };
    hNewBest.classList.remove("show");
    syncHud();
  }

  function startRun() {
    reset();
    state = "play";
    startScreen.hidden = true;
    overScreen.hidden = true;
    blip(420, 0.09, "triangle", 0.05, 760);
  }

  function gameOver() {
    state = "over";
    if (score > best) { best = score; saveBest(best); }
    overTitle.textContent = beatBest ? "NEW BEST" : "RUN OVER";
    overTitle.classList.toggle("best", beatBest);
    overScore.textContent = fmt(Math.floor(score));
    overBest.textContent = fmt(Math.floor(best));
    overTime.textContent = tRun.toFixed(1) + "s";
    overCombo.textContent = "x" + comboTop;
    overScreen.hidden = false;
    hFuse.classList.remove("on");
    blip(220, 0.34, "sawtooth", 0.07, 60);
  }

  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  /* ---------------- lane changes ---------------- */
  function move(dir) {
    if (state !== "play") return;
    var next = player.lane + dir;
    if (next < 0 || next > LANES - 1) return;
    player.lane = next;
    player.from = player.x;
    player.to = laneX(next);
    player.tw = 0;
    player.sq = 0.7;
    spark(player.x, playerY() + 6, 4, "#9aa6ff", 70, -20);
    blip(300 + next * 60, 0.045, "square", 0.028);
  }

  /* ---------------- the loop ---------------- */
  function update(dt) {
    tRun += dt;
    var d = diff();
    var sp = speed();

    // lane tween: fast enough to feel instant, slow enough to see
    if (player.tw < 1) {
      player.tw = Math.min(1, player.tw + dt / LANE_TIME);
      var e = 1 - Math.pow(1 - player.tw, 3);
      player.x = player.from + (player.to - player.from) * e;
    } else {
      player.x = player.to;
    }
    player.sq += (1 - player.sq) * Math.min(1, dt * 13);

    player.trail.unshift({ x: player.x, y: playerY() });
    if (player.trail.length > 9) player.trail.pop();

    // spawning
    spawnGap = interval();
    lastRowT += dt;
    if (lastRowT >= spawnGap) { lastRowT -= spawnGap; spawnRow(); }

    // survival pays, but never as much as playing for gold
    score += ease(11, 20, d) * dt;

    var py = playerY();
    for (var i = rows.length - 1; i >= 0; i--) {
      var r = rows[i];
      var was = r.y;
      r.y += sp * dt;

      if (was < py && r.y >= py) arrivals.push({ t: tRun, safe: safeLanes(r.cells) });

      for (var l = 0; l < LANES; l++) {
        var cell = r.cells[l];
        if (!cell || r.took[l]) continue;
        var cx = laneX(l);
        var dx = Math.abs(player.x - cx), dy = Math.abs(r.y - py);

        if (cell === "block") {
          if (dx < BW / 2 + PR * HIT && dy < BH / 2 + PR * HIT) { die(cx, r.y); return; }
        } else {
          if (dx < 34 + PR * HIT && dy < 26 + PR * HIT) { r.took[l] = true; takeGold(cx, r.y); }
        }
      }
      if (r.y > VH + 60) rows.splice(i, 1);
    }

    // the combo bleeds away if you stop taking risks
    if (combo > 1) {
      comboFuse -= dt;
      if (comboFuse <= 0) {
        comboBleed += dt;
        if (comboBleed >= 0.42) {
          comboBleed = 0;
          combo = Math.max(1, combo - 1);
          blip(220, 0.05, "sine", 0.025);
          if (combo === 1) hFuse.classList.remove("on");
          syncHud();
        }
      }
    }

    for (var p = parts.length - 1; p >= 0; p--) {
      var pa = parts[p];
      pa.life -= dt;
      if (pa.life <= 0) { parts.splice(p, 1); continue; }
      pa.x += pa.vx * dt; pa.y += pa.vy * dt; pa.vy += 190 * dt;
    }
    for (var q = pops.length - 1; q >= 0; q--) {
      var po = pops[q];
      po.life -= dt;
      if (po.life <= 0) { pops.splice(q, 1); continue; }
      po.y -= 54 * dt;
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 1.8);
    if (flash > 0) flash = Math.max(0, flash - dt * 1.6);
    syncHud();
  }

  function takeGold(x, y) {
    combo = Math.min(12, combo + 1);
    comboTop = Math.max(comboTop, combo);
    comboFuse = fuseLen();
    comboBleed = 0;
    var gain = 100 * combo;
    score += gain;

    pop(x, y, "+" + gain, combo >= 10 ? "#ffe39a" : "#ffc23d");
    spark(x, y, combo >= 10 ? 16 : 10, "#ffc23d", 130, 40);
    hCombo.classList.remove("pop"); void hCombo.offsetWidth; hCombo.classList.add("pop");
    hFuse.classList.add("on");

    if (combo >= 10) { flash = Math.max(flash, 0.55); shake = Math.max(shake, 0.18); blip(880, 0.16, "triangle", 0.06, 1320); }
    else if (combo >= 5) blip(660 + combo * 30, 0.1, "triangle", 0.05, 900);
    else blip(560 + combo * 40, 0.07, "sine", 0.045, 780);

    if (!beatBest && score > best && best > 0) {
      beatBest = true;
      hNewBest.classList.remove("show"); void hNewBest.offsetWidth; hNewBest.classList.add("show");
      flash = 1; blip(990, 0.22, "triangle", 0.07, 1480);
    }
    syncHud();
  }

  function die(x, y) {
    shake = 0.6;
    slowmo = 0.42;
    spark(player.x, playerY(), 34, "#9aa6ff", 200, 60);
    spark(x, y, 18, "#ff3d6e", 170, 30);
    gameOver();
  }

  /* ---------------- drawing ---------------- */
  function bg(d) {
    var g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, "rgb(" + Math.round(8 + d * 22) + ",8," + Math.round(20 + d * 16) + ")");
    g.addColorStop(1, "#05050c");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);

    // the road: two dividers, and rungs that scroll to sell the speed
    var scroll = (tRun * speed()) % 64;
    ctx.strokeStyle = "rgba(125, 140, 255, 0.10)";
    ctx.lineWidth = 1;
    for (var y = -64 + scroll; y < VH; y += 64) {
      ctx.beginPath(); ctx.moveTo(laneX(0) - BW / 2 - 6, y); ctx.lineTo(laneX(2) + BW / 2 + 6, y); ctx.stroke();
    }
    ctx.strokeStyle = "rgba(125, 140, 255, 0.22)";
    for (var i = 0; i < 2; i++) {
      var x = (laneX(i) + laneX(i + 1)) / 2;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, VH); ctx.stroke();
    }

    if (d > 0.42) {
      ctx.globalAlpha = (d - 0.42) * 0.55;
      ctx.strokeStyle = "#7d8cff";
      for (var s = 0; s < 10; s++) {
        var lx = ((s * 71 + (tRun * speed() * 1.4)) % (VW + 80)) - 40;
        var ly = ((s * 211 + tRun * speed() * 2.2) % (VH + 120)) - 60;
        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly + 34 + d * 40); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function render() {
    var d = diff();
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, VW, VH);
    bg(d);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 16, (Math.random() - 0.5) * shake * 14);

    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (r.y < -BH - 20 || r.y > VH + BH) continue;
      for (var l = 0; l < LANES; l++) {
        var cell = r.cells[l];
        if (!cell || r.took[l]) continue;
        var x = laneX(l);
        if (cell === "block") {
          ctx.shadowBlur = 20; ctx.shadowColor = "#ff3d6e";
          var g = ctx.createLinearGradient(0, r.y - BH / 2, 0, r.y + BH / 2);
          g.addColorStop(0, "#ff7fa0"); g.addColorStop(1, "#ff2d62");
          ctx.fillStyle = g;
          roundRect(x - BW / 2, r.y - BH / 2, BW, BH, 5); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = "rgba(6,6,14,0.5)";
          for (var s = -1; s <= 1; s++) ctx.fillRect(x + s * 17 - 2, r.y - BH / 2 + 6, 4, BH - 12);
        } else {
          var pulse = 1 + Math.sin(tRun * 5 + l * 1.7) * 0.07;
          ctx.save();
          ctx.translate(x, r.y);
          ctx.rotate(Math.PI / 4);
          ctx.scale(pulse, pulse);
          ctx.shadowBlur = 24; ctx.shadowColor = "#ffc23d";
          var gg = ctx.createLinearGradient(-11, -11, 11, 11);
          gg.addColorStop(0, "#ffe9a8"); gg.addColorStop(1, "#ffb114");
          ctx.fillStyle = gg;
          roundRect(-10.5, -10.5, 21, 21, 3); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = "rgba(255,255,255,0.85)";
          roundRect(-7, -7, 6, 6, 1.5); ctx.fill();
          ctx.restore();
        }
      }
    }

    // player: trail, then orb, then core
    var py = playerY();
    for (var t = player.trail.length - 1; t > 0; t--) {
      var tr = player.trail[t];
      ctx.globalAlpha = (1 - t / player.trail.length) * 0.3;
      ctx.fillStyle = "#7d8cff";
      ctx.beginPath(); ctx.arc(tr.x, tr.y, PR * (1 - t / player.trail.length) * 0.85, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;

    var sq = player.sq, rx = PR / sq, ry = PR * sq;
    ctx.shadowBlur = 26; ctx.shadowColor = "#7d8cff";
    var pg = ctx.createRadialGradient(player.x - 4, py - 5, 1, player.x, py, PR);
    pg.addColorStop(0, "#ffffff"); pg.addColorStop(0.45, "#8f9bff"); pg.addColorStop(1, "#4a53c9");
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.ellipse(player.x, py, rx, ry, 0, 0, 6.2832); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(player.x, py, PR * 0.32, 0, 6.2832); ctx.fill();

    for (var p = 0; p < parts.length; p++) {
      var pa = parts[p];
      ctx.globalAlpha = Math.max(0, pa.life / pa.max);
      ctx.fillStyle = pa.col;
      ctx.fillRect(pa.x - pa.r / 2, pa.y - pa.r / 2, pa.r, pa.r);
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = "center";
    ctx.font = "700 17px " + getComputedStyle(document.body).fontFamily;
    for (var q = 0; q < pops.length; q++) {
      var po = pops[q];
      ctx.globalAlpha = Math.max(0, Math.min(1, po.life / po.max * 1.6));
      ctx.fillStyle = po.col;
      ctx.shadowBlur = 12; ctx.shadowColor = po.col;
      ctx.fillText(po.text, po.x, po.y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // the hud has to stay readable even with a row arriving behind it
    var sc = ctx.createLinearGradient(0, 0, 0, 122);
    sc.addColorStop(0, "rgba(6,6,14,0.88)");
    sc.addColorStop(0.62, "rgba(6,6,14,0.5)");
    sc.addColorStop(1, "rgba(6,6,14,0)");
    ctx.fillStyle = sc;
    ctx.fillRect(0, 0, VW, 122);

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,194,61," + (flash * 0.15).toFixed(3) + ")";
      ctx.fillRect(0, 0, VW, VH);
    }
  }

  /* ---------------- hud ---------------- */
  var lastCombo = -1, shownScore = 0;
  function syncHud() {
    shownScore += (score - shownScore) * 0.3;
    if (Math.abs(score - shownScore) < 1) shownScore = score;
    hScore.textContent = fmt(Math.floor(shownScore));
    hBest.textContent = fmt(Math.floor(Math.max(best, score)));
    hBest.classList.toggle("lead", score > best && best > 0);
    if (combo !== lastCombo) {
      lastCombo = combo;
      hComboV.textContent = "x" + combo;
      hCombo.classList.toggle("on", combo > 1);
      hCombo.classList.toggle("hot", combo >= 10);
      hCombo.style.color = combo >= 10 ? "#ffc23d" : combo >= 5 ? "#ff9f4d" : "#4fe8ff";
    }
    hFuseBar.style.transform = "scaleX(" + Math.max(0, Math.min(1, comboFuse / fuseLen())).toFixed(3) + ")";
  }

  /* ---------------- input ---------------- */
  wrap.addEventListener("pointerdown", function (ev) {
    if (state === "over") { startRun(); return; }
    if (state === "start") return;
    var r = cv.getBoundingClientRect();
    move(ev.clientX - r.left < r.width / 2 ? -1 : 1);
  });

  window.addEventListener("keydown", function (ev) {
    var k = ev.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { move(-1); ev.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { move(1); ev.preventDefault(); }
    else if (k === " " || k === "Enter") { ev.preventDefault(); if (state !== "play") startRun(); }
  });

  document.getElementById("btnStart").addEventListener("click", function (ev) { ev.stopPropagation(); startRun(); });
  document.getElementById("btnAgain").addEventListener("click", function (ev) { ev.stopPropagation(); startRun(); });
  window.addEventListener("resize", resize);

  /* ---------------- boot ---------------- */
  var last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = last ? Math.min(0.032, (now - last) / 1000) : 0;
    last = now;
    if (slowmo > 0) { slowmo = Math.max(0, slowmo - dt * 2.2); dt *= 0.35; }
    if (state === "play") update(dt);
    else if (shake > 0 || parts.length) {
      for (var p = parts.length - 1; p >= 0; p--) {
        var pa = parts[p];
        pa.life -= dt;
        if (pa.life <= 0) { parts.splice(p, 1); continue; }
        pa.x += pa.vx * dt; pa.y += pa.vy * dt; pa.vy += 190 * dt;
      }
      shake = Math.max(0, shake - dt * 1.8);
    }
    render();
  }

  resize();
  best = loadBest();
  reset();
  syncHud();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
