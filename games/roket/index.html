<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="ROKET - a retro supply-run lander for phone or desktop.">
<meta name="theme-color" content="#08090e">
<style>
  :root {
    color-scheme: dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>

<style>
  :root {
    --ink:    #04060c;
    --bezel:  #16202e;
    --ice:    #bfe9ff;
    --ice-2:  #6f9dbd;
    --dim:    #1d3347;
    --beacon: #ff5ea8;
    --go:     #7dffb0;
    --warn:   #ffd166;

    --cell-font: "Press Start 2P", ui-monospace, "Courier New", monospace;
    --read-font: "VT323", ui-monospace, "Courier New", monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(120% 90% at 50% 0%, #0b1526 0%, var(--ink) 62%),
      var(--ink);
    color: var(--ice);
    font-family: var(--read-font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .cabinet {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 12px 16px;
    padding-block: 10px 12px;
    max-width: 640px;
    margin-inline: auto;
  }

  /* ---- marquee ---- */
  .marquee { text-align: center; flex: 0 0 auto; }
  .marquee h1 {
    margin: 0;
    font-family: var(--cell-font);
    font-size: clamp(15px, 5.4vw, 26px);
    letter-spacing: 0.1em;
    color: var(--ice);
    text-shadow: 0 0 6px rgba(191, 233, 255, 0.5), 0 0 22px rgba(111, 157, 189, 0.35);
    text-wrap: balance;
  }
  .marquee p {
    margin: 4px 0 0;
    font-size: clamp(13px, 3.6vw, 17px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ice-2);
    opacity: 0.75;
  }

  /* ---- hud ---- */
  .hud {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    border: 1px solid var(--dim);
    background: linear-gradient(180deg, rgba(191,233,255,0.05), transparent);
    padding: 6px 3px;
  }
  .hud div { text-align: center; }
  .hud .k {
    display: block;
    font-family: var(--cell-font);
    font-size: 7px;
    letter-spacing: 0.1em;
    color: var(--ice-2);
  }
  .hud .v {
    display: block;
    margin-top: 5px;
    font-size: clamp(18px, 5.2vw, 23px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--ice);
  }
  .hud .v.ok   { color: var(--go); }
  .hud .v.bad  { color: var(--beacon); }
  .hud .v.low  { color: var(--warn); }
  .hud .v.bump { animation: bump 240ms steps(3) 1; }
  @keyframes bump { 50% { transform: scale(1.22); } }

  /* ---- screen ---- */
  .stage {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .screen {
    position: relative;
    border: 2px solid var(--bezel);
    border-radius: 10px;
    background: #03050a;
    box-shadow:
      0 0 0 4px #080d16,
      0 0 40px rgba(111, 157, 189, 0.12) inset,
      0 10px 34px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .scan, .vignette { position: absolute; inset: 0; pointer-events: none; }
  .scan {
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.26) 0 1px, rgba(0,0,0,0) 1px 3px);
    mix-blend-mode: multiply;
  }
  .vignette {
    background: radial-gradient(110% 110% at 50% 45%, transparent 52%, rgba(0,0,0,0.72) 100%);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 11px;
    text-align: center;
    padding: 18px;
    background: rgba(4, 7, 13, 0.86);
    z-index: 3;
  }
  .overlay h2 {
    margin: 0;
    font-family: var(--cell-font);
    font-size: clamp(13px, 4.4vw, 19px);
    letter-spacing: 0.05em;
    color: var(--ice);
    text-shadow: 0 0 10px rgba(191, 233, 255, 0.45);
  }
  .overlay h2.over { color: var(--beacon); text-shadow: 0 0 12px rgba(255, 94, 168, 0.5); }
  .overlay p { margin: 0; font-size: clamp(16px, 4.2vw, 20px); letter-spacing: 0.06em; color: var(--ice-2); }
  .overlay p em { font-style: normal; color: var(--ice); }
  .blink { animation: blink 1.05s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }

  .banner {
    position: absolute;
    left: 0; right: 0;
    top: 26%;
    z-index: 2;
    text-align: center;
    font-family: var(--cell-font);
    font-size: clamp(11px, 3.4vw, 15px);
    letter-spacing: 0.06em;
    color: var(--go);
    text-shadow: 0 2px 0 #000, 0 0 14px rgba(125, 255, 176, 0.5);
    animation: banner 1.7s ease-out 1 forwards;
    pointer-events: none;
  }
  @keyframes banner {
    0%   { opacity: 0; transform: translateY(10px) scale(0.92); }
    18%  { opacity: 1; transform: translateY(0) scale(1); }
    76%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---- controls ---- */
  .controls {
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    gap: 12px;
    touch-action: none;
  }
  .pad { display: flex; gap: 6px; }
  .pad button {
    font: inherit;
    color: var(--ice);
    background: linear-gradient(180deg, #16222f, #0a1017);
    border: 1px solid var(--dim);
    border-radius: 7px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: none;
  }
  .pad button:active, .pad button.held {
    background: var(--ice);
    color: #061019;
    border-color: var(--ice);
  }
  .tilt button { width: 58px; height: 54px; font-size: 19px; }
  .burn button {
    width: 118px; height: 54px;
    font-family: var(--cell-font);
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--go);
    border-color: #245b42;
  }
  .burn button:active, .burn button.held { background: var(--go); color: #04170d; }

  .sidekeys { flex: 0 0 auto; display: flex; gap: 6px; justify-content: center; }
  .sidekeys button {
    font-family: var(--cell-font);
    font-size: 7px;
    letter-spacing: 0.08em;
    padding: 8px 10px;
    color: var(--ice-2);
    background: #0a1017;
    border: 1px solid var(--dim);
    border-radius: 5px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .sidekeys button:active, .sidekeys button[aria-pressed="true"] { color: var(--ice); border-color: var(--ice); }

  button:focus-visible, .screen:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }

  .hint {
    flex: 0 0 auto;
    margin: 0;
    text-align: center;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--ice-2);
    opacity: 0.55;
  }

  @media (max-height: 700px) {
    .marquee p, .hint { display: none; }
    .tilt button, .burn button { height: 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blink, .hud .v.bump, .banner { animation: none; }
  }
</style>

<body>
<div class="cabinet">
  <header class="marquee">
    <h1>ROKET</h1>
    <p>Cabinet No. 21 &mdash; 1981</p>
  </header>

  <div class="hud">
    <div><span class="k">FUEL</span><span class="v" id="hFuel">100</span></div>
    <div><span class="k">DROPS</span><span class="v" id="hDrops">0</span></div>
    <div><span class="k">V-SPD</span><span class="v" id="hVs">0</span></div>
    <div><span class="k">H-SPD</span><span class="v" id="hHs">0</span></div>
  </div>

  <div class="stage" id="stage">
    <div class="screen" id="screen" tabindex="0" aria-label="Lander game screen">
      <canvas id="view"></canvas>
      <div class="scan"></div>
      <div class="vignette"></div>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">INSERT COIN</h2>
        <p id="ovBody">Fly supplies pad to pad. Land soft, land level.</p>
        <p class="blink" id="ovBlink">&#9654; PRESS START</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="pad tilt">
      <button data-hold="left" aria-label="Rotate left">&#8634;</button>
      <button data-hold="right" aria-label="Rotate right">&#8635;</button>
    </div>
    <div class="pad burn">
      <button data-hold="thrust">BURN</button>
    </div>
  </div>

  <div class="sidekeys">
    <button id="btnPause">PAUSE</button>
    <button id="btnSound" aria-pressed="true">SOUND ON</button>
    <button id="btnReset">RESTART</button>
  </div>

  <p class="hint">Hold BURN &middot; &#8634; &#8635; to tilt &middot; arrows / WASD on a keyboard &middot; P pauses</p>
</div>

<script>
(function () {
  "use strict";

  /* ---------------- world constants ----------------
     Everything below is in world units. The view scales world height to the
     screen, so the flight model is identical on a phone and on a desktop. */
  var WORLD_W = 2000, WORLD_H = 620;
  var STEP = 40;                    // terrain sample spacing
  var GRAV = 34;                    // world units / s^2
  var THRUST = 92;
  var ROT_SPEED = 132;              // degrees / s
  var BURN_RATE = 12.5;             // fuel % per second of burn
  var MAX_VY = 42, MAX_VX = 25, MAX_TILT = 14;
  var LEG_H = 13;                   // ship centre to footpad

  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d");
  var screenEl = document.getElementById("screen");
  var stageEl = document.getElementById("stage");
  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ovTitle");
  var ovBody = document.getElementById("ovBody");
  var ovBlink = document.getElementById("ovBlink");
  var hFuel = document.getElementById("hFuel");
  var hDrops = document.getElementById("hDrops");
  var hVs = document.getElementById("hVs");
  var hHs = document.getElementById("hHs");
  var btnPause = document.getElementById("btnPause");
  var btnSound = document.getElementById("btnSound");
  var btnReset = document.getElementById("btnReset");

  var state = "idle";               // idle | running | paused | over
  var ship, terrain, pads, target, particles, stars;
  var drops, best, wind, windTarget, camX, viewW, scale, shake, bannerEl, endReason;
  var soundOn = true;
  var held = { left: false, right: false, thrust: false };

  /* ---------------- persistence ---------------- */
  function loadBest() {
    try { return parseInt(localStorage.getItem("roket-best"), 10) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) { try { localStorage.setItem("roket-best", String(v)); } catch (e) {} }
  function loadSound() {
    try { var v = localStorage.getItem("roket-sound"); return v === null ? true : v === "1"; }
    catch (e) { return true; }
  }
  function saveSound(v) { try { localStorage.setItem("roket-sound", v ? "1" : "0"); } catch (e) {} }

  /* ---------------- audio ---------------- */
  var actx = null, burnOsc = null, burnGain = null, burnNoise = null;
  function audio() {
    if (actx) return actx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    } catch (e) { return null; }
    return actx;
  }
  function blip(freq, dur, type, vol) {
    if (!soundOn) return;
    var a = audio();
    if (!a) return;
    try {
      if (a.state === "suspended") a.resume();
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, a.currentTime);
      g.gain.setValueAtTime(vol || 0.05, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + dur);
    } catch (e) {}
  }
  function burnOn() {
    if (!soundOn || burnOsc) return;
    var a = audio();
    if (!a) return;
    try {
      if (a.state === "suspended") a.resume();
      burnOsc = a.createOscillator();
      burnGain = a.createGain();
      burnOsc.type = "sawtooth";
      burnOsc.frequency.setValueAtTime(58, a.currentTime);
      burnGain.gain.setValueAtTime(0.0001, a.currentTime);
      burnGain.gain.setTargetAtTime(0.03, a.currentTime, 0.05);
      burnOsc.connect(burnGain);
      burnGain.connect(a.destination);
      burnOsc.start();
    } catch (e) { burnOsc = null; }
  }
  function burnOff() {
    if (!burnOsc) return;
    try { burnOsc.stop(); } catch (e) {}
    burnOsc = null; burnGain = null;
  }

  /* ---------------- layout ---------------- */
  function fit() {
    var r = stageEl.getBoundingClientRect();
    var availW = r.width - 4, availH = r.height - 4;
    if (availW < 40 || availH < 40) return;

    var aspect = Math.max(0.62, Math.min(1.75, availW / availH));
    var w = Math.min(availW, availH * aspect);
    var h = w / aspect;

    screenEl.style.width = Math.floor(w) + 4 + "px";
    screenEl.style.height = Math.floor(h) + 4 + "px";

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    scale = canvas.height / WORLD_H;
    viewW = canvas.width / scale;
  }

  /* ---------------- terrain ---------------- */
  function buildWorld() {
    var n = Math.floor(WORLD_W / STEP) + 1;
    terrain = [];
    var y = 420 + Math.random() * 110;
    for (var i = 0; i < n; i++) {
      y += (Math.random() - 0.5) * 96;
      y = Math.max(248, Math.min(578, y));
      terrain.push({ x: i * STEP, y: y });
    }
    // gentle smoothing so the ridge reads as rock, not noise
    for (var pass = 0; pass < 2; pass++) {
      for (var j = 1; j < n - 1; j++) {
        terrain[j].y = (terrain[j - 1].y + terrain[j].y * 2 + terrain[j + 1].y) / 4;
      }
    }

    // five landing shelves, flattened into the ridge and spread across the map
    pads = [];
    var slots = 5;
    for (var p = 0; p < slots; p++) {
      var centre = Math.floor((p + 0.5) * n / slots + (Math.random() - 0.5) * 3);
      var i0 = Math.max(1, centre - 1), i1 = Math.min(n - 2, centre + 1);
      var py = Math.round(terrain[centre].y);
      for (var k = i0; k <= i1; k++) terrain[k].y = py;
      pads.push({ x0: terrain[i0].x, x1: terrain[i1].x, y: py, mid: (terrain[i0].x + terrain[i1].x) / 2 });
    }

    stars = [];
    for (var s = 0; s < 190; s++) {
      stars.push({ x: Math.random() * WORLD_W, y: Math.random() * 330, b: 0.25 + Math.random() * 0.75 });
    }
  }

  function groundAt(x) {
    if (x <= 0) return terrain[0].y;
    var i = Math.floor(x / STEP);
    if (i >= terrain.length - 1) return terrain[terrain.length - 1].y;
    var a = terrain[i], b = terrain[i + 1];
    var t = (x - a.x) / STEP;
    return a.y + (b.y - a.y) * t;
  }

  function padAt(x) {
    for (var i = 0; i < pads.length; i++) {
      if (x >= pads[i].x0 - 4 && x <= pads[i].x1 + 4) return pads[i];
    }
    return null;
  }

  /* ---------------- game ---------------- */
  function reset(startNow) {
    buildWorld();
    var home = pads[0];
    ship = {
      x: home.mid, y: home.y - LEG_H,
      vx: 0, vy: 0, angle: 0,
      fuel: 100, landed: true, dead: false
    };
    drops = 0;
    particles = [];
    shake = 0;
    wind = 0;
    pickTarget(home);
    best = loadBest();
    endReason = "";
    fit();
    camX = Math.max(0, Math.min(WORLD_W - viewW, ship.x - viewW / 2));
    setState(startNow ? "running" : "idle");
    syncHud();
    render(0);
  }

  // The next drop is a hop, not an expedition: prefer pads within fuel range of
  // where you are standing, and only fall back to the far ones if none are.
  function pickTarget(exclude) {
    var from = exclude ? exclude.mid : ship.x;
    var pool = pads.filter(function (p) { return p !== exclude; });
    var near = pool.filter(function (p) { return Math.abs(p.mid - from) <= 620; });
    var choices = near.length ? near : pool;
    target = choices[(Math.random() * choices.length) | 0];
    windTarget = (Math.random() * 2 - 1) * 20;
  }

  function update(dt) {
    // wind drifts toward its new setting rather than snapping
    wind += (windTarget - wind) * Math.min(1, dt * 0.6);

    var burning = held.thrust && ship.fuel > 0 && !ship.dead;

    if (!ship.dead) {
      if (held.left) ship.angle -= ROT_SPEED * dt;
      if (held.right) ship.angle += ROT_SPEED * dt;
      if (ship.angle < -180) ship.angle += 360;
      if (ship.angle > 180) ship.angle -= 360;

      if (burning) {
        ship.landed = false;
        ship.fuel = Math.max(0, ship.fuel - BURN_RATE * dt);
        var rad = (ship.angle - 90) * Math.PI / 180;
        ship.vx += Math.cos(rad) * THRUST * dt;
        ship.vy += Math.sin(rad) * THRUST * dt;
        spawnExhaust(rad);
      }
    }

    if (!ship.landed) {
      ship.vy += GRAV * dt;
      ship.vx += wind * dt;
      ship.x += ship.vx * dt;
      ship.y += ship.vy * dt;

      if (ship.x < 12) { ship.x = 12; ship.vx = Math.abs(ship.vx) * 0.4; }
      if (ship.x > WORLD_W - 12) { ship.x = WORLD_W - 12; ship.vx = -Math.abs(ship.vx) * 0.4; }
      if (ship.y < 18) { ship.y = 18; ship.vy = Math.abs(ship.vy) * 0.3; }

      var ground = groundAt(ship.x);
      if (ship.y + LEG_H >= ground) touchdown(ground);
    } else if (ship.fuel <= 0 && state === "running" && !ship.dead) {
      stranded();
    }

    // burn note follows the throttle
    if (burning) burnOn(); else burnOff();

    stepParticles(dt);
    if (shake > 0) shake = Math.max(0, shake - dt * 1.6);

    // camera trails the ship, clamped to the world edges
    var want = ship.x - viewW / 2;
    camX = Math.max(0, Math.min(WORLD_W - viewW, want));

    syncHud();
  }

  function touchdown(ground) {
    var pad = padAt(ship.x);
    var level = Math.abs(ship.angle) < MAX_TILT;
    var soft = Math.abs(ship.vy) < MAX_VY && Math.abs(ship.vx) < MAX_VX;

    if (pad && level && soft) {
      ship.y = ground - LEG_H;
      ship.vx = 0; ship.vy = 0; ship.angle = 0;
      ship.landed = true;
      shake = 0.12;

      if (pad === target) {
        drops++;
        ship.fuel = 100;            // a delivery is a refuelling stop too
        if (drops > best) { best = drops; saveBest(best); }
        banner("DELIVERED · TANK FULL");
        blip(680, 0.09); setTimeout(function () { blip(910, 0.13); }, 110);
        bump(hDrops);
        pickTarget(pad);
      } else {
        banner("TOUCHDOWN · WRONG PAD");
        blip(420, 0.08, "triangle");
      }
      syncHud();
      return;
    }
    crash(ground);
  }

  function crash(ground) {
    endReason = "crash";
    ship.y = ground - LEG_H * 0.4;
    ship.dead = true;
    ship.landed = true;
    shake = 0.85;
    burnOff();
    for (var i = 0; i < 46; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 24 + Math.random() * 140;
      particles.push({
        x: ship.x, y: ship.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
        life: 0.5 + Math.random() * 0.9, max: 1.4, hot: true
      });
    }
    blip(160, 0.28, "sawtooth", 0.08);
    setTimeout(function () { blip(90, 0.45, "sawtooth", 0.07); }, 120);
    setTimeout(function () { if (state === "running") setState("over"); }, 900);
  }

  function stranded() {
    endReason = "fuel";
    ship.dead = true;
    burnOff();
    blip(220, 0.3, "sawtooth", 0.06);
    setTimeout(function () { if (state === "running") setState("over"); }, 700);
  }

  /* ---------------- particles ---------------- */
  function spawnExhaust(rad) {
    for (var i = 0; i < 2; i++) {
      var spread = (Math.random() - 0.5) * 0.5;
      var a = rad + Math.PI + spread;
      var sp = 90 + Math.random() * 70;
      particles.push({
        x: ship.x - Math.cos(rad) * LEG_H,
        y: ship.y - Math.sin(rad) * LEG_H,
        vx: ship.vx + Math.cos(a) * sp,
        vy: ship.vy + Math.sin(a) * sp,
        life: 0.22 + Math.random() * 0.2, max: 0.42, hot: false
      });
    }
  }

  function stepParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += GRAV * 0.55 * dt;
      p.vx += wind * 0.6 * dt;
    }
  }

  /* ---------------- rendering ---------------- */
  function render(now) {
    if (!terrain) return;
    var W = canvas.width, H = canvas.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#03050a";
    ctx.fillRect(0, 0, W, H);

    var sx = shake > 0 ? (Math.random() - 0.5) * shake * 16 : 0;
    var sy = shake > 0 ? (Math.random() - 0.5) * shake * 12 : 0;

    // sky first, in screen space: stars and the home world drift slowly
    drawSky(now);

    ctx.setTransform(scale, 0, 0, scale, (-camX + sx) * scale, sy * scale);
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    drawTerrain(now);
    drawParticles();
    if (!ship.dead) drawShip(now);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawGuide(now);
  }

  function drawSky(now) {
    var H = canvas.height, W = canvas.width;
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var x = (st.x - camX * 0.35) * scale;
      x = ((x % (WORLD_W * scale)) + WORLD_W * scale) % (WORLD_W * scale);
      if (x > W) continue;
      var tw = 0.65 + Math.sin(now / 600 + st.x) * 0.35;
      ctx.fillStyle = "rgba(191, 233, 255," + (st.b * tw * 0.9).toFixed(2) + ")";
      ctx.fillRect(x, st.y * scale, Math.max(1, scale), Math.max(1, scale));
    }

    // the world they are supplying, hanging over the ridge and drifting gently
    var px = W * 0.74 - camX * 0.06 * scale;
    var py = H * 0.15;
    var pr = Math.min(H * 0.085, W * 0.16);
    ctx.fillStyle = "rgba(40, 78, 116, 0.5)";
    ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(151, 205, 240, 0.45)";
    ctx.lineWidth = Math.max(1, scale * 1.1);
    ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(24, 52, 82, 0.55)";
    ctx.beginPath(); ctx.arc(px - pr * 0.3, py - pr * 0.22, pr * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(px + pr * 0.35, py + pr * 0.3, pr * 0.22, 0, Math.PI * 2); ctx.fill();
  }

  function drawTerrain(now) {
    var from = Math.max(0, Math.floor(camX / STEP) - 1);
    var to = Math.min(terrain.length - 1, Math.ceil((camX + viewW) / STEP) + 1);

    ctx.beginPath();
    ctx.moveTo(terrain[from].x, WORLD_H);
    for (var i = from; i <= to; i++) ctx.lineTo(terrain[i].x, terrain[i].y);
    ctx.lineTo(terrain[to].x, WORLD_H);
    ctx.closePath();
    ctx.fillStyle = "#070d18";
    ctx.fill();

    ctx.beginPath();
    for (var j = from; j <= to; j++) {
      if (j === from) ctx.moveTo(terrain[j].x, terrain[j].y);
      else ctx.lineTo(terrain[j].x, terrain[j].y);
    }
    ctx.strokeStyle = "#7fb9dd";
    ctx.lineWidth = 1.8;
    ctx.stroke();

    for (var p = 0; p < pads.length; p++) {
      var pad = pads[p];
      if (pad.x1 < camX - 60 || pad.x0 > camX + viewW + 60) continue;
      var isTarget = pad === target;
      var pulse = 0.62 + Math.sin(now / 240) * 0.34;

      if (isTarget) {
        var grad = ctx.createLinearGradient(0, pad.y - 190, 0, pad.y);
        grad.addColorStop(0, "rgba(255, 94, 168, 0)");
        grad.addColorStop(1, "rgba(255, 94, 168," + (0.16 * pulse).toFixed(3) + ")");
        ctx.fillStyle = grad;
        ctx.fillRect(pad.x0 - 6, pad.y - 190, pad.x1 - pad.x0 + 12, 190);
      }

      ctx.strokeStyle = isTarget ? "rgba(255, 94, 168," + (0.55 + pulse * 0.45).toFixed(2) + ")" : "#3f6b86";
      ctx.lineWidth = isTarget ? 4.5 : 3;
      ctx.beginPath();
      ctx.moveTo(pad.x0, pad.y);
      ctx.lineTo(pad.x1, pad.y);
      ctx.stroke();

      // marker posts at each end
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(pad.x0, pad.y); ctx.lineTo(pad.x0, pad.y - (isTarget ? 13 : 8));
      ctx.moveTo(pad.x1, pad.y); ctx.lineTo(pad.x1, pad.y - (isTarget ? 13 : 8));
      ctx.stroke();
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var t = Math.max(0, p.life / p.max);
      if (p.hot) {
        ctx.fillStyle = "rgba(255," + Math.round(120 + 110 * t) + "," + Math.round(60 + 90 * (1 - t)) + "," + t.toFixed(2) + ")";
        ctx.fillRect(p.x - 1.6, p.y - 1.6, 3.2, 3.2);
      } else {
        ctx.fillStyle = "rgba(191, 233, 255," + (t * 0.75).toFixed(2) + ")";
        ctx.fillRect(p.x - 1.2, p.y - 1.2, 2.4, 2.4);
      }
    }
  }

  function drawShip(now) {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle * Math.PI / 180);

    var burning = held.thrust && ship.fuel > 0 && state === "running";
    if (burning) {
      var flick = 0.7 + Math.random() * 0.5;
      ctx.beginPath();
      ctx.moveTo(-4.5, 8);
      ctx.lineTo(0, 8 + 16 * flick);
      ctx.lineTo(4.5, 8);
      ctx.closePath();
      ctx.fillStyle = "rgba(255, 186, 120, 0.9)";
      ctx.fill();
    }

    ctx.strokeStyle = "#dff2ff";
    ctx.lineWidth = 1.8;

    // hull: a blunt capsule rather than the original's open triangle
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.lineTo(6, -4);
    ctx.lineTo(6, 6);
    ctx.lineTo(-6, 6);
    ctx.lineTo(-6, -4);
    ctx.closePath();
    ctx.fillStyle = "#0d1b28";
    ctx.fill();
    ctx.stroke();

    // cockpit
    ctx.beginPath();
    ctx.arc(0, -4, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = "#7fd8ff";
    ctx.fill();

    // legs
    ctx.beginPath();
    ctx.moveTo(-5, 6); ctx.lineTo(-9, 13); ctx.moveTo(-12, 13); ctx.lineTo(-6, 13);
    ctx.moveTo(5, 6);  ctx.lineTo(9, 13);  ctx.moveTo(12, 13);  ctx.lineTo(6, 13);
    ctx.stroke();

    ctx.restore();
  }

  // off-screen target arrow, drawn in screen space at the edge it sits behind
  function drawGuide(now) {
    if (!target || ship.dead) return;
    var W = canvas.width, H = canvas.height;
    var onScreen = target.mid > camX + 20 && target.mid < camX + viewW - 20;
    if (onScreen) return;

    var right = target.mid > camX + viewW / 2;
    var x = right ? W - 22 * scale : 22 * scale;
    var y = Math.max(30 * scale, Math.min(H - 30 * scale, target.y * scale - 40 * scale));
    var pulse = 0.55 + Math.sin(now / 220) * 0.45;

    ctx.fillStyle = "rgba(255, 94, 168," + (0.45 + pulse * 0.5).toFixed(2) + ")";
    ctx.beginPath();
    var d = right ? 1 : -1;
    ctx.moveTo(x + 9 * scale * d, y);
    ctx.lineTo(x - 7 * scale * d, y - 9 * scale);
    ctx.lineTo(x - 7 * scale * d, y + 9 * scale);
    ctx.closePath();
    ctx.fill();

    var dist = Math.round(Math.abs(target.mid - ship.x));
    ctx.fillStyle = "rgba(191, 233, 255, 0.8)";
    ctx.font = Math.round(11 * scale) + "px ui-monospace, monospace";
    ctx.textAlign = right ? "right" : "left";
    ctx.fillText(dist + "m", x - 14 * scale * d, y + 4 * scale);
  }

  /* ---------------- hud ---------------- */
  function bump(el) {
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  function syncHud() {
    var vs = Math.round(ship.vy), hs = Math.round(ship.vx);
    hFuel.textContent = Math.ceil(ship.fuel);
    hFuel.className = "v" + (ship.fuel <= 25 ? " low" : "");
    hDrops.textContent = drops;
    hVs.textContent = vs;
    hVs.className = "v " + (Math.abs(vs) < MAX_VY ? "ok" : "bad");
    hHs.textContent = hs;
    hHs.className = "v " + (Math.abs(hs) < MAX_VX ? "ok" : "bad");
  }

  function banner(text) {
    if (bannerEl && bannerEl.parentNode) bannerEl.parentNode.removeChild(bannerEl);
    bannerEl = document.createElement("div");
    bannerEl.className = "banner";
    bannerEl.textContent = text;
    screenEl.appendChild(bannerEl);
    var mine = bannerEl;
    setTimeout(function () { if (mine.parentNode) mine.parentNode.removeChild(mine); }, 1800);
  }

  function setState(next) {
    state = next;
    btnPause.textContent = state === "paused" ? "RESUME" : "PAUSE";

    if (state === "running") {
      overlay.hidden = true;
      return;
    }
    burnOff();
    overlay.hidden = false;
    ovTitle.classList.toggle("over", state === "over");

    if (state === "idle") {
      ovTitle.textContent = "INSERT COIN";
      ovBody.innerHTML = "Fly the supply run: set down on the <em>lit pad</em>, " +
                         "soft and level. Every delivery <em>fills the tank</em>, so the " +
                         "only thing that can end the run is the ground.";
      ovBlink.innerHTML = "&#9654; PRESS START";
    } else if (state === "paused") {
      ovTitle.textContent = "PAUSED";
      ovBody.textContent = "Holding position.";
      ovBlink.innerHTML = "&#9654; TAP OR PRESS P";
    } else if (state === "over") {
      var dry = endReason === "fuel";
      var why = dry ? "Stranded on the pad with dry tanks" : "Wreckage on the surface";
      ovTitle.textContent = dry ? "OUT OF FUEL" : "LANDER LOST";
      ovBody.innerHTML = why + " &middot; <em>" + drops + "</em> delivered" +
                         (drops >= best && drops > 0 ? " &middot; <em>BEST RUN</em>" : " &middot; best <em>" + best + "</em>");
      ovBlink.innerHTML = "&#9654; TAP TO FLY AGAIN";
    }
  }

  function start() { lastTs = 0; setState("running"); blip(560, 0.06); }
  function togglePause() {
    if (state === "running") setState("paused");
    else if (state === "paused") start();
  }
  function primary() {
    if (state === "idle" || state === "paused") start();
    else if (state === "over") reset(true);
    else setState("paused");
  }

  /* ---------------- loop ---------------- */
  var lastTs = 0;
  function frame(now) {
    var dt = lastTs ? Math.min(0.05, (now - lastTs) / 1000) : 0;
    lastTs = now;
    if (state === "running") update(dt);
    render(now);
    requestAnimationFrame(frame);
  }

  /* ---------------- input ---------------- */
  var KEYS = {
    ArrowLeft: "left", a: "left", A: "left",
    ArrowRight: "right", d: "right", D: "right",
    ArrowUp: "thrust", w: "thrust", W: "thrust"
  };

  window.addEventListener("keydown", function (ev) {
    var k = KEYS[ev.key];
    if (k) {
      ev.preventDefault();
      if (state === "idle") start();
      held[k] = true;
      return;
    }
    if (ev.key === " ") {
      ev.preventDefault();
      if (state === "running") { held.thrust = true; }
      else primary();
      return;
    }
    if (ev.key === "p" || ev.key === "P") { ev.preventDefault(); togglePause(); }
    else if (ev.key === "Enter") { ev.preventDefault(); primary(); }
    else if (ev.key === "r" || ev.key === "R") { ev.preventDefault(); reset(true); }
  });
  window.addEventListener("keyup", function (ev) {
    var k = KEYS[ev.key];
    if (k) { ev.preventDefault(); held[k] = false; }
    else if (ev.key === " ") { held.thrust = false; }
  });
  window.addEventListener("blur", function () {
    held.left = held.right = held.thrust = false;
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-hold]"), function (b) {
    var k = b.dataset.hold;
    var press = function (ev) {
      ev.preventDefault();
      if (state === "idle") start();
      held[k] = true;
      b.classList.add("held");
      if (b.setPointerCapture && ev.pointerId !== undefined) {
        try { b.setPointerCapture(ev.pointerId); } catch (e) {}
      }
    };
    var release = function (ev) {
      if (ev) ev.preventDefault();
      held[k] = false;
      b.classList.remove("held");
    };
    b.addEventListener("pointerdown", press);
    b.addEventListener("pointerup", release);
    b.addEventListener("pointercancel", release);
    b.addEventListener("pointerleave", release);
    b.addEventListener("click", function (ev) { ev.preventDefault(); });
    b.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });
  });

  screenEl.addEventListener("pointerup", function (ev) { ev.preventDefault(); primary(); });
  screenEl.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });

  btnPause.addEventListener("click", togglePause);
  btnReset.addEventListener("click", function () { reset(true); });
  btnSound.addEventListener("click", function () {
    soundOn = !soundOn;
    saveSound(soundOn);
    btnSound.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    btnSound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    if (!soundOn) burnOff();
    else blip(620, 0.05);
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && state === "running") setState("paused");
  });

  /* ---------------- boot ---------------- */
  function boot(saved) {
    soundOn = loadSound();
    btnSound.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    btnSound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    fit();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(stageEl);
    window.addEventListener("resize", fit);
    reset(false);
    if (saved && saved.best > best) { best = saved.best; saveBest(best); }
    syncHud();
    requestAnimationFrame(frame);
  }

  if (window.claude && window.claude.hot) {
    try { window.claude.hot.snapshot(function () { return { best: best || 0 }; }); } catch (e) {}
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(boot);
  } else {
    boot({});
  }
})();
</script>
</body>
</html>
