<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="YARIS - a retro Enduro-style road racer for phone or desktop.">
<meta name="theme-color" content="#08090e">
<style>
  :root {
    color-scheme: dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>YARIŞ</title>
<link rel="preload" href="../../assets/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  :root {
    --ink:     #08060a;
    --bezel:   #241a12;
    --amber:   #ffb02e;
    --amber-2: #c2801c;
    --dim:     #4a3315;
    --hot:     #ff5a2b;
    --pale:    #ffe0a8;

    --cell-font: "Press Start 2P", ui-monospace, "Courier New", monospace;
    --read-font: "VT323", ui-monospace, "Courier New", monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(120% 90% at 50% 0%, #241608 0%, var(--ink) 62%),
      var(--ink);
    color: var(--amber);
    font-family: var(--read-font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .cabinet {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 12px 16px;
    padding-block: 10px 12px;
    max-width: 640px;
    margin-inline: auto;
  }

  /* ---- marquee ---- */
  .marquee { text-align: center; flex: 0 0 auto; }
  .marquee h1 {
    margin: 0;
    font-family: var(--cell-font);
    font-size: clamp(15px, 5.4vw, 26px);
    letter-spacing: 0.08em;
    color: var(--amber);
    text-shadow: 0 0 6px rgba(255, 176, 46, 0.55), 0 0 22px rgba(255, 90, 43, 0.3);
    text-wrap: balance;
  }
  .marquee p {
    margin: 4px 0 0;
    font-size: clamp(13px, 3.6vw, 17px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--amber-2);
    opacity: 0.75;
  }

  /* ---- hud ---- */
  .hud {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    border: 1px solid var(--dim);
    background: linear-gradient(180deg, rgba(255,176,46,0.06), transparent);
    padding: 6px 3px;
  }
  .hud div { text-align: center; }
  .hud .k {
    display: block;
    font-family: var(--cell-font);
    font-size: 7px;
    letter-spacing: 0.1em;
    color: var(--amber-2);
  }
  .hud .v {
    display: block;
    margin-top: 5px;
    font-size: clamp(19px, 5.4vw, 24px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--pale);
  }
  .hud .quota .v.done { color: #6fe36a; }
  .hud .best .v { color: var(--amber); }
  .hud .v.bump { animation: bump 240ms steps(3) 1; }
  @keyframes bump { 50% { transform: scale(1.22); } }

  /* ---- screen ---- */
  .stage {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .screen {
    position: relative;
    border: 2px solid var(--bezel);
    border-radius: 10px;
    background: #050406;
    box-shadow:
      0 0 0 4px #0e0a07,
      0 0 40px rgba(255, 176, 46, 0.1) inset,
      0 10px 34px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .scan, .vignette { position: absolute; inset: 0; pointer-events: none; }
  .scan {
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.28) 0 1px, rgba(0,0,0,0) 1px 3px);
    mix-blend-mode: multiply;
  }
  .vignette {
    background: radial-gradient(110% 110% at 50% 45%, transparent 52%, rgba(0,0,0,0.7) 100%);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 11px;
    text-align: center;
    padding: 18px;
    background: rgba(8, 6, 5, 0.84);
    z-index: 3;
  }
  .overlay h2 {
    margin: 0;
    font-family: var(--cell-font);
    font-size: clamp(13px, 4.4vw, 19px);
    letter-spacing: 0.05em;
    color: var(--amber);
    text-shadow: 0 0 10px rgba(255, 176, 46, 0.45);
  }
  .overlay h2.over { color: var(--hot); text-shadow: 0 0 12px rgba(255, 90, 43, 0.5); }
  .overlay p { margin: 0; font-size: clamp(16px, 4.2vw, 20px); letter-spacing: 0.06em; color: var(--amber-2); }
  .overlay p em { font-style: normal; color: var(--pale); }
  .blink { animation: blink 1.05s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }

  /* day-complete banner */
  .banner {
    position: absolute;
    left: 0; right: 0;
    top: 34%;
    z-index: 2;
    text-align: center;
    font-family: var(--cell-font);
    font-size: clamp(11px, 3.6vw, 16px);
    letter-spacing: 0.06em;
    color: #fff;
    text-shadow: 0 2px 0 #000, 0 0 14px rgba(255,255,255,0.5);
    animation: banner 1.8s ease-out 1 forwards;
    pointer-events: none;
  }
  @keyframes banner {
    0%   { opacity: 0; transform: translateY(10px) scale(0.9); }
    18%  { opacity: 1; transform: translateY(0) scale(1); }
    78%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---- controls ---- */
  .controls {
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    gap: 12px;
    touch-action: none;
  }
  .pad { display: flex; gap: 6px; }
  .pad button {
    font: inherit;
    color: var(--amber);
    background: linear-gradient(180deg, #2a1d10, #140e08);
    border: 1px solid var(--dim);
    border-radius: 7px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: none;
  }
  .pad button:active, .pad button.held {
    background: var(--amber);
    color: #150d04;
    border-color: var(--amber);
  }
  .steer button { width: 58px; height: 52px; font-size: 19px; }
  .pedals button {
    width: 72px; height: 52px;
    font-family: var(--cell-font);
    font-size: 8px;
    letter-spacing: 0.06em;
  }
  .pedals .gas { color: #8fe87f; border-color: #2f5c26; }
  .pedals .gas:active, .pedals .gas.held { background: #8fe87f; color: #0c1a08; }

  .sidekeys { flex: 0 0 auto; display: flex; gap: 6px; justify-content: center; }
  .sidekeys button {
    font-family: var(--cell-font);
    font-size: 7px;
    letter-spacing: 0.08em;
    padding: 8px 10px;
    color: var(--amber-2);
    background: #140e08;
    border: 1px solid var(--dim);
    border-radius: 5px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .sidekeys button:active, .sidekeys button[aria-pressed="true"] { color: var(--pale); border-color: var(--amber); }

  button:focus-visible, .screen:focus-visible { outline: 2px solid var(--pale); outline-offset: 2px; }

  .hint {
    flex: 0 0 auto;
    margin: 0;
    text-align: center;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--amber-2);
    opacity: 0.55;
  }

  @media (max-height: 700px) {
    .marquee p, .hint { display: none; }
    .steer button, .pedals button { height: 46px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blink, .hud .v.bump, .banner { animation: none; }
  }
</style>
</head>
<body>
<div class="cabinet">
  <header class="marquee">
    <h1>YARIŞ</h1>
    <p>Cabinet No. 12 &mdash; 1983</p>
  </header>

  <div class="hud">
    <div><span class="k">DAY</span><span class="v" id="hDay">1</span></div>
    <div class="quota"><span class="k">TO PASS</span><span class="v" id="hQuota">13</span></div>
    <div><span class="k">MPH</span><span class="v" id="hMph">0</span></div>
    <div class="best"><span class="k">BEST</span><span class="v" id="hBest">1</span></div>
  </div>

  <div class="stage" id="stage">
  <div class="screen" id="screen" tabindex="0" aria-label="Racing game screen">
    <canvas id="road" width="320" height="240"></canvas>
    <div class="scan"></div>
    <div class="vignette"></div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">INSERT COIN</h2>
      <p id="ovBody">Pass the quota of cars before nightfall runs out.</p>
      <p class="blink" id="ovBlink">&#9654; PRESS START</p>
    </div>
  </div>
  </div>

  <div class="controls">
    <div class="pad steer">
      <button data-hold="left" aria-label="Steer left">&#9664;</button>
      <button data-hold="right" aria-label="Steer right">&#9654;</button>
    </div>
    <div class="pad pedals">
      <button data-hold="brake">BRAKE</button>
      <button class="gas" data-hold="gas">GAS</button>
    </div>
  </div>

  <div class="sidekeys">
    <button id="btnPause">PAUSE</button>
    <button id="btnSound" aria-pressed="true">SOUND ON</button>
    <button id="btnReset">RESTART</button>
  </div>

  <p class="hint">Hold GAS &middot; &#9664; &#9654; to steer &middot; arrows / WASD on a keyboard &middot; P pauses</p>
</div>

<script>
(function () {
  "use strict";

  /* ---------------- constants ---------------- */
  var VW = 320;                     // internal width; height follows the screen shape
  var VH = 240;
  var HORIZON = 98;                 // sky/ground split, in canvas px
  var ROWS = VH - HORIZON;
  var ROAD_HALF = 152;              // road half-width at the very bottom row
  var BEND_K = 5.6;                 // how hard curves throw the road sideways
  var SEG = 0.62;                   // world length of one stripe
  var MAX_MPH = 180;
  var DAY_SECONDS = 82;
  var CAR_COUNT = 7;

  var canvas  = document.getElementById("road");
  var ctx     = canvas.getContext("2d");
  var screenEl = document.getElementById("screen");
  var stageEl  = document.getElementById("stage");
  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ovTitle");
  var ovBody  = document.getElementById("ovBody");
  var ovBlink = document.getElementById("ovBlink");
  var hDay    = document.getElementById("hDay");
  var hQuota  = document.getElementById("hQuota");
  var hMph    = document.getElementById("hMph");
  var hBest   = document.getElementById("hBest");
  var btnPause = document.getElementById("btnPause");
  var btnSound = document.getElementById("btnSound");
  var btnReset = document.getElementById("btnReset");

  ctx.imageSmoothingEnabled = false;

  /* ---------------- palette: one keyframe per hour of the cycle ---------------- */
  // t, skyTop, skyBot, grassA, grassB, roadA, roadB, rumbleA, rumbleB, haze, seeZ
  var SKYLINE = [
    { t: 0.00, skyTop: [46, 38, 78],   skyBot: [236, 142, 92],  grassA: [56, 86, 58],  grassB: [44, 72, 48],
      roadA: [86, 80, 88],  roadB: [78, 72, 80],  rumbleA: [206, 92, 66], rumbleB: [230, 214, 196], haze: [214, 150, 112], seeZ: 17 },
    { t: 0.16, skyTop: [64, 132, 226], skyBot: [164, 206, 246], grassA: [58, 128, 56], grassB: [44, 106, 46],
      roadA: [98, 98, 104], roadB: [88, 88, 94],  rumbleA: [214, 58, 50], rumbleB: [238, 238, 240], haze: [176, 208, 238], seeZ: 22 },
    { t: 0.50, skyTop: [40, 74, 168],  skyBot: [188, 214, 240], grassA: [62, 134, 60], grassB: [46, 110, 48],
      roadA: [102, 102, 108], roadB: [90, 90, 96], rumbleA: [214, 58, 50], rumbleB: [238, 238, 240], haze: [186, 212, 238], seeZ: 23 },
    { t: 0.66, skyTop: [58, 34, 86],   skyBot: [244, 116, 58],  grassA: [56, 74, 46],  grassB: [42, 60, 38],
      roadA: [84, 74, 74],  roadB: [74, 66, 68],  rumbleA: [198, 72, 52], rumbleB: [226, 206, 188], haze: [212, 122, 74], seeZ: 15 },
    { t: 0.78, skyTop: [8, 8, 24],     skyBot: [22, 22, 54],    grassA: [16, 30, 20],  grassB: [12, 24, 16],
      roadA: [48, 48, 58],  roadB: [40, 40, 50],  rumbleA: [120, 40, 36], rumbleB: [132, 132, 140], haze: [10, 10, 26],  seeZ: 8.5 },
    { t: 0.93, skyTop: [6, 8, 22],     skyBot: [18, 18, 46],    grassA: [16, 30, 20],  grassB: [12, 24, 16],
      roadA: [46, 46, 56],  roadB: [38, 38, 48],  rumbleA: [118, 40, 36], rumbleB: [128, 128, 136], haze: [10, 10, 26],  seeZ: 9 },
    { t: 1.00, skyTop: [46, 38, 78],   skyBot: [236, 142, 92],  grassA: [56, 86, 58],  grassB: [44, 72, 48],
      roadA: [86, 80, 88],  roadB: [78, 72, 80],  rumbleA: [206, 92, 66], rumbleB: [230, 214, 196], haze: [214, 150, 112], seeZ: 17 }
  ];
  var SKY_KEYS = ["skyTop", "skyBot", "grassA", "grassB", "roadA", "roadB", "rumbleA", "rumbleB", "haze"];

  function lerp(a, b, t) { return a + (b - a) * t; }
  function mix(c1, c2, t) {
    return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
  }
  function css(c) { return "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")"; }

  function skyAt(t) {
    var i = 0;
    while (i < SKYLINE.length - 2 && t >= SKYLINE[i + 1].t) i++;
    var a = SKYLINE[i], b = SKYLINE[i + 1];
    var u = (t - a.t) / (b.t - a.t);
    var out = { seeZ: lerp(a.seeZ, b.seeZ, u) };
    for (var k = 0; k < SKY_KEYS.length; k++) {
      var key = SKY_KEYS[k];
      out[key] = mix(a[key], b[key], u);
    }
    return out;
  }

  /* ---------------- state ---------------- */
  var state = "idle";               // idle | running | paused | over
  var travel, speed, playerX, curve, targetCurve, nextCurveAt;
  var day, quota, passedTotal, best, dayTimer, shake, crashT, bannerEl;
  var cars = [];
  var stars = [];
  var soundOn = true;
  var held = { left: false, right: false, gas: false, brake: false };

  /* ---------------- persistence ---------------- */
  function loadBest() {
    try { return parseInt(localStorage.getItem("yaris-best-day"), 10) || 1; } catch (e) { return 1; }
  }
  function saveBest(v) { try { localStorage.setItem("yaris-best-day", String(v)); } catch (e) {} }
  function loadSound() {
    try { var v = localStorage.getItem("yaris-sound"); return v === null ? true : v === "1"; }
    catch (e) { return true; }
  }
  function saveSound(v) { try { localStorage.setItem("yaris-sound", v ? "1" : "0"); } catch (e) {} }

  /* ---------------- audio ---------------- */
  var actx = null, engineOsc = null, engineGain = null;
  function audio() {
    if (actx) return actx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    } catch (e) { return null; }
    return actx;
  }
  function blip(freq, dur, type, vol) {
    if (!soundOn) return;
    var a = audio();
    if (!a) return;
    try {
      if (a.state === "suspended") a.resume();
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, a.currentTime);
      g.gain.setValueAtTime(vol || 0.05, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + dur);
    } catch (e) {}
  }
  function engineOn() {
    if (!soundOn) return;
    var a = audio();
    if (!a || engineOsc) return;
    try {
      if (a.state === "suspended") a.resume();
      engineOsc = a.createOscillator();
      engineGain = a.createGain();
      engineOsc.type = "sawtooth";
      engineOsc.frequency.setValueAtTime(70, a.currentTime);
      engineGain.gain.setValueAtTime(0.018, a.currentTime);
      engineOsc.connect(engineGain);
      engineGain.connect(a.destination);
      engineOsc.start();
    } catch (e) { engineOsc = null; }
  }
  function engineOff() {
    if (!engineOsc) return;
    try { engineOsc.stop(); } catch (e) {}
    engineOsc = null; engineGain = null;
  }
  function engineTune() {
    if (!engineOsc || !actx) return;
    try {
      engineOsc.frequency.setTargetAtTime(64 + speed * 210, actx.currentTime, 0.08);
      engineGain.gain.setTargetAtTime(0.012 + speed * 0.022, actx.currentTime, 0.1);
    } catch (e) {}
  }

  /* ---------------- setup ---------------- */
  // The cabinet screen takes the whole space the layout leaves it, and the
  // internal resolution follows that shape — a tall phone simply sees more road.
  function fit() {
    var r = stageEl.getBoundingClientRect();
    var availW = r.width - 4, availH = r.height - 4;      // 2px bezel each side
    if (availW < 40 || availH < 40) return;

    var aspect = Math.max(0.70, Math.min(1.55, availW / availH));
    var w = Math.min(availW, availH * aspect);
    var h = w / aspect;

    screenEl.style.width = Math.floor(w) + 4 + "px";
    screenEl.style.height = Math.floor(h) + 4 + "px";

    VH = Math.max(200, Math.min(460, Math.round(VW * h / w)));
    canvas.width = VW;
    canvas.height = VH;
    ctx.imageSmoothingEnabled = false;                    // reset by the resize
    HORIZON = Math.round(VH * 0.42);
    ROWS = VH - HORIZON;
    makeStars();
  }

  function makeStars() {
    stars.length = 0;
    for (var i = 0; i < 70; i++) {
      stars.push({
        x: Math.random() * VW,
        y: Math.random() * (HORIZON - 10),
        b: 0.35 + Math.random() * 0.65
      });
    }
  }

  function quotaFor(d) { return 10 + d * 3; }

  function reset(startNow) {
    travel = 0; speed = 0; playerX = 0;
    curve = 0; targetCurve = 0; nextCurveAt = 9;
    day = 1; quota = quotaFor(1); passedTotal = 0;
    dayTimer = 0; shake = 0; crashT = 0;
    cars = [];
    for (var i = 0; i < CAR_COUNT; i++) cars.push(spawnCar(3 + i * 3.4));
    best = loadBest();
    setState(startNow ? "running" : "idle");
    syncHud();
    render(0);
  }

  var CAR_COLORS = [
    [214, 64, 52], [70, 110, 214], [236, 190, 56], [96, 186, 104],
    [226, 226, 230], [180, 84, 200], [232, 128, 48]
  ];

  function spawnCar(aheadZ) {
    return {
      z: travel + aheadZ,
      lx: (Math.random() * 1.5 - 0.75),
      sp: 2.4 + Math.random() * 2.2,
      color: CAR_COLORS[(Math.random() * CAR_COLORS.length) | 0],
      counted: false
    };
  }

  function recycle(car) {
    car.z = travel + 17 + Math.random() * 13;
    car.lx = Math.random() * 1.5 - 0.75;
    car.sp = 2.4 + Math.random() * 2.2;
    car.color = CAR_COLORS[(Math.random() * CAR_COLORS.length) | 0];
    car.counted = false;
  }

  /* ---------------- simulation ---------------- */
  function update(dt) {
    dayTimer += dt;
    if (dayTimer >= DAY_SECONDS) {
      if (quota > 0) return gameOver();
      day++;
      quota = quotaFor(day);
      dayTimer = 0;
      if (day > best) { best = day; saveBest(best); }
      banner("DAY " + (day - 1) + " CLEARED");
      blip(660, 0.09); setTimeout(function () { blip(880, 0.12); }, 110);
      syncHud();
    }

    // throttle
    var offRoad = Math.abs(playerX) > 0.98;
    if (crashT > 0) {
      crashT -= dt;
      speed = Math.max(0, speed - 1.4 * dt);
    } else if (held.brake) {
      speed = Math.max(0, speed - 0.95 * dt);
    } else if (held.gas) {
      speed = Math.min(1, speed + (0.30 - speed * 0.16) * dt * 1.6);
    } else {
      speed = Math.max(0, speed - 0.13 * dt);
    }
    if (offRoad && speed > 0.42) speed = Math.max(0.42, speed - 1.1 * dt);

    // steering + the curve pushing you outward
    var steer = (held.right ? 1 : 0) - (held.left ? 1 : 0);
    if (crashT > 0) steer = 0;
    playerX += steer * dt * (1.05 + speed * 0.9);
    playerX -= curve * speed * speed * 1.35 * dt;
    if (playerX < -1.35) { playerX = -1.35; }
    if (playerX > 1.35)  { playerX = 1.35; }

    // road shape
    travel += speed * 9.2 * dt;
    if (travel > nextCurveAt) {
      nextCurveAt = travel + 7 + Math.random() * 16;
      var roll = Math.random();
      targetCurve = roll < 0.34 ? 0 : (Math.random() * 1.8 - 0.9);
    }
    curve += (targetCurve - curve) * Math.min(1, dt * 0.85);

    // traffic
    for (var i = 0; i < cars.length; i++) {
      var car = cars[i];
      car.z += car.sp * dt;
      var relZ = car.z - travel;

      if (relZ < 0.55) {
        if (!car.counted) {
          car.counted = true;
          passedTotal++;
          if (quota > 0) { quota--; bump(hQuota); }
          syncHud();
          if (quota === 0) { blip(760, 0.1, "triangle"); banner("QUOTA MET"); }
        }
        recycle(car);
        continue;
      }
      if (relZ > 34) { recycle(car); continue; }

      if (crashT <= 0 && relZ < 1.22 && relZ > 0.6 && Math.abs(car.lx - playerX) < 0.44) {
        crashT = 0.75;
        shake = 0.5;
        speed *= 0.22;
        blip(150, 0.22, "sawtooth", 0.08);
        setTimeout(function () { blip(95, 0.3, "sawtooth", 0.07); }, 90);
      }
    }

    if (offRoad && speed > 0.1) shake = Math.max(shake, 0.12);
    if (shake > 0) shake = Math.max(0, shake - dt * 1.3);

    engineTune();
    hMph.textContent = Math.round(speed * MAX_MPH);
  }

  function gameOver() {
    setState("over");
    engineOff();
    blip(220, 0.25, "sawtooth", 0.07);
    setTimeout(function () { blip(150, 0.4, "sawtooth", 0.06); }, 180);
  }

  /* ---------------- rendering ---------------- */
  function render(now) {
    var dayT = (dayTimer / DAY_SECONDS) % 1;
    var sky = skyAt(dayT);
    var night = Math.max(0, Math.min(1, (dayT - 0.68) / 0.1)) *
                (dayT > 0.95 ? Math.max(0, (1 - (dayT - 0.95) / 0.05)) : 1);

    ctx.save();
    if (shake > 0) {
      ctx.translate(Math.round((Math.random() - 0.5) * shake * 9),
                    Math.round((Math.random() - 0.5) * shake * 6));
    }

    drawSky(sky, night, dayT);
    drawGround(sky);
    drawTraffic(sky, night);
    drawPlayer(now, night);
    drawDayBar(dayT);

    ctx.restore();
  }

  function drawSky(sky, night, dayT) {
    var bands = 12;
    for (var i = 0; i < bands; i++) {
      var t = i / (bands - 1);
      ctx.fillStyle = css(mix(sky.skyTop, sky.skyBot, t * t));
      ctx.fillRect(0, Math.floor(i * HORIZON / bands), VW, Math.ceil(HORIZON / bands) + 1);
    }

    if (night > 0.02) {
      for (var s = 0; s < stars.length; s++) {
        var st = stars[s];
        ctx.fillStyle = "rgba(255,255,255," + (st.b * night).toFixed(2) + ")";
        ctx.fillRect(st.x | 0, st.y | 0, 1, 1);
      }
    }

    // sun by day, moon by night, tracking the cycle across the sky
    var arc = dayT < 0.70 ? dayT / 0.70 : (dayT - 0.70) / 0.30;
    var bodyX = 30 + arc * (VW - 60);
    var bodyY = HORIZON - 12 - Math.sin(arc * Math.PI) * (HORIZON - 40);
    ctx.fillStyle = dayT < 0.70 ? "rgba(255, 236, 170, 0.95)" : "rgba(226, 232, 244, 0.9)";
    ctx.beginPath();
    ctx.arc(bodyX, bodyY, dayT < 0.70 ? 11 : 8, 0, Math.PI * 2);
    ctx.fill();

    // ridge line, parallaxed by the curve you are driving into
    var off = -curve * 26 - travel * 0.9;
    ctx.fillStyle = css(mix(sky.skyBot, sky.grassB, 0.62));
    for (var x = 0; x < VW; x += 4) {
      var u = x + off;
      var h = 10 + Math.sin(u * 0.055) * 7 + Math.sin(u * 0.019 + 1.7) * 9 + Math.sin(u * 0.11) * 3;
      if (h < 2) h = 2;
      ctx.fillRect(x, HORIZON - h, 4, h + 1);
    }
  }

  function drawGround(sky) {
    for (var y = 0; y < ROWS; y++) {
      var yy = HORIZON + y;
      var sc = (y + 1) / ROWS;             // 0 at horizon, 1 at bottom
      var z = 1 / sc;                       // relative depth of this row
      var worldZ = travel + z;

      // beyond the day's visibility the road is simply haze — at night that
      // band swallows most of the screen, which is the whole point
      if (z > sky.seeZ) {
        ctx.fillStyle = css(sky.haze);
        ctx.fillRect(0, yy, VW, 1);
        continue;
      }

      var fade = Math.min(1, Math.max(0, (z - 2.2) / (sky.seeZ - 2.2)));
      fade = fade * fade;

      var stripe = (Math.floor(worldZ / SEG) & 1) === 0;
      var grass = mix(stripe ? sky.grassA : sky.grassB, sky.haze, fade);
      var road  = mix(stripe ? sky.roadA  : sky.roadB,  sky.haze, fade);
      var rum   = mix(stripe ? sky.rumbleA : sky.rumbleB, sky.haze, fade);

      ctx.fillStyle = css(grass);
      ctx.fillRect(0, yy, VW, 1);

      var half = ROAD_HALF * sc;
      var cx = VW / 2 + curve * BEND_K * (z - 1) - playerX * ROAD_HALF * sc;
      var rw = Math.max(1, half * 0.11);

      ctx.fillStyle = css(rum);
      ctx.fillRect(cx - half - rw, yy, half * 2 + rw * 2, 1);
      ctx.fillStyle = css(road);
      ctx.fillRect(cx - half, yy, half * 2, 1);

      if (stripe && half > 14) {
        ctx.fillStyle = css(mix([228, 228, 228], sky.haze, fade));
        ctx.fillRect(cx - half * 0.022, yy, Math.max(1, half * 0.044), 1);
      }
    }
  }

  function drawTraffic(sky, night) {
    var sorted = cars.slice().sort(function (a, b) { return (b.z - travel) - (a.z - travel); });
    for (var i = 0; i < sorted.length; i++) {
      var car = sorted[i];
      var relZ = car.z - travel;
      if (relZ <= 0.5 || relZ > sky.seeZ) continue;
      var sc = 1 / relZ;
      if (sc > 1.6) continue;

      var yy = HORIZON + sc * ROWS;
      var cx = VW / 2 + curve * BEND_K * (relZ - 1) - playerX * ROAD_HALF * sc + car.lx * ROAD_HALF * sc;
      var w = Math.max(2, 86 * sc);
      var h = w * 0.66;
      var fade = Math.min(0.92, Math.max(0, (relZ - 2.2) / (sky.seeZ - 2.2)));
      fade = fade * fade;

      drawCarSprite(ctx, cx, yy, w, h, mix(car.color, sky.haze, fade), night, false);
    }
  }

  function drawCarSprite(c, cx, baseY, w, h, body, night, isPlayer) {
    var x = Math.round(cx - w / 2), y = Math.round(baseY - h);
    w = Math.round(w); h = Math.round(h);
    var unit = Math.max(1, Math.round(w / 16));

    // shadow
    c.fillStyle = "rgba(0,0,0,0.35)";
    c.fillRect(x, Math.round(baseY - unit), w, Math.max(1, unit));

    // body + cabin
    c.fillStyle = css(body);
    c.fillRect(x, y + unit * 2, w, h - unit * 2);
    c.fillStyle = css(mix(body, [0, 0, 0], 0.32));
    c.fillRect(x + unit * 3, y, w - unit * 6, unit * 3);

    // window
    c.fillStyle = css(mix(body, [10, 14, 24], 0.78));
    c.fillRect(x + unit * 4, y + unit, w - unit * 8, unit * 2);

    // wheels
    c.fillStyle = "#14120f";
    c.fillRect(x - unit, y + h - unit * 3, unit * 2, unit * 3);
    c.fillRect(x + w - unit, y + h - unit * 3, unit * 2, unit * 3);

    // lamps: taillights ahead of you, headlights on the player's own car
    if (isPlayer) {
      c.fillStyle = "#ffe9a8";
      c.fillRect(x + unit, y + unit * 3, unit * 2, unit);
      c.fillRect(x + w - unit * 3, y + unit * 3, unit * 2, unit);
    } else if (w > 7) {
      c.fillStyle = night > 0.25 ? "#ff5a3c" : "#c03828";
      c.fillRect(x + unit, y + h - unit * 5, unit * 2, unit * 2);
      c.fillRect(x + w - unit * 3, y + h - unit * 5, unit * 2, unit * 2);
    }
  }

  function drawPlayer(now, night) {
    var bob = Math.sin(now / 90) * speed * 1.6;
    var wobble = crashT > 0 ? Math.sin(now / 28) * 9 : 0;
    var steerLean = ((held.right ? 1 : 0) - (held.left ? 1 : 0)) * 3;
    var cx = VW / 2 + steerLean + wobble;
    var baseY = VH - 10 + bob;
    drawCarSprite(ctx, cx, baseY, 92, 58, crashT > 0 && Math.floor(now / 70) % 2 === 0
      ? [255, 255, 255] : [228, 76, 44], night, true);

    // dust/spray when you drop a wheel onto the grass
    if (Math.abs(playerX) > 0.98 && speed > 0.08) {
      ctx.fillStyle = "rgba(190,170,130,0.5)";
      for (var i = 0; i < 6; i++) {
        ctx.fillRect(cx - 46 + Math.random() * 92, baseY - Math.random() * 14, 2, 2);
      }
    }
  }

  function drawDayBar(dayT) {
    // the strip under the sky doubles as the clock for the current day
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(0, 0, VW, 3);
    ctx.fillStyle = quota > 0 ? "#ffb02e" : "#6fe36a";
    ctx.fillRect(0, 0, Math.round(VW * (1 - dayT)), 3);
  }

  /* ---------------- loop ---------------- */
  var lastTs = 0;
  function frame(now) {
    var dt = lastTs ? Math.min(0.05, (now - lastTs) / 1000) : 0;
    lastTs = now;
    if (state === "running") update(dt);
    render(now);
    requestAnimationFrame(frame);
  }

  /* ---------------- hud + overlay ---------------- */
  function bump(el) {
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  function syncHud() {
    hDay.textContent = day;
    hQuota.textContent = quota > 0 ? quota : "OK";
    hQuota.classList.toggle("done", quota === 0);
    hBest.textContent = best;
  }

  function banner(text) {
    if (bannerEl && bannerEl.parentNode) bannerEl.parentNode.removeChild(bannerEl);
    bannerEl = document.createElement("div");
    bannerEl.className = "banner";
    bannerEl.textContent = text;
    screenEl.appendChild(bannerEl);
    var mine = bannerEl;
    setTimeout(function () {
      if (mine.parentNode) mine.parentNode.removeChild(mine);
    }, 1900);
  }

  function setState(next) {
    state = next;
    btnPause.textContent = state === "paused" ? "RESUME" : "PAUSE";

    if (state === "running") {
      overlay.hidden = true;
      engineOn();
      return;
    }
    engineOff();
    overlay.hidden = false;
    ovTitle.classList.toggle("over", state === "over");

    if (state === "idle") {
      ovTitle.textContent = "INSERT COIN";
      ovBody.innerHTML = "Pass <em>" + quota + "</em> cars before the day runs out. " +
                         "Nightfall is the timer &mdash; and you still have to drive in it.";
      ovBlink.innerHTML = "&#9654; PRESS START";
    } else if (state === "paused") {
      ovTitle.textContent = "PAUSED";
      ovBody.textContent = "Engine idling.";
      ovBlink.innerHTML = "&#9654; TAP OR PRESS P";
    } else if (state === "over") {
      ovTitle.textContent = "OUT OF ROAD";
      ovBody.innerHTML = "Reached day <em>" + day + "</em> &middot; passed <em>" + passedTotal +
                         "</em> cars" + (day >= best && day > 1 ? " &middot; <em>BEST RUN</em>" : "") +
                         "<br>Needed <em>" + quota + "</em> more before nightfall.";
      ovBlink.innerHTML = "&#9654; TAP TO RACE AGAIN";
    }
  }

  function start() {
    lastTs = 0;
    setState("running");
    blip(520, 0.06);
  }
  function togglePause() {
    if (state === "running") setState("paused");
    else if (state === "paused") start();
  }
  function primary() {
    if (state === "idle" || state === "paused") start();
    else if (state === "over") reset(true);
    else setState("paused");
  }

  /* ---------------- input ---------------- */
  var KEYS = {
    ArrowLeft: "left", a: "left", A: "left",
    ArrowRight: "right", d: "right", D: "right",
    ArrowUp: "gas", w: "gas", W: "gas",
    ArrowDown: "brake", s: "brake", S: "brake"
  };

  window.addEventListener("keydown", function (ev) {
    var k = KEYS[ev.key];
    if (k) {
      ev.preventDefault();
      if (state === "idle") start();
      held[k] = true;
      return;
    }
    if (ev.key === "p" || ev.key === "P") { ev.preventDefault(); togglePause(); }
    else if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); primary(); }
    else if (ev.key === "r" || ev.key === "R") { ev.preventDefault(); reset(true); }
  });
  window.addEventListener("keyup", function (ev) {
    var k = KEYS[ev.key];
    if (k) { ev.preventDefault(); held[k] = false; }
  });
  window.addEventListener("blur", function () {
    held.left = held.right = held.gas = held.brake = false;
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-hold]"), function (b) {
    var k = b.dataset.hold;
    var press = function (ev) {
      ev.preventDefault();
      if (state === "idle") start();
      held[k] = true;
      b.classList.add("held");
      if (b.setPointerCapture && ev.pointerId !== undefined) {
        try { b.setPointerCapture(ev.pointerId); } catch (e) {}
      }
    };
    var release = function (ev) {
      if (ev) ev.preventDefault();
      held[k] = false;
      b.classList.remove("held");
    };
    b.addEventListener("pointerdown", press);
    b.addEventListener("pointerup", release);
    b.addEventListener("pointercancel", release);
    b.addEventListener("pointerleave", release);
    b.addEventListener("click", function (ev) { ev.preventDefault(); });
    b.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });
  });

  screenEl.addEventListener("pointerup", function (ev) { ev.preventDefault(); primary(); });
  screenEl.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });

  btnPause.addEventListener("click", togglePause);
  btnReset.addEventListener("click", function () { reset(true); });
  btnSound.addEventListener("click", function () {
    soundOn = !soundOn;
    saveSound(soundOn);
    btnSound.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    btnSound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    if (!soundOn) engineOff();
    else { blip(600, 0.05); if (state === "running") engineOn(); }
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && state === "running") setState("paused");
  });

  /* ---------------- boot ---------------- */
  function boot(saved) {
    fit();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(stageEl);
    window.addEventListener("resize", fit);
    soundOn = loadSound();
    btnSound.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    btnSound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    reset(false);
    if (saved && saved.best > best) { best = saved.best; saveBest(best); }
    syncHud();
    requestAnimationFrame(frame);
  }

  if (window.claude && window.claude.hot) {
    try { window.claude.hot.snapshot(function () { return { best: best || 1 }; }); } catch (e) {}
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(boot);
  } else {
    boot({});
  }
})();
</script>
</body>
</html>
